<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="bgA1" cx="50%" cy="60%" r="58%">
      <stop offset="0%" stop-color="#3B4D14" />
      <stop offset="65%" stop-color="#1E270C" />
      <stop offset="100%" stop-color="#141A08" />
    </radialGradient>
    <linearGradient id="leafLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5F993" />
      <stop offset="100%" stop-color="#84A329" />
    </linearGradient>
    <linearGradient id="leafRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4EE7F" />
      <stop offset="100%" stop-color="#5E7511" />
