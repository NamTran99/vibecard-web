  <path d="M 53 43 Q 62 36, 68 28" fill="none" stroke="#283500" stroke-width="1.6" stroke-linecap="round" opacity="0.65" />

  <!-- Golden Dewdrop & Firefly Spark -->
  <circle cx="67" cy="48" r="3" fill="#FBBF24" />
  <circle cx="31" cy="56" r="2" fill="#FDE68A" opacity="0.85" />
