  </defs>

  <!-- Medallion Frame -->
  <circle cx="50" cy="50" r="46" fill="url(#bgA1)" stroke="#B8D166" stroke-width="2.2" stroke-opacity="0.6" />
  <circle cx="50" cy="50" r="42" fill="none" stroke="#D4EE7F" stroke-width="0.9" stroke-dasharray="3 3" stroke-opacity="0.32" />

  <!-- Mossy Soil Mound -->
  <path d="M 23 78 Q 50 68, 77 78 Q 67 88, 50 89 Q 33 88, 23 78 Z" fill="#3D2E1E" stroke="#6E8524" stroke-width="2" stroke-linecap="round" />

  <!-- Organic Tender Stem -->
  <path d="M 50 75 Q 48 58, 51 42" fill="none" stroke="#B8D166" stroke-width="4.2" stroke-linecap="round" />

  <!-- Left Cotyledon Leaf -->
  <path d="M 50 51 C 34 51, 22 40, 25 29 C 36 27, 48 36, 50 51 Z" fill="url(#leafLeft)" stroke="#283500" stroke-width="2.2" stroke-linejoin="round" />
  <path d="M 48 49 Q 37 42, 31 34" fill="none" stroke="#283500" stroke-width="1.6" stroke-linecap="round" opacity="0.65" />

  <!-- Right Cotyledon Leaf -->
