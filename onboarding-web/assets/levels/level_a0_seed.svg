  <!-- Organic Medallion Badge -->
  <circle cx="50" cy="50" r="46" fill="url(#bgA0)" stroke="#B8D166" stroke-width="2.2" stroke-opacity="0.55" />
  <circle cx="50" cy="50" r="42" fill="none" stroke="#FBBF24" stroke-width="0.9" stroke-dasharray="3 3" stroke-opacity="0.35" />

  <!-- Ambient Seed Aura -->
