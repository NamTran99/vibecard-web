<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 380" width="380" height="380" fill="none">
  <defs>
    <style>
      @keyframes f6AnimeFloat {
        0%, 100% { transform: translateY(0px) rotate(-1.5deg); }
        50%      { transform: translateY(-12px) rotate(1.5deg); }
      }
      @keyframes f6TailFlow {
        0%, 100% { transform: rotate(-10deg) scale(1); }
        50%      { transform: rotate(12deg) scale(1.04); }
      }
      @keyframes f6PawCheer {
        0%, 100% { transform: translateY(0px); }
        50%      { transform: translateY(-8px); }
      }
      @keyframes f6Blink {
        0%, 46%, 50%, 96%, 100% { transform: scaleY(1); }
        48%                     { transform: scaleY(0.08); }
      }

      .f6-rig  { transform-origin: 185px 220px; animation: f6AnimeFloat 2.4s ease-in-out infinite; }
      .f6-tail { transform-origin: 215px 282px; animation: f6TailFlow 2.4s ease-in-out infinite; }
      .f6-paws { transform-origin: 185px 236px; animation: f6PawCheer 1.2s ease-in-out infinite; }
      .f6-eyes { transform-origin: 185px 158px; animation: f6Blink 4.6s infinite; }
    </style>

    <linearGradient id="f6AnimeGold" x1="100" y1="60" x2="270" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFB74D" />
      <stop offset="55%" stop-color="#FF7043" />
      <stop offset="100%" stop-color="#D84315" />
    </linearGradient>
    <linearGradient id="f6RubyEye" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#880E4F" />
      <stop offset="55%" stop-color="#E91E63" />
      <stop offset="100%" stop-color="#FFCC80" />
    </linearGradient>
  </defs>

  <ellipse cx="185" cy="348" rx="82" ry="12" fill="#311B92" opacity="0.26" />

  <g class="f6-rig">
    <!-- Chiếc đuôi hình ngọn lửa Anime 3 tà uốn lượn -->
    <g class="f6-tail">
      <path d="M 206 286 C 242 232, 304 178, 348 192 C 334 222, 356 238, 362 254 C 332 296, 268 318, 206 302 Z" fill="url(#f6AnimeGold)" stroke="#3E1208" stroke-width="4" stroke-linejoin="round" />
      <path d="M 296 190 C 316 186, 334 188, 348 192 C 334 222, 356 238, 362 254 C 344 278, 318 294, 290 302 C 296 276, 282 266, 272 272 C 284 248, 278 218, 296 190 Z" fill="#FFFDF9" stroke="#3E1208" stroke-width="4" stroke-linejoin="round" />
    </g>

    <!-- Thân nhỏ thanh thoát & 2 chân sau bật nhẹ -->
    <path d="M 146 212 C 134 248, 136 296, 152 316 L 218 316 C 234 296, 236 248, 224 212 Z" fill="url(#f6AnimeGold)" stroke="#3E1208" stroke-width="4" />
    <path d="M 158 220 C 150 252, 154 296, 185 316 C 216 296, 220 252, 212 220 Z" fill="#FFFDF9" />
    <ellipse cx="152" cy="320" rx="15" ry="11" fill="#3E1208" />
    <ellipse cx="218" cy="320" rx="15" ry="11" fill="#3E1208" />

    <!-- Vòng cổ Đỏ Thần Đạo gắn Chuông Vàng Lớn & Nơ Tím -->
    <path d="M 134 212 Q 185 232, 236 212" stroke="#E53935" stroke-width="11" stroke-linecap="round" fill="none" />
    <circle cx="185" cy="226" r="15" fill="#FFD54F" stroke="#3E1208" stroke-width="3.5" />
    <circle cx="185" cy="230" r="3.5" fill="#3E1208" />
    <line x1="175" y1="222" x2="195" y2="222" stroke="#3E1208" stroke-width="3" />

    <!-- Hai bàn chân trước thu trước ngực kiểu linh vật Nhật Bản (Maneki / Vulpix) -->
    <g class="f6-paws">
      <path d="M 142 234 C 122 238, 118 264, 136 270 C 150 274, 158 256, 150 240 Z" fill="url(#f6AnimeGold)" stroke="#3E1208" stroke-width="4" />
      <path d="M 228 234 C 248 222, 266 196, 258 178 C 250 164, 232 174, 228 194 C 224 210, 220 222, 216 230 Z" fill="url(#f6AnimeGold)" stroke="#3E1208" stroke-width="4" />
      <circle cx="136" cy="264" r="10" fill="#FFFDF9" stroke="#3E1208" stroke-width="3.5" />
      <circle cx="250" cy="182" r="11" fill="#FFFDF9" stroke="#3E1208" stroke-width="3.5" />
      <circle cx="250" cy="183" r="4.5" fill="#FF80AB" />
    </g>

    <!-- ĐẦU LINH VẬT ANIME SẮC SẢO VỚI CHÙM LÔNG ĐỈNH ĐẦU XOẮN & NGÔI SAO TRÁN -->
    <g>
      <!-- Hai tai thon dài vát chéo sắc nét -->
      <path d="M 114 118 C 82 72, 68 18, 92 12 C 118 8, 152 52, 162 96 Z" fill="url(#f6AnimeGold)" stroke="#3E1208" stroke-width="4" stroke-linejoin="round" />
      <path d="M 78 44 C 82 22, 86 14, 92 12 C 106 10, 122 26, 134 46 C 114 50, 96 48, 78 44 Z" fill="#3E1208" />
      <path d="M 120 108 C 96 72, 88 38, 100 32 C 114 32, 136 62, 144 96 Z" fill="#FFCCBC" />

      <path d="M 256 118 C 288 72, 302 18, 278 12 C 252 8, 218 52, 208 96 Z" fill="url(#f6AnimeGold)" stroke="#3E1208" stroke-width="4" stroke-linejoin="round" />
      <path d="M 292 44 C 288 22, 284 14, 278 12 C 264 10, 248 26, 236 46 C 256 50, 274 48, 292 44 Z" fill="#3E1208" />
      <path d="M 250 108 C 274 72, 282 38, 270 32 C 256 32, 234 62, 226 96 Z" fill="#FFCCBC" />

      <!-- Khuôn mặt kim cương mềm có 2 tia lông má sắc nét kiểu Anime -->
      <path d="M 185 72 C 238 72, 268 110, 274 154 L 294 164 L 270 180 L 282 192 L 248 200 C 228 212, 208 216, 185 216 C 162 216, 142 212, 122 200 L 88 192 L 100 180 L 76 164 L 96 154 C 102 110, 132 72, 185 72 Z" fill="url(#f6AnimeGold)" stroke="#3E1208" stroke-width="4" stroke-linejoin="round" />

      <!-- Mảng má trắng kem cắt chéo thanh thoát -->
      <path d="M 76 164 C 108 152, 148 158, 170 178 C 178 172, 192 172, 200 178 C 222 158, 262 152, 294 164 L 270 180 L 282 192 L 248 200 C 228 212, 208 216, 185 216 C 162 216, 142 212, 122 200 L 88 192 L 100 180 Z" fill="#FFFDF9" stroke="#3E1208" stroke-width="4" stroke-linejoin="round" />

      <!-- Chùm lông xoắn màu kem trên đỉnh đầu & Dấu ấn Ngôi Sao Vàng giữa trán -->
      <path d="M 162 78 C 154 50, 182 40, 192 62 C 204 46, 224 58, 208 80 Z" fill="#FFFDF9" stroke="#3E1208" stroke-width="4" stroke-linejoin="round" />
      <polygon points="185,96 190,108 202,112 190,116 185,128 180,116 168,112 180,108" fill="#FFEE58" />

      <!-- Đôi mắt Anime Hồng Ngọc - Vàng Kim (Ruby-Gold Anime Eyes) -->
      <g class="f6-eyes">
        <path d="M 118 144 C 124 128, 152 128, 158 146 C 160 166, 148 178, 138 178 C 124 178, 116 164, 118 144 Z" fill="#FFFFFF" stroke="#3E1208" stroke-width="3.5" />
        <ellipse cx="140" cy="156" rx="13" ry="16" fill="url(#f6RubyEye)" />
        <ellipse cx="140" cy="155" rx="6.5" ry="10" fill="#2B0918" />
        <circle cx="133" cy="145" r="5.5" fill="#FFFFFF" />
        <circle cx="146" cy="164" r="3" fill="#FFF59D" />
        <path d="M 112 142 C 122 124, 152 124, 162 142" stroke="#3E1208" stroke-width="5.5" stroke-linecap="round" fill="none" />

        <path d="M 252 144 C 246 128, 218 128, 212 146 C 210 166, 222 178, 232 178 C 246 178, 254 164, 252 144 Z" fill="#FFFFFF" stroke="#3E1208" stroke-width="3.5" />
        <ellipse cx="230" cy="156" rx="13" ry="16" fill="url(#f6RubyEye)" />
        <ellipse cx="230" cy="155" rx="6.5" ry="10" fill="#2B0918" />
        <circle cx="223" cy="145" r="5.5" fill="#FFFFFF" />
        <circle cx="236" cy="164" r="3" fill="#FFF59D" />
        <path d="M 258 142 C 248 124, 218 124, 208 142" stroke="#3E1208" stroke-width="5.5" stroke-linecap="round" fill="none" />
      </g>

      <ellipse cx="185" cy="174" rx="6" ry="4" fill="#3E1208" />
      <path d="M 170 186 Q 185 198, 200 186" stroke="#3E1208" stroke-width="3.8" stroke-linecap="round" fill="none" />
    </g>
  </g>
</svg>