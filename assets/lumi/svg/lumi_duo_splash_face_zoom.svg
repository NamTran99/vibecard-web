<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 420" width="360" height="420" fill="none">
  <defs>
    <style>
      /* Chuỗi hoạt cảnh 3.2s lặp lại mô phỏng đúng khoảnh khắc mở App Duolingo */
      @keyframes d1FacePop {
        0%   { transform: scale(0.1) translateY(80px); opacity: 0; }
        14%  { transform: scale(1.14, 0.88) translateY(-10px); opacity: 1; }
        22%  { transform: scale(0.94, 1.06) translateY(4px); opacity: 1; }
        30%  { transform: scale(1.03, 0.98) translateY(0px); opacity: 1; }
        38%, 65% { transform: scale(1, 1) rotate(-3deg) translateY(-4px); opacity: 1; }
        80%, 100% { transform: scale(1, 1) rotate(0deg) translateY(0px); opacity: 1; }
      }
      @keyframes d1EarLeftFlap {
        0%, 12% { transform: rotate(-28deg); }
        22%     { transform: rotate(14deg); }
        32%, 100% { transform: rotate(0deg); }
      }
      @keyframes d1EarRightFlap {
        0%, 12% { transform: rotate(28deg); }
        22%     { transform: rotate(-16deg); }
        32%, 45% { transform: rotate(0deg); }
        52%     { transform: rotate(12deg); }
        62%, 100% { transform: rotate(0deg); }
      }
      /* Mắt phải nháy mắt tinh nghịch (Signature Duolingo Wink) ở giữa chu kỳ */
      @keyframes d1WinkRight {
        0%, 42%, 64%, 100% { transform: scaleY(1); }
        47%, 58%           { transform: scaleY(0.08); }
      }
      @keyframes d1BlinkLeft {
        0%, 82%, 88%, 100% { transform: scaleY(1); }
        85%                { transform: scaleY(0.08); }
      }
      /* Tay thò lên vẫy chào nhanh ở góc dưới như mascot Duolingo */
      @keyframes d1PawPopWave {
        0%, 24%  { transform: translateY(70px) rotate(-20deg); opacity: 0; }
        34%      { transform: translateY(0px) rotate(16deg); opacity: 1; }
        44%      { transform: translateY(0px) rotate(-14deg); opacity: 1; }
        54%      { transform: translateY(0px) rotate(18deg); opacity: 1; }
        64%, 100% { transform: translateY(0px) rotate(4deg); opacity: 1; }
      }
      /* Sao 4 cánh Duolingo nổ tung khi mặt Lumi Pop-up */
      @keyframes d1StarBurst {
        0%, 14% { transform: scale(0); opacity: 0; }
        26%     { transform: scale(1.25) rotate(15deg); opacity: 1; }
        45%, 100% { transform: scale(0.95) rotate(0deg); opacity: 0.85; }
      }

      .d1-face  { transform-origin: 180px 210px; animation: d1FacePop 3.4s cubic-bezier(0.22, 1, 0.36, 1) infinite; }
      .d1-earL  { transform-origin: 108px 104px; animation: d1EarLeftFlap 3.4s ease-out infinite; }
      .d1-earR  { transform-origin: 252px 104px; animation: d1EarRightFlap 3.4s ease-out infinite; }
      .d1-eyeL  { transform-origin: 126px 182px; animation: d1BlinkLeft 3.4s infinite; }
      .d1-eyeR  { transform-origin: 234px 182px; animation: d1WinkRight 3.4s infinite; }
      .d1-paw   { transform-origin: 278px 310px; animation: d1PawPopWave 3.4s ease-in-out infinite; }
      .d1-stars { transform-origin: 180px 190px; animation: d1StarBurst 3.4s ease-out infinite; }
    </style>
  </defs>

  <!-- Các ngôi sao 4 cánh chuẩn Duolingo nổ ra xung quanh -->
  <g class="d1-stars">
    <path d="M 46 92 Q 46 108, 62 108 Q 46 108, 46 124 Q 46 108, 30 108 Q 46 108, 46 92 Z" fill="#FFC800" />
    <path d="M 316 84 Q 316 98, 330 98 Q 316 98, 316 112 Q 316 98, 302 98 Q 316 98, 316 84 Z" fill="#FFC800" />
    <circle cx="42" cy="238" r="7" fill="#FF9600" />
    <circle cx="322" cy="224" r="8" fill="#FFC800" />
  </g>

  <!-- KHUÔN MẶT CẬN CẢNH CÁO LUMI PHONG CÁCH VECTOR PHẲNG DUOLINGO -->
  <g class="d1-face">
    <!-- Tai Trái lớn hình học phẳng sắc nét -->
    <g class="d1-earL">
      <path d="M 54 148 C 30 90, 42 22, 74 14 C 106 10, 144 56, 154 110 Z" fill="#FF781F" />
      <path d="M 43 56 C 50 28, 60 16, 74 14 C 90 12, 108 28, 120 52 C 96 60, 68 62, 43 56 Z" fill="#3C1B08" />
      <path d="M 70 134 C 54 92, 62 46, 78 36 C 96 38, 118 74, 126 112 Z" fill="#FFB49A" />
    </g>

    <!-- Tai Phải -->
    <g class="d1-earR">
      <path d="M 306 148 C 330 90, 318 22, 286 14 C 254 10, 216 56, 206 110 Z" fill="#FF781F" />
      <path d="M 317 56 C 310 28, 300 16, 286 14 C 270 12, 252 28, 240 52 C 264 60, 292 62, 317 56 Z" fill="#3C1B08" />
      <path d="M 290 134 C 306 92, 298 46, 282 36 C 264 38, 242 74, 234 112 Z" fill="#FFB49A" />
    </g>

    <!-- Phần cổ & Khăn vàng Duolingo gọn gàng phía dưới -->
    <path d="M 116 268 L 244 268 L 256 324 C 256 336, 104 336, 104 324 Z" fill="#E05A00" />
    <rect x="96" y="264" width="168" height="36" rx="18" fill="#FFC800" />
    <path d="M 142 292 L 182 292 L 188 338 L 136 338 Z" fill="#FFB100" />
    <rect x="140" y="266" width="44" height="34" rx="12" fill="#FFE066" />

    <!-- Đầu Cáo Hình Học Bo Tròn Đậm Chất Duolingo (Flat Vector + Clean Shadow) -->
    <path d="M 180 72 C 256 72, 302 126, 308 190 C 316 206, 306 232, 282 244 C 254 260, 220 268, 180 268 C 140 268, 106 260, 78 244 C 54 232, 44 206, 52 190 C 58 126, 104 72, 180 72 Z" fill="#FF781F" />
    <!-- Chỏm lông đỉnh đầu -->
    <path d="M 156 76 C 154 54, 170 50, 180 64 C 182 46, 200 48, 202 66 Z" fill="#FF9600" />

    <!-- Mảng má trắng kem phẳng sắc nét kiểu Duolingo -->
    <path d="M 52 194 C 78 168, 130 168, 162 196 C 172 188, 188 188, 198 196 C 230 168, 282 168, 308 194 C 314 210, 304 232, 282 244 C 254 260, 220 268, 180 268 C 140 268, 106 260, 78 244 C 56 232, 46 210, 52 194 Z" fill="#FFFDF7" />

    <!-- Lông mày viên thuốc (Pill Eyebrows) đặc trưng của Duolingo -->
    <rect x="102" y="122" width="38" height="12" rx="6" transform="rotate(-10 121 128)" fill="#FFFDF7" />
    <rect x="220" y="122" width="38" height="12" rx="6" transform="rotate(10 239 128)" fill="#FFFDF7" />

    <!-- Đôi mắt Viên Thuốc Khổng Lồ (Duolingo Giant Pill Eyes) -->
    <g class="d1-eyeL">
      <rect x="98" y="144" width="56" height="72" rx="28" fill="#FFFFFF" />
      <rect x="108" y="154" width="42" height="56" rx="21" fill="#3C1B08" />
      <circle cx="120" cy="168" r="10" fill="#FFFFFF" />
      <circle cx="136" cy="194" r="5" fill="#FFC800" />
    </g>

    <g class="d1-eyeR">
      <rect x="206" y="144" width="56" height="72" rx="28" fill="#FFFFFF" />
      <rect x="210" y="154" width="42" height="56" rx="21" fill="#3C1B08" />
      <circle cx="222" cy="168" r="10" fill="#FFFFFF" />
      <circle cx="238" cy="194" r="5" fill="#FFC800" />
    </g>

    <!-- Má hồng hình elip gọn -->
    <ellipse cx="82" cy="214" rx="16" ry="9" fill="#FF8FA3" opacity="0.7" />
    <ellipse cx="278" cy="214" rx="16" ry="9" fill="#FF8FA3" opacity="0.7" />

    <!-- Mũi tam giác bo tròn & Khuôn miệng cười lớn kiểu Duo -->
    <path d="M 164 196 C 164 188, 196 188, 196 196 C 196 206, 184 214, 180 214 C 176 214, 164 206, 164 196 Z" fill="#3C1B08" />
    <ellipse cx="176" cy="193" rx="6" ry="2.5" fill="#8C5843" />

    <path d="M 150 218 L 210 218 C 210 248, 150 248, 150 218 Z" fill="#3C1B08" />
    <path d="M 162 232 C 170 226, 190 226, 198 232 C 194 244, 166 244, 162 232 Z" fill="#FF6B8B" />

    <!-- Bàn tay thò lên vẫy chào ở góc phải dưới -->
    <g class="d1-paw">
      <path d="M 252 324 C 256 286, 274 252, 296 254 C 316 256, 318 288, 298 324 Z" fill="#FF781F" />
      <circle cx="292" cy="268" r="20" fill="#3C1B08" />
      <ellipse cx="292" cy="272" rx="8" ry="6" fill="#FF8FA3" />
      <circle cx="281" cy="259" r="3.5" fill="#FF8FA3" />
      <circle cx="292" cy="256" r="3.5" fill="#FF8FA3" />
      <circle cx="303" cy="259" r="3.5" fill="#FF8FA3" />
    </g>
  </g>

  <!-- Chữ Logo thương hiệu đồng bộ phía dưới như màn hình Splash Duolingo -->
  <text x="180" y="388" text-anchor="middle" fill="#FFC800" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="28" letter-spacing="2">MINDCARD</text>
</svg>