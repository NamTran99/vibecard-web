<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="100%" height="100%">
  <defs>
    <radialGradient id="bg5" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD6E0" stop-opacity="0.48"/>
      <stop offset="100%" stop-color="#FFD6E0" stop-opacity="0"/>
    </radialGradient>
    <style>
      svg { overflow: visible; }
      .rig-bounce {
        transform-origin: 140px 235px;
        animation: bodyBounce 1.7s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
      }
      .rig-head {
        transform-origin: 140px 145px;
        animation: headTilt 2.2s ease-in-out infinite;
      }
      .rig-ear-l {
        transform-origin: 92px 82px;
        animation: earLeft 2.0s ease-in-out infinite;
      }
      .rig-ear-r {
        transform-origin: 188px 82px;
        animation: earRight 2.0s ease-in-out infinite;
      }
      .rig-tail {
        transform-origin: 175px 205px;
        animation: tailWag 0.95s ease-in-out infinite alternate;
      }
      .rig-arm-l {
        transform-origin: 90px 168px;
        animation: armWave 0.75s ease-in-out infinite alternate;
      }
      .rig-arm-r {
        transform-origin: 186px 168px;
        animation: armProp 1.1s ease-in-out infinite alternate;
      }
      .rig-eyes {
        transform-origin: 140px 124px;
        animation: eyeBlink 3.4s ease-in-out infinite;
      }
      .rig-cheeks {
        transform-origin: 140px 138px;
        animation: cheekPulse 1.5s ease-in-out infinite alternate;
      }
      .rig-shadow {
        transform-origin: 140px 248px;
        animation: shadowScale 1.7s ease-in-out infinite;
      }
      .sparkle-a {
        transform-origin: 42px 68px;
        animation: starTwinkle 1.5s ease-in-out infinite;
      }
      .sparkle-b {
        transform-origin: 238px 64px;
        animation: starTwinkle 1.9s ease-in-out infinite 0.5s;
      }
      .float-heart {
        transform-origin: 140px 36px;
        animation: heartFloat 1.8s ease-in-out infinite;
      }
      @keyframes bodyBounce {
        0%, 100% { transform: translateY(0px) scale(1.03, 0.97); }
        45% { transform: translateY(-13px) scale(0.97, 1.04); }
        75% { transform: translateY(-4px) scale(1.01, 0.99); }
      }
      @keyframes headTilt {
        0%, 100% { transform: rotate(-4deg) translateY(0px); }
        50% { transform: rotate(4deg) translateY(-3px); }
      }
      @keyframes earLeft {
        0%, 100% { transform: rotate(0deg); }
        30% { transform: rotate(-12deg); }
        60% { transform: rotate(5deg); }
      }
      @keyframes earRight {
        0%, 100% { transform: rotate(0deg); }
        40% { transform: rotate(12deg); }
        70% { transform: rotate(-4deg); }
      }
      @keyframes tailWag {
        0% { transform: rotate(-16deg) scale(1); }
        100% { transform: rotate(18deg) scale(1.05); }
      }
      @keyframes armWave {
        0% { transform: rotate(-22deg); }
        100% { transform: rotate(30deg); }
      }
      @keyframes armProp {
        0% { transform: rotate(12deg) translateY(0px); }
        100% { transform: rotate(-18deg) translateY(-4px); }
      }
      @keyframes eyeBlink {
        0%, 44%, 52%, 94%, 100% { transform: scaleY(1); }
        48%, 97% { transform: scaleY(0.08); }
      }
      @keyframes cheekPulse {
        0% { opacity: 0.65; transform: scale(0.95); }
        100% { opacity: 0.98; transform: scale(1.1); }
      }
      @keyframes shadowScale {
        0%, 100% { transform: scale(1, 1); opacity: 0.22; }
        45% { transform: scale(0.82, 0.85); opacity: 0.12; }
      }
      @keyframes starTwinkle {
        0%, 100% { transform: scale(0.65) rotate(0deg); opacity: 0.45; }
        50% { transform: scale(1.22) rotate(22deg); opacity: 1; }
      }
      @keyframes heartFloat {
        0%, 100% { transform: translateY(0px) scale(0.95); opacity: 0.85; }
        50% { transform: translateY(-9px) scale(1.15); opacity: 1; }
      }
</style>
  </defs>
  <circle cx="140" cy="145" r="118" fill="url(#bg5)"/>
  <ellipse class="rig-shadow" cx="135" cy="236" rx="74" ry="12" fill="#4A2518" opacity="0.22"/>

  <g class="rig-bounce">
    <g class="rig-tail">
      <path d="M 184 186 C 238 198, 264 148, 242 94 C 224 84, 198 94, 188 122 C 178 144, 178 168, 184 186 Z" fill="#FF8C42" stroke="#4A2518" stroke-width="5.5" stroke-linejoin="round"/>
      <path d="M 242 94 C 224 84, 202 92, 196 112 C 212 122, 232 118, 242 94 Z" fill="#FFFDF9" stroke="#4A2518" stroke-width="5" stroke-linejoin="round"/>
    </g>

    <path d="M 68 158 C 64 198, 92 220, 142 220 C 194 220, 214 192, 206 146 C 198 118, 168 112, 136 118 Z" fill="#FF8C42" stroke="#4A2518" stroke-width="5.5" stroke-linejoin="round"/>
    <!-- Soft Scalloped Cloud Chest Ruff -->
    <path d="M 76 168 C 74 188, 88 202, 102 198 C 108 210, 126 210, 132 198 C 146 202, 158 188, 154 168 Z" fill="#FFFDF9" stroke="#4A2518" stroke-width="5" stroke-linejoin="round"/>
    <ellipse cx="78" cy="208" rx="11" ry="8" fill="#FFFDF9" stroke="#4A2518" stroke-width="5"/>
    <ellipse cx="130" cy="216" rx="11" ry="8" fill="#FFFDF9" stroke="#4A2518" stroke-width="5"/>
    <ellipse cx="176" cy="212" rx="11" ry="8" fill="#FFFDF9" stroke="#4A2518" stroke-width="5"/>

    <g class="rig-head">
      <g class="rig-ear-l">
        <path d="M 64 102 C 52 54, 74 42, 108 72 Z" fill="#FF8C42" stroke="#4A2518" stroke-width="5.5" stroke-linejoin="round"/>
        <path d="M 72 94 C 64 66, 78 58, 98 76 Z" fill="#FFFDF9" stroke="#4A2518" stroke-width="4" stroke-linejoin="round"/>
      </g>
      <g class="rig-ear-r">
        <path d="M 186 102 C 198 54, 176 42, 142 72 Z" fill="#FF8C42" stroke="#4A2518" stroke-width="5.5" stroke-linejoin="round"/>
        <path d="M 178 94 C 186 66, 172 58, 152 76 Z" fill="#FFFDF9" stroke="#4A2518" stroke-width="4" stroke-linejoin="round"/>
      </g>

      <path d="M 56 126 C 56 82, 86 68, 125 68 C 164 68, 194 82, 194 126 L 202 134 L 192 144 C 180 168, 156 176, 125 176 C 94 176, 70 168, 58 144 L 48 134 Z" fill="#FF8C42" stroke="#4A2518" stroke-width="5.5" stroke-linejoin="round"/>
      <path d="M 55 136 C 76 120, 106 124, 125 134 C 144 124, 174 120, 195 136 C 184 164, 158 174, 125 174 C 92 174, 66 164, 55 136 Z" fill="#FFFDF9"/>
      <path d="M 56 126 C 56 82, 86 68, 125 68 C 164 68, 194 82, 194 126 L 202 134 L 192 144 C 180 168, 156 176, 125 176 C 94 176, 70 168, 58 144 L 48 134 Z" fill="none" stroke="#4A2518" stroke-width="5.5" stroke-linejoin="round"/>

      <path d="M 104 70 L 98 48 L 114 58 L 125 42 L 136 58 L 152 48 L 146 70 Z" fill="#FFD166" stroke="#4A2518" stroke-width="4.5" stroke-linejoin="round"/>
      <circle cx="98" cy="45" r="3.5" fill="#FFD166" stroke="#4A2518" stroke-width="3"/>
      <circle cx="125" cy="39" r="4" fill="#FFD166" stroke="#4A2518" stroke-width="3"/>
      <circle cx="152" cy="45" r="3.5" fill="#FFD166" stroke="#4A2518" stroke-width="3"/>
      <path d="M 142 68 C 132 60, 132 76, 142 72 C 152 76, 152 60, 142 68 Z" fill="#FF7597" stroke="#4A2518" stroke-width="3.5"/>

      <g class="rig-cheeks">
        <ellipse cx="76" cy="144" rx="14" ry="8" fill="#FF7597" opacity="0.75"/>
        <ellipse cx="174" cy="144" rx="14" ry="8" fill="#FF7597" opacity="0.75"/>
      </g>
      <g class="rig-eyes">
        <circle cx="92" cy="128" r="15" fill="#4A2518"/>
        <circle cx="92" cy="131" r="10" fill="#8C4A27"/>
        <circle cx="88" cy="122" r="5.5" fill="#FFFFFF"/>
        <circle cx="98" cy="134" r="2.8" fill="#FFFFFF"/>
        <circle cx="158" cy="128" r="15" fill="#4A2518"/>
        <circle cx="158" cy="131" r="10" fill="#8C4A27"/>
        <circle cx="154" cy="122" r="5.5" fill="#FFFFFF"/>
        <circle cx="164" cy="134" r="2.8" fill="#FFFFFF"/>
      </g>
      <ellipse cx="125" cy="134" rx="5.5" ry="3.8" fill="#4A2518"/>
      <path d="M 115 141 Q 120 147 125 141 Q 130 147 135 141" fill="none" stroke="#4A2518" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>
  <g class="sparkle-a"><path d="M42,54 Q42,68 28,68 Q42,68 42,82 Q42,68 56,68 Q42,68 42,54 Z" fill="#FFD166"/></g>
  <g class="sparkle-b"><path d="M238,50 Q238,64 224,64 Q238,64 238,78 Q238,64 252,64 Q238,64 238,50 Z" fill="#FF7597"/></g>
</svg>