<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 380" width="380" height="380" fill="none">
  <defs>
    <style>
      @keyframes f3GentleSway {
        0%, 100% { transform: rotate(-2deg) translateY(0px); }
        50%      { transform: rotate(2deg) translateY(-5px); }
      }
      @keyframes f3PawGreet {
        0%, 100% { transform: rotate(-12deg) translateY(0px); }
        50%      { transform: rotate(18deg) translateY(-8px); }
      }
      @keyframes f3TailCurl {
        0%, 100% { transform: rotate(-6deg); }
        50%      { transform: rotate(8deg); }
      }
      @keyframes f3Blink {
        0%, 46%, 50%, 96%, 100% { transform: scaleY(1); }
        48%                     { transform: scaleY(0.08); }
      }

      .f3-head { transform-origin: 175px 168px; animation: f3GentleSway 2.8s ease-in-out infinite; }
      .f3-paw  { transform-origin: 148px 258px; animation: f3PawGreet 1.6s ease-in-out infinite; }
      .f3-tail { transform-origin: 222px 318px; animation: f3TailCurl 2.8s ease-in-out infinite; }
      .f3-eyes { transform-origin: 175px 132px; animation: f3Blink 5s infinite; }
    </style>
  </defs>

  <ellipse cx="185" cy="346" rx="92" ry="12" fill="#3E2723" opacity="0.22" />

  <!-- Chiếc đuôi dài thanh lịch uốn cong cao vút như tranh vẽ Hoàng Tử Bé -->
  <g class="f3-tail">
    <path d="M 214 326 C 268 326, 328 278, 332 204 C 334 152, 294 126, 276 158 C 260 186, 268 258, 206 308 Z" fill="#E05A2B" stroke="#4A2511" stroke-width="3.2" stroke-linecap="round" />
    <path d="M 332 204 C 334 152, 294 126, 276 158 C 272 168, 272 180, 274 192 C 284 182, 296 184, 302 194 C 312 184, 322 192, 332 204 Z" fill="#FDF6E2" stroke="#4A2511" stroke-width="3.2" stroke-linejoin="round" />
  </g>

  <!-- Thân Cáo Thon Dài Thanh Lịch (Slender Woodland Fox) -->
  <path d="M 148 168 C 132 224, 128 292, 138 334 L 218 334 C 228 292, 218 224, 202 168 Z" fill="#E05A2B" stroke="#4A2511" stroke-width="3.2" />
  <!-- Yếm ngực kem dài thon -->
  <path d="M 160 174 C 154 218, 156 268, 176 296 C 196 268, 198 218, 192 174 Z" fill="#FDF6E2" />

  <!-- Chân phải chống thẳng mang tất đen thon dài -->
  <path d="M 188 264 L 194 338" stroke="#4A2511" stroke-width="16" stroke-linecap="round" />
  <path d="M 188 264 L 191 300" stroke="#E05A2B" stroke-width="11" stroke-linecap="round" />
  <ellipse cx="196" cy="340" rx="11" ry="6.5" fill="#2D1508" />

  <!-- Chân trước bên trái nhấc lên vẫy chào duyên dáng -->
  <g class="f3-paw">
    <path d="M 152 238 C 122 236, 96 214, 98 192 C 100 178, 116 182, 118 196 C 120 212, 134 222, 154 224 Z" fill="#E05A2B" stroke="#4A2511" stroke-width="3.2" />
    <path d="M 98 192 C 100 178, 116 182, 118 196 C 119 204, 122 210, 126 214 L 112 220 C 102 212, 97 202, 98 192 Z" fill="#2D1508" />
  </g>

  <!-- Chiếc khăn choàng Xanh Cổ Vịt (Teal Scarf) bay trong gió thu -->
  <path d="M 138 168 C 138 156, 212 156, 212 168 C 212 182, 138 182, 138 168 Z" fill="#1E6F72" stroke="#4A2511" stroke-width="3" />
  <path d="M 194 174 C 228 178, 258 196, 268 218 L 242 228 C 232 208, 212 192, 188 184 Z" fill="#2A9D8F" stroke="#4A2511" stroke-width="3" stroke-linejoin="round" />

  <!-- ĐẦU CÁO HÌNH TAM GIÁC MỀM THANH TÚ KIỂU TRUYỆN CỔ TÍCH -->
  <g class="f3-head">
    <!-- Đôi tai cao thon nhọn -->
    <path d="M 130 98 C 114 54, 118 16, 134 12 C 150 10, 164 48, 166 88 Z" fill="#E05A2B" stroke="#4A2511" stroke-width="3.2" />
    <path d="M 136 88 C 126 56, 128 30, 136 26 C 144 26, 154 52, 156 84 Z" fill="#F4A261" />

    <path d="M 220 98 C 236 54, 232 16, 216 12 C 200 10, 186 48, 184 88 Z" fill="#E05A2B" stroke="#4A2511" stroke-width="3.2" />
    <path d="M 214 88 C 224 56, 222 30, 214 26 C 206 26, 196 52, 194 84 Z" fill="#F4A261" />

    <!-- Khuôn mặt hình thoi/giọt nước đặc trưng của loài cáo thanh lịch -->
    <path d="M 175 68 C 218 68, 248 104, 254 134 C 232 158, 202 174, 175 182 C 148 174, 118 158, 96 134 C 102 104, 132 68, 175 68 Z" fill="#E05A2B" stroke="#4A2511" stroke-width="3.2" stroke-linejoin="round" />
    <!-- Hai má kem kéo nhọn về phía chóp mũi -->
    <path d="M 96 134 C 122 126, 152 138, 166 168 L 175 182 L 184 168 C 198 138, 228 126, 254 134 C 232 158, 202 174, 175 182 C 148 174, 118 158, 96 134 Z" fill="#FDF6E2" stroke="#4A2511" stroke-width="3" stroke-linejoin="round" />

    <!-- Đôi mắt hiền từ sâu lắng -->
    <g class="f3-eyes">
      <ellipse cx="144" cy="124" rx="8.5" ry="11" fill="#2D1508" />
      <circle cx="141" cy="120" r="3" fill="#FFFFFF" />
      <ellipse cx="206" cy="124" rx="8.5" ry="11" fill="#2D1508" />
      <circle cx="203" cy="120" r="3" fill="#FFFFFF" />
    </g>

    <ellipse cx="122" cy="142" rx="11" ry="6" fill="#E76F51" opacity="0.55" />
    <ellipse cx="228" cy="142" rx="11" ry="6" fill="#E76F51" opacity="0.55" />

    <!-- Chóp mũi nhọn nhỏ nhắn & Nụ cười mỉm thanh tao -->
    <circle cx="175" cy="178" r="7.5" fill="#2D1508" />
    <path d="M 162 158 Q 175 166, 188 158" stroke="#4A2511" stroke-width="2.8" stroke-linecap="round" fill="none" />
  </g>
</svg>