<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 400" width="380" height="400" fill="none">
  <defs>
    <style>
      @keyframes m5Sway {
        0%, 100% { transform: rotate(-1.8deg); }
        50%      { transform: rotate(1.8deg); }
      }
      @keyframes m5Tail {
        0%, 100% { transform: rotate(-6deg); }
        50%      { transform: rotate(8deg); }
      }
      @keyframes m5Blink {
        0%, 46%, 50%, 94%, 98%, 100% { transform: scaleY(1); }
        48%, 96%                     { transform: scaleY(0.08); }
      }

      .m5-head { transform-origin: 180px 205px; animation: m5Sway 2.8s ease-in-out infinite; }
      .m5-tail { transform-origin: 215px 330px; animation: m5Tail 2.2s ease-in-out infinite; }
      .m5-eyes { transform-origin: 180px 142px; animation: m5Blink 4.8s infinite; }
    </style>
  </defs>

  <!-- Đế gỗ / Thảm dệt Mid-Century -->
  <ellipse cx="185" cy="354" rx="118" ry="12" fill="#23120B" opacity="0.35" />

  <!-- Chiếc đuôi hình chiếc lá lớn đối xứng họa tiết xương cá Bắc Âu -->
  <g class="m5-tail">
    <path d="M 205 342 C 210 250, 270 190, 342 204 C 356 276, 306 346, 205 342 Z" fill="#D9480F" />
    <path d="M 205 342 L 342 204 C 356 276, 306 346, 205 342 Z" fill="#B83605" />
    <!-- Chóp đuôi kem cắt họa tiết răng cưa đối xứng -->
    <polygon points="342,204 282,216 296,232 272,248 298,256 312,282 332,262" fill="#FAF3E0" />
    <line x1="205" y1="342" x2="342" y2="204" stroke="#8A2400" stroke-width="2.5" />
  </g>

  <!-- Thân hình tháp cân đối kiểu Charley Harper -->
  <polygon points="132,204 228,204 246,352 114,352" fill="#E8590C" />
  <polygon points="180,204 228,204 246,352 180,352" fill="#C94406" />

  <!-- Yếm ngực hình kim cương dài kèm họa tiết chấm gạch Folk-Art -->
  <polygon points="180,214 214,256 180,344 146,256" fill="#FAF3E0" />
  <g stroke="#D9480F" stroke-width="2.2" stroke-linecap="round" opacity="0.6">
    <line x1="172" y1="252" x2="172" y2="260" />
    <line x1="188" y1="252" x2="188" y2="260" />
    <line x1="164" y1="272" x2="164" y2="280" />
    <line x1="180" y1="272" x2="180" y2="280" />
    <line x1="196" y1="272" x2="196" y2="280" />
  </g>

  <!-- Đôi tất chân đen tuyền hình học ở đáy -->
  <polygon points="114,352 122,286 154,286 158,352" fill="#23120B" />
  <polygon points="246,352 238,286 206,286 202,352" fill="#23120B" />
  <line x1="134" y1="336" x2="134" y2="352" stroke="#FAF3E0" stroke-width="2" />
  <line x1="146" y1="336" x2="146" y2="352" stroke="#FAF3E0" stroke-width="2" />
  <line x1="214" y1="336" x2="214" y2="352" stroke="#FAF3E0" stroke-width="2" />
  <line x1="226" y1="336" x2="226" y2="352" stroke="#FAF3E0" stroke-width="2" />

  <!-- CHIẾC KHĂN DỆT THỔ CẨM BẮC ÂU (NORDIC FAIR-ISLE KNIT SCARF) -->
  <g>
    <rect x="116" y="190" width="128" height="32" rx="8" fill="#F59E0B" />
    <!-- Họa tiết zíc-zắc Bắc Âu trên khăn -->
    <polyline points="122,206 134,196 146,206 158,196 170,206 182,196 194,206 206,196 218,206 230,196 238,206" stroke="#FAF3E0" stroke-width="3" fill="none" stroke-linejoin="round" />
    <polyline points="122,214 134,204 146,214 158,204 170,214 182,204 194,214 206,204 218,214 230,204 238,214" stroke="#92400E" stroke-width="2.5" fill="none" stroke-linejoin="round" />

    <!-- Vạt khăn rủ có hình quả trám ◇ -->
    <rect x="134" y="216" width="36" height="68" rx="4" fill="#FBBF24" />
    <polygon points="152,232 162,244 152,256 142,244" fill="#B45309" />
    <polygon points="152,237 157,244 152,251 147,244" fill="#FAF3E0" />
    <!-- Tua rua thẳng tắp -->
    <g stroke="#F59E0B" stroke-width="3.5" stroke-linecap="round">
      <line x1="138" y1="284" x2="138" y2="298" />
      <line x1="145" y1="284" x2="145" y2="298" />
      <line x1="152" y1="284" x2="152" y2="298" />
      <line x1="159" y1="284" x2="159" y2="298" />
      <line x1="166" y1="284" x2="166" y2="298" />
    </g>
  </g>

  <!-- ĐẦU CÁO TAM GIÁC CÂN MID-CENTURY MODERN (CHARLEY HARPER WEDGE HEAD) -->
  <g class="m5-head">
    <!-- Đôi tai tam giác sắc lẹm -->
    <polygon points="88,108 72,22 146,84" fill="#23120B" />
    <polygon points="98,104 88,46 136,88" fill="#E8590C" />

    <polygon points="272,108 288,22 214,84" fill="#23120B" />
    <polygon points="262,104 272,46 224,88" fill="#C94406" />

    <!-- Khuôn mặt hình cánh diều / kim cương ngược -->
    <polygon points="180,68 296,138 180,206 64,138" fill="#E8590C" />
    <polygon points="180,68 296,138 180,206" fill="#D9480F" />

    <!-- Hai vòm má trắng kem cắt đường cong toán học -->
    <path d="M 64 138 Q 136 138, 180 206 L 64 138 Z" fill="#FAF3E0" />
    <path d="M 296 138 Q 224 138, 180 206 L 296 138 Z" fill="#EFE4C8" />

    <!-- Sống mũi dài thanh lịch chạy từ đỉnh trán xuống tận chóp mũi -->
    <polygon points="180,68 196,142 180,206 164,142" fill="#F76707" />

    <!-- Đôi mắt hình thoi ngang nửa nhắm nửa mở đầy thông thái -->
    <g class="m5-eyes">
      <polygon points="112,134 136,124 156,138 134,148" fill="#FAF3E0" />
      <circle cx="135" cy="136" r="8" fill="#23120B" />
      <circle cx="133" cy="134" r="2.5" fill="#FAF3E0" />
      <line x1="110" y1="134" x2="158" y2="138" stroke="#23120B" stroke-width="3.5" stroke-linecap="round" />

      <polygon points="248,134 224,124 204,138 226,148" fill="#FAF3E0" />
      <circle cx="225" cy="136" r="8" fill="#23120B" />
      <circle cx="223" cy="134" r="2.5" fill="#FAF3E0" />
      <line x1="250" y1="134" x2="202" y2="138" stroke="#23120B" stroke-width="3.5" stroke-linecap="round" />
    </g>

    <!-- Chóp mũi tròn đen & Râu kẻ ngang đối xứng -->
    <circle cx="180" cy="202" r="10" fill="#23120B" />
    <circle cx="177" cy="199" r="2.5" fill="#FAF3E0" />
    <line x1="48" y1="148" x2="96" y2="156" stroke="#23120B" stroke-width="2" stroke-linecap="round" />
    <line x1="54" y1="160" x2="98" y2="164" stroke="#23120B" stroke-width="2" stroke-linecap="round" />
    <line x1="312" y1="148" x2="264" y2="156" stroke="#23120B" stroke-width="2" stroke-linecap="round" />
    <line x1="306" y1="160" x2="262" y2="164" stroke="#23120B" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>