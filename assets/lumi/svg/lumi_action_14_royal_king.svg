<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 380" width="360" height="380" fill="none">
  <defs>
    <style>
      @keyframes a14RoyalBreathe {
        0%, 100% { transform: translateY(0px) scale(1, 1); }
        50%      { transform: translateY(-4px) scale(1.015, 0.99); }
      }
      @keyframes a14CrownBounce {
        0%, 100% { transform: translateY(0px) rotate(-2deg); }
        50%      { transform: translateY(-6px) rotate(2deg); }
      }
      @keyframes a14ScepterTap {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50%      { transform: translateY(-8px) rotate(5deg); }
      }
      @keyframes a14Tail {
        0%, 100% { transform: rotate(-6deg); }
        50%      { transform: rotate(10deg); }
      }
      @keyframes a14Blink {
        0%, 46%, 50%, 96%, 100% { transform: scaleY(1); }
        48%                     { transform: scaleY(0.06); }
      }

      .a14-body    { transform-origin: 162px 340px; animation: a14RoyalBreathe 2.6s ease-in-out infinite; }
      .a14-crown   { transform-origin: 162px 58px; animation: a14CrownBounce 2.6s ease-in-out infinite; }
      .a14-scepter { transform-origin: 236px 260px; animation: a14ScepterTap 1.8s ease-in-out infinite; }
      .a14-tail    { transform-origin: 202px 314px; animation: a14Tail 2.4s ease-in-out infinite; }
      .a14-eyes    { transform-origin: 162px 154px; animation: a14Blink 5s infinite; }
    </style>

    <radialGradient id="a14Fur" cx="162" cy="126" r="115" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF9E44" />
      <stop offset="55%" stop-color="#F76414" />
      <stop offset="100%" stop-color="#C43E00" />
    </radialGradient>
    <linearGradient id="a14Gold" x1="115" y1="20" x2="210" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="40%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="a14Cape" x1="80" y1="215" x2="245" y2="345" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="60%" stop-color="#B91C1C" />
      <stop offset="100%" stop-color="#7F1D1D" />
    </linearGradient>
  </defs>

  <ellipse cx="168" cy="352" rx="104" ry="14" fill="#2A0A0A" opacity="0.32" />

  <g class="a14-body">
    <!-- Áo choàng Nhung Đỏ Hoàng Gia rộng phía sau -->
    <path d="M 88 218 C 66 268, 64 326, 82 344 L 242 344 C 260 326, 258 268, 236 218 Z" fill="url(#a14Cape)" stroke="#FBBF24" stroke-width="3" />

    <g class="a14-tail">
      <path d="M 196 320 C 202 258, 242 216, 290 220 C 328 224, 342 264, 322 298 C 302 328, 250 338, 196 328 Z" fill="url(#a14Fur)" />
      <path d="M 254 222 C 280 216, 308 222, 322 242 C 334 258, 330 280, 322 298 C 314 282, 300 278, 288 290 C 288 274, 276 270, 264 278 C 266 260, 254 248, 254 222 Z" fill="#FFFDF9" />
    </g>

    <ellipse cx="108" cy="340" rx="19" ry="13" fill="#361509" />
    <ellipse cx="216" cy="340" rx="19" ry="13" fill="#361509" />

    <!-- Thân & Ngực kem -->
    <path d="M 114 222 C 104 264, 106 322, 126 338 L 198 338 C 218 322, 220 264, 210 222 Z" fill="url(#a14Fur)" />
    <path d="M 134 238 C 124 274, 128 324, 162 338 C 196 324, 200 274, 190 238 Z" fill="#FFFDF9" />

    <!-- Cổ áo lông trắng Hoàng Gia chấm đen (Ermine Royal Collar) & Ngọc Ruby -->
    <path d="M 96 216 C 96 200, 228 200, 228 216 C 228 242, 96 242, 96 216 Z" fill="#FFFDF9" stroke="#E2E8F0" stroke-width="2" />
    <circle cx="116" cy="224" r="3" fill="#1E293B" />
    <circle cx="140" cy="228" r="3" fill="#1E293B" />
    <circle cx="184" cy="228" r="3" fill="#1E293B" />
    <circle cx="208" cy="224" r="3" fill="#1E293B" />
    <!-- Huy hiệu Ngọc Đỏ Ruby Giữa Ngực -->
    <circle cx="162" cy="228" r="13" fill="url(#a14Gold)" stroke="#B45309" stroke-width="2" />
    <circle cx="162" cy="228" r="8" fill="#E11D48" />
    <circle cx="159" cy="225" r="2.5" fill="#FFE4E6" />

    <!-- Tay trái chống hông oai vệ -->
    <path d="M 116 242 C 94 252, 92 280, 112 290 C 124 294, 132 278, 126 258 Z" fill="url(#a14Fur)" />
    <circle cx="114" cy="286" r="12" fill="#361509" />

    <!-- Tay phải cầm Quyền Trượng Kim Cương Hoàng Gia -->
    <g class="a14-scepter">
      <line x1="242" y1="158" x2="226" y2="338" stroke="url(#a14Gold)" stroke-width="8" stroke-linecap="round" />
      <line x1="242" y1="158" x2="226" y2="338" stroke="#B45309" stroke-width="10" stroke-linecap="round" opacity="0.25" />
      <!-- Đầu quyền trượng gắn viên Kim Cương Xanh & Vương miện nhỏ -->
      <circle cx="244" cy="146" r="20" fill="url(#a14Gold)" stroke="#B45309" stroke-width="2.5" />
      <polygon points="244,128 256,146 244,164 232,146" fill="#38BDF8" stroke="#E0F2FE" stroke-width="2" />
      <path d="M 204 244 C 224 242, 242 232, 240 216 C 238 204, 220 208, 212 222 Z" fill="url(#a14Fur)" />
      <circle cx="234" cy="220" r="13" fill="#361509" />
    </g>

    <!-- Đầu Cáo Đội Vương Miện Vàng Ròng -->
    <g>
      <path d="M 66 132 C 46 84, 54 28, 78 20 C 102 18, 134 56, 144 100 Z" fill="url(#a14Fur)" />
      <path d="M 55 56 C 60 32, 68 22, 78 20 C 90 19, 104 32, 114 52 C 94 58, 74 60, 55 56 Z" fill="#2E1207" />
      <path d="M 76 122 C 64 86, 70 46, 82 36 C 96 38, 116 68, 122 102 Z" fill="#F9BFA8" />

      <path d="M 258 132 C 278 84, 270 28, 246 20 C 222 18, 190 56, 180 100 Z" fill="url(#a14Fur)" />
      <path d="M 269 56 C 264 32, 256 22, 246 20 C 234 19, 220 32, 210 52 C 230 58, 250 60, 269 56 Z" fill="#2E1207" />
      <path d="M 248 122 C 260 86, 254 46, 242 36 C 228 38, 208 68, 202 102 Z" fill="#F9BFA8" />

      <path d="M 162 72 C 222 72, 258 116, 264 166 C 272 178, 266 200, 248 208 C 226 220, 196 224, 162 224 C 128 224, 98 220, 76 208 C 58 200, 52 178, 60 166 C 66 116, 102 72, 162 72 Z" fill="url(#a14Fur)" />
      <path d="M 60 170 C 78 152, 118 150, 146 172 C 154 166, 170 166, 178 172 C 206 150, 246 152, 264 170 C 270 182, 264 200, 248 208 C 226 220, 196 224, 162 224 C 128 224, 98 220, 76 208 C 60 200, 54 182, 60 170 Z" fill="#FFFDF9" />

      <g class="a14-eyes">
        <ellipse cx="115" cy="154" rx="18" ry="20" fill="#2B0E04" />
        <ellipse cx="115" cy="156" rx="14" ry="15" fill="#B45309" />
        <ellipse cx="115" cy="154" rx="9" ry="11" fill="#170702" />
        <circle cx="109" cy="146" r="5.5" fill="#FFFFFF" />
        <circle cx="121" cy="161" r="3" fill="#FEF08A" />

        <ellipse cx="209" cy="154" rx="18" ry="20" fill="#2B0E04" />
        <ellipse cx="209" cy="156" rx="14" ry="15" fill="#B45309" />
        <ellipse cx="209" cy="154" rx="9" ry="11" fill="#170702" />
        <circle cx="203" cy="146" r="5.5" fill="#FFFFFF" />
        <circle cx="215" cy="161" r="3" fill="#FEF08A" />
      </g>

      <path d="M 146 186 Q 162 198, 178 186" stroke="#361207" stroke-width="3.6" stroke-linecap="round" fill="none" />
      <ellipse cx="162" cy="172" rx="9.5" ry="6" fill="#240D04" />

      <!-- CHIẾC VƯƠNG MIỆN VÀNG ĐÍNH NGỌC RUBY TRÊN ĐỈNH ĐẦU -->
      <g class="a14-crown">
        <path d="M 118 82 L 112 36 L 138 56 L 162 24 L 186 56 L 212 36 L 206 82 Z" fill="url(#a14Gold)" stroke="#B45309" stroke-width="3" stroke-linejoin="round" />
        <rect x="116" y="74" width="92" height="12" rx="6" fill="#F59E0B" stroke="#92400E" stroke-width="2.5" />
        <circle cx="162" cy="64" r="6" fill="#E11D48" stroke="#FFFBEB" stroke-width="1.5" />
        <circle cx="134" cy="66" r="4.5" fill="#38BDF8" />
        <circle cx="190" cy="66" r="4.5" fill="#38BDF8" />
        <circle cx="112" cy="34" r="4.5" fill="#FEF08A" />
        <circle cx="162" cy="22" r="5.5" fill="#FEF08A" />
        <circle cx="212" cy="34" r="4.5" fill="#FEF08A" />
      </g>
    </g>
  </g>
</svg>