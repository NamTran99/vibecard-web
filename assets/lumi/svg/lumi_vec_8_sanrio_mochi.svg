<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="100%" height="100%">
  <defs>
    <radialGradient id="bg8" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE3EC" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFE3EC" stop-opacity="0"/>
    </radialGradient>
    <style>
      svg { overflow: visible; }
      .rig-bounce {
        transform-origin: 140px 235px;
        animation: bodyBounce 1.7s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
      }
      .rig-head {
        transform-origin: 140px 145px;
        animation: headTilt 2.2s ease-in-out infinite;
      }
      .rig-ear-l {
        transform-origin: 92px 82px;
        animation: earLeft 2.0s ease-in-out infinite;
      }
      .rig-ear-r {
        transform-origin: 188px 82px;
        animation: earRight 2.0s ease-in-out infinite;
      }
      .rig-tail {
        transform-origin: 175px 205px;
        animation: tailWag 0.95s ease-in-out infinite alternate;
      }
      .rig-arm-l {
        transform-origin: 90px 168px;
        animation: armWave 0.75s ease-in-out infinite alternate;
      }
      .rig-arm-r {
        transform-origin: 186px 168px;
        animation: armProp 1.1s ease-in-out infinite alternate;
      }
      .rig-eyes {
        transform-origin: 140px 124px;
        animation: eyeBlink 3.4s ease-in-out infinite;
      }
      .rig-cheeks {
        transform-origin: 140px 138px;
        animation: cheekPulse 1.5s ease-in-out infinite alternate;
      }
      .rig-shadow {
        transform-origin: 140px 248px;
        animation: shadowScale 1.7s ease-in-out infinite;
      }
      .sparkle-a {
        transform-origin: 42px 68px;
        animation: starTwinkle 1.5s ease-in-out infinite;
      }
      .sparkle-b {
        transform-origin: 238px 64px;
        animation: starTwinkle 1.9s ease-in-out infinite 0.5s;
      }
      .float-heart {
        transform-origin: 140px 36px;
        animation: heartFloat 1.8s ease-in-out infinite;
      }
      @keyframes bodyBounce {
        0%, 100% { transform: translateY(0px) scale(1.03, 0.97); }
        45% { transform: translateY(-13px) scale(0.97, 1.04); }
        75% { transform: translateY(-4px) scale(1.01, 0.99); }
      }
      @keyframes headTilt {
        0%, 100% { transform: rotate(-4deg) translateY(0px); }
        50% { transform: rotate(4deg) translateY(-3px); }
      }
      @keyframes earLeft {
        0%, 100% { transform: rotate(0deg); }
        30% { transform: rotate(-12deg); }
        60% { transform: rotate(5deg); }
      }
      @keyframes earRight {
        0%, 100% { transform: rotate(0deg); }
        40% { transform: rotate(12deg); }
        70% { transform: rotate(-4deg); }
      }
      @keyframes tailWag {
        0% { transform: rotate(-16deg) scale(1); }
        100% { transform: rotate(18deg) scale(1.05); }
      }
      @keyframes armWave {
        0% { transform: rotate(-22deg); }
        100% { transform: rotate(30deg); }
      }
      @keyframes armProp {
        0% { transform: rotate(12deg) translateY(0px); }
        100% { transform: rotate(-18deg) translateY(-4px); }
      }
      @keyframes eyeBlink {
        0%, 44%, 52%, 94%, 100% { transform: scaleY(1); }
        48%, 97% { transform: scaleY(0.08); }
      }
      @keyframes cheekPulse {
        0% { opacity: 0.65; transform: scale(0.95); }
        100% { opacity: 0.98; transform: scale(1.1); }
      }
      @keyframes shadowScale {
        0%, 100% { transform: scale(1, 1); opacity: 0.22; }
        45% { transform: scale(0.82, 0.85); opacity: 0.12; }
      }
      @keyframes starTwinkle {
        0%, 100% { transform: scale(0.65) rotate(0deg); opacity: 0.45; }
        50% { transform: scale(1.22) rotate(22deg); opacity: 1; }
      }
      @keyframes heartFloat {
        0%, 100% { transform: translateY(0px) scale(0.95); opacity: 0.85; }
        50% { transform: translateY(-9px) scale(1.15); opacity: 1; }
      }
</style>
  </defs>
  <circle cx="140" cy="145" r="118" fill="url(#bg8)"/>
  <ellipse class="rig-shadow" cx="140" cy="248" rx="64" ry="11" fill="#4A2C1D" opacity="0.2"/>

  <g class="float-heart">
    <path d="M 140 44 C 132 32, 116 36, 118 48 C 120 58, 140 68, 140 68 C 140 68, 160 58, 162 48 C 164 36, 148 32, 140 44 Z" fill="#FF7597" stroke="#4A2C1D" stroke-width="4.5" stroke-linejoin="round"/>
  </g>

  <g class="rig-bounce">
    <g class="rig-tail">
      <path d="M 174 214 C 222 222, 248 186, 236 144 C 216 146, 198 166, 174 214 Z" fill="#FFA372" stroke="#4A2C1D" stroke-width="5.5" stroke-linejoin="round"/>
      <path d="M 236 144 C 222 146, 210 156, 206 170 C 220 176, 234 166, 236 144 Z" fill="#FFFDF9" stroke="#4A2C1D" stroke-width="5" stroke-linejoin="round"/>
    </g>

    <path d="M 90 162 C 78 194, 84 232, 108 238 L 112 246 C 116 250, 128 250, 130 242 L 132 238 C 138 239, 142 239, 148 238 L 150 242 C 152 250, 164 250, 168 246 L 172 238 C 196 232, 202 194, 190 162 Z" fill="#FFA372" stroke="#4A2C1D" stroke-width="5.5" stroke-linejoin="round"/>
    <ellipse cx="140" cy="202" rx="32" ry="26" fill="#FFFDF9"/>

    <g class="rig-arm-l">
      <path d="M 92 178 C 62 164, 46 138, 56 124 C 66 112, 86 130, 98 158 Z" fill="#FFA372" stroke="#4A2C1D" stroke-width="5.5" stroke-linejoin="round"/>
    </g>
    <g class="rig-arm-r">
      <path d="M 188 178 C 218 164, 234 138, 224 124 C 214 112, 194 130, 182 158 Z" fill="#FFA372" stroke="#4A2C1D" stroke-width="5.5" stroke-linejoin="round"/>
    </g>

    <g class="rig-head">
      <g class="rig-ear-l">
        <path d="M 78 100 C 66 56, 86 44, 116 74 Z" fill="#FFA372" stroke="#4A2C1D" stroke-width="5.5" stroke-linejoin="round"/>
        <path d="M 84 92 C 76 66, 90 58, 108 78 Z" fill="#FFFDF9"/>
      </g>
      <g class="rig-ear-r">
        <path d="M 202 100 C 214 56, 194 44, 164 74 Z" fill="#FFA372" stroke="#4A2C1D" stroke-width="5.5" stroke-linejoin="round"/>
        <path d="M 196 92 C 204 66, 190 58, 172 78 Z" fill="#FFFDF9"/>
      </g>

      <path d="M 66 124 C 66 80, 96 68, 140 68 C 184 68, 214 80, 214 124 C 222 146, 196 172, 140 172 C 84 172, 58 146, 66 124 Z" fill="#FFA372" stroke="#4A2C1D" stroke-width="5.5" stroke-linejoin="round"/>
      <path d="M 66 134 C 88 118, 118 122, 140 132 C 162 122, 192 118, 214 134 C 204 162, 178 171, 140 171 C 102 171, 76 162, 66 134 Z" fill="#FFFDF9"/>
      <path d="M 66 124 C 66 80, 96 68, 140 68 C 184 68, 214 80, 214 124 C 222 146, 196 172, 140 172 C 84 172, 58 146, 66 124 Z" fill="none" stroke="#4A2C1D" stroke-width="5.5" stroke-linejoin="round"/>

      <!-- Cute Yellow Ribbon Bow on Front of Right Ear Base -->
      <g transform="rotate(14 178 76)">
        <path d="M 178 76 C 156 58, 154 94, 176 82 C 198 94, 196 58, 178 76 Z" fill="#FFE066" stroke="#4A2C1D" stroke-width="4.5" stroke-linejoin="round"/>
        <circle cx="177" cy="78" r="5.5" fill="#FFB800" stroke="#4A2C1D" stroke-width="4"/>
      </g>

      <g class="rig-cheeks">
        <ellipse cx="88" cy="144" rx="15" ry="9" fill="#FF85A1" opacity="0.8"/>
        <ellipse cx="192" cy="144" rx="15" ry="9" fill="#FF85A1" opacity="0.8"/>
      </g>
      <g class="rig-eyes">
        <circle cx="106" cy="132" r="11" fill="#4A2C1D"/>
        <circle cx="103" cy="128" r="4" fill="#FFFFFF"/>
        <circle cx="174" cy="132" r="11" fill="#4A2C1D"/>
        <circle cx="171" cy="128" r="4" fill="#FFFFFF"/>
      </g>
      <ellipse cx="140" cy="136" rx="5" ry="3.5" fill="#4A2C1D"/>
      <path d="M 132 144 Q 140 152 148 144 Z" fill="#FF85A1" stroke="#4A2C1D" stroke-width="4" stroke-linejoin="round"/>
    </g>
  </g>
</svg>