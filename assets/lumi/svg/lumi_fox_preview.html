<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lumi Fox Studio — Ultra-Fast 60fps Preview</title>
  <style>
    :root {
      --bg: #12140E;
      --surface: #1A1D16;
      --border: rgba(255, 255, 255, 0.08);
      --text: #E5E8DC;
      --muted: #9BA38E;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 18px 48px;
      gap: 18px;
    }
    .header {
      text-align: center;
      max-width: 880px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 999px;
      background: rgba(52, 211, 153, 0.14);
      border: 1px solid rgba(52, 211, 153, 0.35);
      color: #6EE7B7;
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 5px;
    }
    p.sub {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.45;
    }
    .controls-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      position: sticky;
      top: 10px;
      z-index: 20;
      background: rgba(18, 20, 14, 0.88);
      backdrop-filter: blur(8px);
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
    }
    .toolbar {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .divider {
      width: 1px;
      height: 24px;
      background: var(--border);
    }
    .btn {
      padding: 7px 14px;
      border-radius: 999px;
      border: 1px solid transparent;
      background: rgba(255, 255, 255, 0.04);
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .btn:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.08);
    }
    .btn.active {
      background: #FF7A1A;
      color: #FFF;
      border-color: #FFA352;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 18px;
      width: 100%;
      max-width: 1320px;
    }
    .card {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      contain: layout style paint;
      content-visibility: auto;
      contain-intrinsic-size: 310px 410px;
    }
    .card:hover {
      border-color: rgba(255, 140, 54, 0.5);
    }
    .new-ribbon {
      position: absolute;
      top: 12px;
      right: 12px;
      background: #10B981;
      color: #052E16;
      font-size: 9.5px;
      font-weight: 900;
      padding: 3px 8px;
      border-radius: 999px;
      letter-spacing: 0.05em;
    }
    .card-header {
      text-align: center;
    }
    .style-tag {
      display: inline-block;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 3.5px 9px;
      border-radius: 999px;
      margin-bottom: 5px;
      background: rgba(255, 140, 54, 0.14);
      color: #FFB067;
      border: 1px solid rgba(255, 140, 54, 0.3);
    }
    .card h2 {
      font-size: 15px;
      font-weight: 800;
      margin-bottom: 3px;
    }
    .card p {
      font-size: 11.5px;
      color: var(--muted);
      line-height: 1.4;
      min-height: 32px;
    }
    .stage {
      width: 100%;
      height: 270px;
      border-radius: 18px;
      background: #F7EFE2;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      contain: strict;
    }
    body.bg-dark .stage {
      background: #1E2218;
    }
    body.bg-forest .stage {
      background: #FDE68A;
    }
    .stage img {
      width: 248px;
      height: 258px;
      object-fit: contain;
      pointer-events: none;
    }
    .features {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      justify-content: center;
    }
    .pill {
      font-size: 10px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(255,255,255,0.05);
      color: #D4DAC8;
    }
  </style>
</head>

    const grid = document.getElementById('cardGrid');

    function renderTab(cat, btn) {
      if (btn) {
        document.querySelectorAll('#catToolbar .btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      }
      const list = cat === 'all' ? ITEMS : ITEMS.filter(x => x.cat === cat);
      grid.innerHTML = list.map(item => `
        <div class="card">
          <span class="new-ribbon">${item.badge}</span>
          <div class="card-header">
            <span class="style-tag">${item.tag}</span>
            <h2>${item.title}</h2>
            <p>${item.desc}</p>
          </div>
          <div class="stage">
            <img src="${item.file}" alt="${item.title}" loading="lazy" decoding="async" width="248" height="258" />
          </div>
          <div class="features">
            ${item.pills.map(p => `<span class="pill">${p}</span>`).join('')}
          </div>
        </div>
      `).join('');
    }

    function setBg(cls, btn) {
      document.querySelectorAll('#bgToolbar .btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.body.className = cls;
    }

    // Khởi chạy tức thì chỉ render 6 mẫu mới nhất (< 5ms)
    renderTab('styleAF');
  </script>
