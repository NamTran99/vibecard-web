<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 400" width="380" height="400" fill="none">
  <defs>
    <style>
      @keyframes w4Trot {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50%      { transform: translateY(-5px) rotate(-1.2deg); }
      }
      @keyframes w4Tail {
        0%, 100% { transform: rotate(-7deg); }
        50%      { transform: rotate(10deg); }
      }
      @keyframes w4PawStep {
        0%, 100% { transform: rotate(-16deg); }
        50%      { transform: rotate(12deg); }
      }
      @keyframes w4ScarfFlutter {
        0%, 100% { transform: rotate(-5deg); }
        50%      { transform: rotate(8deg); }
      }
      @keyframes w4Blink {
        0%, 46%, 50%, 94%, 98%, 100% { transform: scaleY(1); }
        48%, 96%                     { transform: scaleY(0.08); }
      }

      .w4-body  { transform-origin: 175px 330px; animation: w4Trot 2.2s ease-in-out infinite; }
      .w4-tail  { transform-origin: 230px 285px; animation: w4Tail 1.6s ease-in-out infinite; }
      .w4-paw   { transform-origin: 128px 258px; animation: w4PawStep 2.2s ease-in-out infinite; }
      .w4-scarf { transform-origin: 196px 218px; animation: w4ScarfFlutter 1.5s ease-in-out infinite; }
      .w4-eyes  { transform-origin: 145px 152px; animation: w4Blink 4.5s infinite; }
    </style>

    <radialGradient id="wcOrangeWash" cx="165" cy="185" r="145" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF9747" stop-opacity="0.92" />
      <stop offset="65%" stop-color="#EB641A" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#C84608" stop-opacity="0.82" />
    </radialGradient>

    <linearGradient id="wcYellowWash" x1="110" y1="195" x2="295" y2="255" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Vệt màu nước loang nhẹ làm nền thơ mộng -->
  <ellipse cx="185" cy="220" rx="135" ry="115" fill="#FDE68A" opacity="0.22" />
  <ellipse cx="175" cy="350" rx="110" ry="12" fill="#3B2314" opacity="0.24" />

  <g class="w4-body">
    <!-- Đuôi vểnh cao phóng khoáng kiểu tranh minh họa màu nước -->
    <g class="w4-tail">
      <!-- Mảng màu nước loang hơi lệch khỏi nét mực tạo chất hội họa -->
      <path d="M 222 292 C 234 226, 286 182, 338 196 C 362 224, 344 282, 298 306 C 266 322, 236 312, 222 292 Z" fill="url(#wcOrangeWash)" />
      <path d="M 284 198 C 308 190, 326 192, 338 196 C 354 218, 344 256, 322 284 C 312 268, 298 268, 290 278 C 290 260, 276 254, 266 262 C 272 242, 268 218, 284 198 Z" fill="#FFFDF7" />
      <!-- Nét bút mực Sketchbook + Gạch bóng Cross-hatching -->
      <path d="M 220 290 C 232 224, 284 180, 336 194 C 360 222, 342 280, 296 304 C 264 320, 234 310, 220 290 Z" stroke="#2B1810" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 242 298 L 254 286 M 256 302 L 268 290 M 270 302 L 282 290" stroke="#2B1810" stroke-width="1.8" stroke-linecap="round" opacity="0.55" />
    </g>

    <!-- Thân cáo thon dài hướng về bên trái (Tư thế đang rảo bước) -->
    <path d="M 118 220 C 114 268, 128 318, 148 336 L 222 326 C 238 298, 234 252, 206 218 Z" fill="url(#wcOrangeWash)" />
    <path d="M 118 220 C 114 268, 128 318, 148 336 L 222 326 C 238 298, 234 252, 206 218" stroke="#2B1810" stroke-width="3.2" stroke-linecap="round" />
    <!-- Yếm ngực trắng kem -->
    <path d="M 120 228 C 116 264, 124 304, 146 322 C 166 308, 172 268, 162 230 Z" fill="#FFFDF7" />
    <path d="M 122 254 L 130 248 M 120 268 L 130 262 M 124 282 L 134 276" stroke="#2B1810" stroke-width="1.8" stroke-linecap="round" opacity="0.45" />

    <!-- Chân sau & Chân trước trụ -->
    <path d="M 192 268 C 218 268, 232 300, 218 344 L 194 344 L 196 304 Z" fill="url(#wcOrangeWash)" stroke="#2B1810" stroke-width="3.2" stroke-linejoin="round" />
    <path d="M 194 316 L 222 316 L 218 346 L 190 346 Z" fill="#3B1F12" stroke="#2B1810" stroke-width="3" stroke-linejoin="round" />

    <path d="M 152 256 L 176 256 L 172 348 L 148 348 Z" fill="url(#wcOrangeWash)" stroke="#2B1810" stroke-width="3.2" stroke-linejoin="round" />
    <path d="M 149 312 L 174 312 L 172 348 L 144 348 Z" fill="#3B1F12" stroke="#2B1810" stroke-width="3" stroke-linejoin="round" />

    <!-- Chân trước bên trái nhấc lên đang bước đi (Stepping Paw) -->
    <g class="w4-paw">
      <path d="M 134 252 C 112 258, 92 276, 86 298 C 84 310, 98 314, 106 304 C 114 290, 128 278, 142 272 Z" fill="url(#wcOrangeWash)" stroke="#2B1810" stroke-width="3.2" stroke-linejoin="round" />
      <path d="M 102 276 C 92 286, 86 296, 86 302 C 86 312, 100 314, 108 302 L 116 288 Z" fill="#3B1F12" stroke="#2B1810" stroke-width="3" stroke-linejoin="round" />
    </g>

    <!-- Chiếc khăn vàng vẽ tay tung bay phía sau vai -->
    <g class="w4-scarf">
      <path d="M 188 208 C 232 200, 276 208, 304 228 C 296 244, 282 252, 266 248 C 242 236, 214 228, 184 226 Z" fill="url(#wcYellowWash)" stroke="#2B1810" stroke-width="3" stroke-linejoin="round" />
      <line x1="304" y1="228" x2="316" y2="234" stroke="#2B1810" stroke-width="2.5" stroke-linecap="round" />
      <line x1="298" y1="238" x2="310" y2="244" stroke="#2B1810" stroke-width="2.5" stroke-linecap="round" />
      <line x1="290" y1="246" x2="302" y2="252" stroke="#2B1810" stroke-width="2.5" stroke-linecap="round" />
    </g>
    <path d="M 110 206 C 110 192, 206 194, 206 210 C 206 226, 110 224, 110 206 Z" fill="url(#wcYellowWash)" stroke="#2B1810" stroke-width="3.2" />
    <path d="M 126 218 L 154 220 L 150 274 L 120 270 Z" fill="url(#wcYellowWash)" stroke="#2B1810" stroke-width="3" stroke-linejoin="round" />
    <!-- Đường kẻ caro nhẹ bằng bút mực trên khăn -->
    <line x1="138" y1="222" x2="135" y2="268" stroke="#B45309" stroke-width="1.8" stroke-dasharray="4 4" />

    <!-- ĐẦU CÁO KÝ HỌA MÀU NƯỚC (STORYBOOK INK ILLUSTRATION) -->
    <g>
      <!-- Hai tai lớn nét bút mực phóng khoáng -->
      <path d="M 94 118 C 78 68, 88 22, 112 18 C 134 18, 154 58, 158 98 Z" fill="url(#wcOrangeWash)" stroke="#2B1810" stroke-width="3.2" stroke-linejoin="round" />
      <path d="M 86 52 C 92 30, 100 20, 112 18 C 124 18, 134 32, 142 52 C 122 56, 104 56, 86 52 Z" fill="#3B1F12" />
      <path d="M 104 110 C 94 76, 100 42, 112 34 C 124 38, 138 68, 142 98" fill="#F7C6B5" stroke="#2B1810" stroke-width="2.2" />

      <path d="M 186 104 C 204 58, 236 24, 258 28 C 274 36, 262 84, 236 122 Z" fill="url(#wcOrangeWash)" stroke="#2B1810" stroke-width="3.2" stroke-linejoin="round" />
      <path d="M 222 48 C 236 32, 248 26, 258 28 C 266 34, 264 52, 256 72 C 244 64, 232 56, 222 48 Z" fill="#3B1F12" />
      <path d="M 196 110 C 212 78, 234 50, 246 52 C 254 60, 242 92, 224 118" fill="#F7C6B5" stroke="#2B1810" stroke-width="2.2" />

      <!-- Khuôn mặt với chiếc mõm thon dài hướng sang trái -->
      <path d="M 68 158 C 72 142, 96 136, 112 124 C 126 92, 162 80, 198 88 C 234 96, 252 132, 242 168 L 254 176 L 236 186 C 216 202, 182 208, 146 202 C 112 196, 74 178, 68 158 Z" fill="url(#wcOrangeWash)" />
      <!-- Mảng má trắng kem màu nước -->
      <path d="M 68 158 C 92 156, 122 164, 146 154 C 174 166, 212 162, 242 168 L 254 176 L 236 186 C 216 202, 182 208, 146 202 C 112 196, 74 178, 68 158 Z" fill="#FFFDF7" />
      <!-- Viền bút mực quanh đầu -->
      <path d="M 68 158 C 72 142, 96 136, 112 124 C 126 92, 162 80, 198 88 C 234 96, 252 132, 242 168 L 254 176 L 236 186 C 216 202, 182 208, 146 202 C 112 196, 74 178, 68 158 Z" stroke="#2B1810" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />

      <!-- Đôi mắt ký họa tinh anh & có hồn -->
      <g class="w4-eyes">
        <ellipse cx="126" cy="140" rx="9" ry="12" fill="#2B1810" />
        <circle cx="123" cy="136" r="3.2" fill="#FFFFFF" />
        <path d="M 114 124 Q 126 116, 138 124" stroke="#2B1810" stroke-width="3" stroke-linecap="round" fill="none" />

        <ellipse cx="176" cy="146" rx="10" ry="13" fill="#2B1810" />
        <circle cx="173" cy="141" r="3.5" fill="#FFFFFF" />
        <path d="M 164 128 Q 178 120, 190 130" stroke="#2B1810" stroke-width="3" stroke-linecap="round" fill="none" />
      </g>

      <!-- Má hồng gạch chéo kiểu Sketchbook -->
      <path d="M 188 166 L 194 160 M 196 168 L 202 162 M 204 170 L 210 164" stroke="#E05A47" stroke-width="2.2" stroke-linecap="round" />

      <!-- Mũi đen ở chóp mõm & Nụ cười nghiêng hóm hỉnh -->
      <ellipse cx="70" cy="154" rx="9" ry="7" fill="#2B1810" />
      <circle cx="68" cy="152" r="2.2" fill="#FFFFFF" />
      <path d="M 90 170 Q 118 182, 144 170" stroke="#2B1810" stroke-width="3" stroke-linecap="round" fill="none" />
      <path d="M 140 166 Q 146 170, 142 175" stroke="#2B1810" stroke-width="2.5" stroke-linecap="round" fill="none" />
      <!-- Râu mảnh vẽ tay -->
      <path d="M 86 164 Q 64 166, 48 172 M 92 168 Q 70 174, 56 182" stroke="#2B1810" stroke-width="1.6" stroke-linecap="round" opacity="0.65" />
    </g>
  </g>
</svg>