<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="100%" height="100%">
  <defs>
    <radialGradient id="bg1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE8D6" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FFE8D6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blush1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF7597" stop-opacity="0.78"/>
      <stop offset="100%" stop-color="#FF7597" stop-opacity="0"/>
    </radialGradient>
    <style>
      svg { overflow: visible; }
      .rig-bounce {
        transform-origin: 140px 235px;
        animation: bodyBounce 1.7s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
      }
      .rig-head {
        transform-origin: 140px 145px;
        animation: headTilt 2.2s ease-in-out infinite;
      }
      .rig-ear-l {
        transform-origin: 92px 82px;
        animation: earLeft 2.0s ease-in-out infinite;
      }
      .rig-ear-r {
        transform-origin: 188px 82px;
        animation: earRight 2.0s ease-in-out infinite;
      }
      .rig-tail {
        transform-origin: 175px 205px;
        animation: tailWag 0.95s ease-in-out infinite alternate;
      }
      .rig-arm-l {
        transform-origin: 90px 168px;
        animation: armWave 0.75s ease-in-out infinite alternate;
      }
      .rig-arm-r {
        transform-origin: 186px 168px;
        animation: armProp 1.1s ease-in-out infinite alternate;
      }
      .rig-eyes {
        transform-origin: 140px 124px;
        animation: eyeBlink 3.4s ease-in-out infinite;
      }
      .rig-cheeks {
        transform-origin: 140px 138px;
        animation: cheekPulse 1.5s ease-in-out infinite alternate;
      }
      .rig-shadow {
        transform-origin: 140px 248px;
        animation: shadowScale 1.7s ease-in-out infinite;
      }
      .sparkle-a {
        transform-origin: 42px 68px;
        animation: starTwinkle 1.5s ease-in-out infinite;
      }
      .sparkle-b {
        transform-origin: 238px 64px;
        animation: starTwinkle 1.9s ease-in-out infinite 0.5s;
      }
      .float-heart {
        transform-origin: 140px 36px;
        animation: heartFloat 1.8s ease-in-out infinite;
      }
      @keyframes bodyBounce {
        0%, 100% { transform: translateY(0px) scale(1.03, 0.97); }
        45% { transform: translateY(-13px) scale(0.97, 1.04); }
        75% { transform: translateY(-4px) scale(1.01, 0.99); }
      }
      @keyframes headTilt {
        0%, 100% { transform: rotate(-4deg) translateY(0px); }
        50% { transform: rotate(4deg) translateY(-3px); }
      }
      @keyframes earLeft {
        0%, 100% { transform: rotate(0deg); }
        30% { transform: rotate(-12deg); }
        60% { transform: rotate(5deg); }
      }
      @keyframes earRight {
        0%, 100% { transform: rotate(0deg); }
        40% { transform: rotate(12deg); }
        70% { transform: rotate(-4deg); }
      }
      @keyframes tailWag {
        0% { transform: rotate(-16deg) scale(1); }
        100% { transform: rotate(18deg) scale(1.05); }
      }
      @keyframes armWave {
        0% { transform: rotate(-22deg); }
        100% { transform: rotate(30deg); }
      }
      @keyframes armProp {
        0% { transform: rotate(12deg) translateY(0px); }
        100% { transform: rotate(-18deg) translateY(-4px); }
      }
      @keyframes eyeBlink {
        0%, 44%, 52%, 94%, 100% { transform: scaleY(1); }
        48%, 97% { transform: scaleY(0.08); }
      }
      @keyframes cheekPulse {
        0% { opacity: 0.65; transform: scale(0.95); }
        100% { opacity: 0.98; transform: scale(1.1); }
      }
      @keyframes shadowScale {
        0%, 100% { transform: scale(1, 1); opacity: 0.22; }
        45% { transform: scale(0.82, 0.85); opacity: 0.12; }
      }
      @keyframes starTwinkle {
        0%, 100% { transform: scale(0.65) rotate(0deg); opacity: 0.45; }
        50% { transform: scale(1.22) rotate(22deg); opacity: 1; }
      }
      @keyframes heartFloat {
        0%, 100% { transform: translateY(0px) scale(0.95); opacity: 0.85; }
        50% { transform: translateY(-9px) scale(1.15); opacity: 1; }
      }
</style>
  </defs>
  <circle cx="140" cy="145" r="118" fill="url(#bg1)"/>
  <ellipse class="rig-shadow" cx="140" cy="248" rx="64" ry="11" fill="#4A2C1D" opacity="0.2"/>

  <g class="rig-bounce">
    <g class="rig-tail">
      <path d="M 172 212 C 218 222, 248 188, 238 142 C 228 152, 212 150, 206 164 C 194 176, 180 192, 172 212 Z" fill="#FF9E5E" stroke="#4A2C1D" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 238 142 C 228 152, 214 152, 208 166 C 222 174, 236 168, 238 142 Z" fill="#FFFDF9" stroke="#4A2C1D" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <path d="M 92 162 C 82 192, 86 226, 102 232 L 106 244 C 108 249, 120 249, 122 244 L 125 234 C 135 236, 145 236, 155 234 L 158 244 C 160 249, 172 249, 174 244 L 178 232 C 194 226, 198 192, 188 162 Z" fill="#FF9E5E" stroke="#4A2C1D" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 108 168 C 102 192, 108 224, 140 224 C 172 224, 178 192, 172 168 Z" fill="#FFFDF9"/>
    <path d="M 126 184 Q 132 193 140 185 Q 148 193 154 184" fill="none" stroke="#E0C3AE" stroke-width="4" stroke-linecap="round"/>

    <!-- Waving Left Arm clearly visible outside cheek -->
    <g class="rig-arm-l">
      <path d="M 94 174 C 62 160, 44 134, 54 118 C 64 106, 84 122, 96 152" fill="#FF9E5E" stroke="#4A2C1D" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="62" cy="127" r="5" fill="#FF85A1"/>
      <circle cx="56" cy="119" r="2.3" fill="#FF85A1"/>
      <circle cx="63" cy="116" r="2.3" fill="#FF85A1"/>
      <circle cx="70" cy="119" r="2.3" fill="#FF85A1"/>
    </g>

    <g class="rig-head">
      <g class="rig-ear-l">
        <path d="M 74 96 C 64 56, 78 36, 114 64 Z" fill="#FF9E5E" stroke="#4A2C1D" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 80 88 C 75 64, 84 52, 104 68 C 96 74, 88 80, 80 88 Z" fill="#FFFDF9" stroke="#E0C3AE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <g class="rig-ear-r">
        <path d="M 206 96 C 216 56, 202 36, 166 64 Z" fill="#FF9E5E" stroke="#4A2C1D" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 200 88 C 205 64, 196 52, 176 68 C 184 74, 192 80, 200 88 Z" fill="#FFFDF9" stroke="#E0C3AE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <path d="M 124 58 C 128 44, 142 44, 144 54 C 152 46, 162 50, 158 60 C 188 66, 210 92, 212 118 L 220 124 L 212 132 L 218 140 C 210 164, 180 176, 140 176 C 100 176, 70 164, 62 140 L 68 132 L 60 124 L 68 118 C 70 92, 92 66, 124 58 Z" fill="#FF9E5E" stroke="#4A2C1D" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 67 132 C 84 118, 118 122, 140 132 C 162 122, 196 118, 213 132 C 206 162, 178 173, 140 173 C 102 173, 74 162, 67 132 Z" fill="#FFFDF9"/>
      <path d="M 124 58 C 128 44, 142 44, 144 54 C 152 46, 162 50, 158 60 C 188 66, 210 92, 212 118 L 220 124 L 212 132 L 218 140 C 210 164, 180 176, 140 176 C 100 176, 70 164, 62 140 L 68 132 L 60 124 L 68 118 C 70 92, 92 66, 124 58 Z" fill="none" stroke="#4A2C1D" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>

      <g class="rig-cheeks">
        <ellipse cx="88" cy="142" rx="18" ry="12" fill="url(#blush1)"/>
        <ellipse cx="192" cy="142" rx="18" ry="12" fill="url(#blush1)"/>
      </g>
      <ellipse cx="110" cy="102" rx="6.5" ry="3.8" fill="#FFFDF9"/>
      <ellipse cx="170" cy="102" rx="6.5" ry="3.8" fill="#FFFDF9"/>

      <g class="rig-eyes">
        <circle cx="106" cy="124" r="13.5" fill="#4A2C1D"/>
        <circle cx="102" cy="119" r="5" fill="#FFFFFF"/>
        <circle cx="111" cy="129" r="2.5" fill="#FFFFFF"/>
        <circle cx="174" cy="124" r="13.5" fill="#4A2C1D"/>
        <circle cx="170" cy="119" r="5" fill="#FFFFFF"/>
        <circle cx="179" cy="129" r="2.5" fill="#FFFFFF"/>
      </g>

      <ellipse cx="140" cy="131" rx="6.5" ry="4.5" fill="#4A2C1D"/>
      <path d="M 140 135 L 140 141 M 127 141 Q 133.5 148 140 141 Q 146.5 148 153 141" fill="none" stroke="#4A2C1D" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Right Arm Holding Star Wand cleanly below chin -->
    <g class="rig-arm-r">
      <line x1="162" y1="168" x2="190" y2="206" stroke="#4A2C1D" stroke-width="5" stroke-linecap="round"/>
      <path d="M 160 148 L 165 158 L 176 160 L 168 168 L 170 179 L 160 173 L 150 179 L 152 168 L 144 160 L 155 158 Z" fill="#FFE066" stroke="#4A2C1D" stroke-width="4.5" stroke-linejoin="round"/>
      <path d="M 186 172 C 198 182, 192 198, 174 194 C 166 192, 166 180, 178 176" fill="#FF9E5E" stroke="#4A2C1D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  <g class="sparkle-a"><path d="M42,54 Q42,68 28,68 Q42,68 42,82 Q42,68 56,68 Q42,68 42,54 Z" fill="#FFD166"/></g>
  <g class="sparkle-b"><path d="M238,50 Q238,64 224,64 Q238,64 238,78 Q238,64 252,64 Q238,64 238,50 Z" fill="#FF7597"/></g>
</svg>