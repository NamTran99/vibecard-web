<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 380" width="380" height="380" fill="none">
  <defs>
    <style>
      @keyframes f4JellyBounce {
        0%, 100% { transform: translateY(6px) scale(1.07, 0.93); }
        50%      { transform: translateY(-16px) scale(0.95, 1.06); }
      }
      @keyframes f4StubbyWaveL {
        0%, 100% { transform: rotate(15deg); }
        50%      { transform: rotate(-35deg); }
      }
      @keyframes f4StubbyWaveR {
        0%, 100% { transform: rotate(-15deg); }
        50%      { transform: rotate(35deg); }
      }
      @keyframes f4Blink {
        0%, 45%, 49%, 96%, 100% { transform: scaleY(1); }
        47%                     { transform: scaleY(0.1); }
      }

      .f4-blob { transform-origin: 190px 320px; animation: f4JellyBounce 1.2s ease-in-out infinite; }
      .f4-armL { transform-origin: 112px 218px; animation: f4StubbyWaveL 0.6s ease-in-out infinite; }
      .f4-armR { transform-origin: 268px 218px; animation: f4StubbyWaveR 0.6s ease-in-out infinite; }
      .f4-eyes { transform-origin: 190px 168px; animation: f4Blink 4s infinite; }
    </style>
  </defs>

  <ellipse cx="190" cy="340" rx="98" ry="14" fill="#3B1D0E" opacity="0.22" />

  <g class="f4-blob">
    <!-- Chiếc đuôi tròn ủm như cái bánh mì sừng bò phía sau -->
    <path d="M 258 292 C 312 288, 354 252, 344 212 C 334 176, 286 186, 266 232 Z" fill="#FF9248" stroke="#432010" stroke-width="6.5" stroke-linejoin="round" />
    <path d="M 344 212 C 336 184, 304 186, 284 210 C 296 222, 314 226, 336 226 C 340 222, 342 218, 344 212 Z" fill="#FFFDF9" stroke="#432010" stroke-width="6.5" stroke-linejoin="round" />

    <!-- Hai tai nhỏ tròn xinh nhô lên từ khối thân Mochi -->
    <path d="M 108 112 C 92 68, 108 38, 134 46 C 154 52, 164 82, 158 104 Z" fill="#FF9248" stroke="#432010" stroke-width="6.5" stroke-linejoin="round" />
    <path d="M 102 64 C 108 46, 120 42, 134 46 C 142 48, 148 56, 152 66 C 134 70, 116 70, 102 64 Z" fill="#432010" />

    <path d="M 272 112 C 288 68, 272 38, 246 46 C 226 52, 216 82, 222 104 Z" fill="#FF9248" stroke="#432010" stroke-width="6.5" stroke-linejoin="round" />
    <path d="M 278 64 C 272 46, 260 42, 246 46 C 238 48, 232 56, 228 66 C 246 70, 264 70, 278 64 Z" fill="#432010" />

    <!-- THÂN LIỀN ĐẦU TRÒN XOE NHƯ VIÊN BÁNH MOCHI / HẠT ĐẬU BÉO (PUSHEEN STYLE) -->
    <path d="M 190 86 C 272 86, 304 152, 298 248 C 294 308, 256 326, 190 326 C 124 326, 86 308, 82 248 C 76 152, 108 86, 190 86 Z" fill="#FF9248" stroke="#432010" stroke-width="6.5" stroke-linejoin="round" />

    <!-- Mảng bụng & mặt trắng kem tròn trịa liền mạch -->
    <path d="M 86 196 C 114 172, 156 176, 176 196 C 184 190, 196 190, 204 196 C 224 176, 266 172, 294 196 C 294 282, 256 322, 190 322 C 124 322, 86 282, 86 196 Z" fill="#FFFDF9" />
    <path d="M 190 86 C 272 86, 304 152, 298 248 C 294 308, 256 326, 190 326 C 124 326, 86 308, 82 248 C 76 152, 108 86, 190 86 Z" fill="none" stroke="#432010" stroke-width="6.5" stroke-linejoin="round" />

    <!-- Hai tay ngắn ngủn (Stubby Paws) vẫy tưng tưng -->
    <g class="f4-armL">
      <ellipse cx="92" cy="218" rx="22" ry="14" transform="rotate(-20 92 218)" fill="#432010" />
    </g>
    <g class="f4-armR">
      <ellipse cx="288" cy="218" rx="22" ry="14" transform="rotate(20 288 218)" fill="#432010" />
    </g>

    <!-- Hai chân ngắn cũn cỡn dưới đáy bánh Mochi -->
    <ellipse cx="142" cy="324" rx="18" ry="11" fill="#432010" />
    <ellipse cx="238" cy="324" rx="18" ry="11" fill="#432010" />

    <!-- Đôi mắt chấm tròn hạt đậu đơn giản mà siêu cưng -->
    <g class="f4-eyes">
      <circle cx="142" cy="166" r="11" fill="#432010" />
      <circle cx="139" cy="162" r="3.8" fill="#FFFFFF" />
      <circle cx="238" cy="166" r="11" fill="#432010" />
      <circle cx="235" cy="162" r="3.8" fill="#FFFFFF" />
    </g>

    <!-- Má hồng lớn phúng phính -->
    <ellipse cx="116" cy="182" rx="16" ry="10" fill="#FF8FA3" opacity="0.75" />
    <ellipse cx="264" cy="182" rx="16" ry="10" fill="#FF8FA3" opacity="0.75" />

    <!-- Mũi nhỏ & Miệng chữ W cười tít -->
    <ellipse cx="190" cy="172" rx="7" ry="5" fill="#432010" />
    <path d="M 172 182 Q 181 194, 190 182 Q 199 194, 208 182" stroke="#432010" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- 3 vệt sóng vui vẻ nảy trên đỉnh đầu -->
    <line x1="190" y1="58" x2="190" y2="40" stroke="#F59E0B" stroke-width="6" stroke-linecap="round" />
    <line x1="164" y1="64" x2="152" y2="48" stroke="#F59E0B" stroke-width="6" stroke-linecap="round" />
    <line x1="216" y1="64" x2="228" y2="48" stroke="#F59E0B" stroke-width="6" stroke-linecap="round" />
  </g>
</svg>