<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 380" width="360" height="380" fill="none">
  <defs>
    <style>
      @keyframes a13SkateGlide {
        0%, 100% { transform: translateX(-8px) translateY(0px) rotate(-2deg); }
        50%      { transform: translateX(8px) translateY(-6px) rotate(2deg); }
      }
      @keyframes a13ShadesGlint {
        0%, 100% { transform: translateY(0px); }
        50%      { transform: translateY(2.5px); }
      }
      @keyframes a13TailWind {
        0%, 100% { transform: rotate(-14deg); }
        50%      { transform: rotate(8deg); }
      }
      @keyframes a13SpeedLine {
        0%, 100% { transform: translateX(0px); opacity: 0.3; }
        50%      { transform: translateX(-18px); opacity: 0.85; }
      }

      .a13-skater { transform-origin: 168px 320px; animation: a13SkateGlide 1.6s ease-in-out infinite; }
      .a13-shades { animation: a13ShadesGlint 1.6s ease-in-out infinite; }
      .a13-tail   { transform-origin: 206px 294px; animation: a13TailWind 0.8s ease-in-out infinite; }
      .a13-speed  { animation: a13SpeedLine 1.1s ease-in-out infinite; }
    </style>

    <radialGradient id="a13Fur" cx="162" cy="124" r="115" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF9A44" />
      <stop offset="55%" stop-color="#F76414" />
      <stop offset="100%" stop-color="#C43E00" />
    </radialGradient>
    <linearGradient id="a13Hoodie" x1="100" y1="210" x2="230" y2="315" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="a13Lens" x1="80" y1="130" x2="240" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>

  <!-- Vệt gió tốc độ (Speed lines) -->
  <g class="a13-speed">
    <line x1="276" y1="168" x2="332" y2="168" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round" />
    <line x1="292" y1="242" x2="344" y2="242" stroke="#FDE047" stroke-width="3.5" stroke-linecap="round" />
    <line x1="268" y1="336" x2="336" y2="336" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />
  </g>

  <ellipse cx="168" cy="358" rx="108" ry="12" fill="#0F172A" opacity="0.34" />

  <g class="a13-skater">
    <!-- Đuôi bay theo gió -->
    <g class="a13-tail">
      <path d="M 198 298 C 218 244, 266 212, 314 224 C 344 232, 348 272, 322 300 C 296 326, 248 326, 198 310 Z" fill="url(#a13Fur)" />
      <path d="M 272 222 C 298 218, 322 226, 334 246 C 342 262, 336 284, 322 300 C 314 284, 300 280, 290 290 C 290 274, 278 270, 266 278 C 272 260, 264 246, 272 222 Z" fill="#FFFDF9" />
    </g>

    <!-- CHIẾC VÁN TRƯỢT STREETWEAR (SKATEBOARD) -->
    <g>
      <rect x="64" y="316" width="204" height="18" rx="9" fill="#F43F5E" stroke="#881337" stroke-width="3" />
      <line x1="78" y1="322" x2="254" y2="322" stroke="#FEF08A" stroke-width="3" stroke-linecap="round" />
      <!-- Trục & Bánh xe ván trượt -->
      <rect x="102" y="334" width="16" height="8" rx="2" fill="#94A3B8" />
      <rect x="214" y="334" width="16" height="8" rx="2" fill="#94A3B8" />
      <circle cx="110" cy="346" r="12" fill="#FDE047" stroke="#1E293B" stroke-width="4" />
      <circle cx="222" cy="346" r="12" fill="#FDE047" stroke="#1E293B" stroke-width="4" />
    </g>

    <!-- Hai chân đi giày Sneaker đứng trên ván trượt -->
    <ellipse cx="122" cy="312" rx="20" ry="13" fill="#FFFFFF" stroke="#0284C7" stroke-width="3" />
    <ellipse cx="204" cy="312" rx="20" ry="13" fill="#FFFFFF" stroke="#0284C7" stroke-width="3" />

    <!-- Áo Hoodie xanh Streetwear năng động -->
    <path d="M 112 214 C 102 254, 104 300, 122 314 L 202 314 C 220 300, 222 254, 212 214 Z" fill="url(#a13Hoodie)" stroke="#0369A1" stroke-width="2.5" />
    <!-- Túi áo Hoodie & Dây rút -->
    <path d="M 130 272 L 194 272 L 202 308 L 122 308 Z" fill="#0369A1" opacity="0.5" />
    <line x1="148" y1="224" x2="148" y2="256" stroke="#FEF08A" stroke-width="3.5" stroke-linecap="round" />
    <line x1="176" y1="224" x2="176" y2="256" stroke="#FEF08A" stroke-width="3.5" stroke-linecap="round" />

    <!-- Hai tay dang nhẹ giữ thăng bằng cực ngầu -->
    <path d="M 114 232 C 84 226, 62 206, 68 188 C 74 174, 94 182, 102 200 C 108 212, 114 220, 122 224 Z" fill="url(#a13Hoodie)" stroke="#0369A1" stroke-width="2" />
    <circle cx="76" cy="188" r="12" fill="#361509" />

    <path d="M 210 232 C 240 226, 262 206, 256 188 C 250 174, 230 182, 222 200 C 216 212, 210 220, 202 224 Z" fill="url(#a13Hoodie)" stroke="#0369A1" stroke-width="2" />
    <circle cx="248" cy="188" r="12" fill="#361509" />

    <!-- Đầu Cáo Đội Mũ Lưỡi Trai Ngược & Đeo Kính Râm Cực Ngầu -->
    <g>
      <path d="M 66 128 C 46 80, 54 24, 78 16 C 102 14, 134 52, 144 96 Z" fill="url(#a13Fur)" />
      <path d="M 55 52 C 60 28, 68 18, 78 16 C 90 15, 104 28, 114 48 C 94 54, 74 56, 55 52 Z" fill="#2E1207" />
      <path d="M 76 118 C 64 82, 70 42, 82 32 C 96 34, 116 64, 122 98 Z" fill="#F9BFA8" />

      <path d="M 258 128 C 278 80, 270 24, 246 16 C 222 14, 190 52, 180 96 Z" fill="url(#a13Fur)" />
      <path d="M 269 52 C 264 28, 256 18, 246 16 C 234 15, 220 28, 210 48 C 230 54, 250 56, 269 52 Z" fill="#2E1207" />
      <path d="M 248 118 C 260 82, 254 42, 242 32 C 228 34, 208 64, 202 98 Z" fill="#F9BFA8" />

      <!-- Mũ lưỡi trai đỏ đội ngược (Backwards Street Cap) -->
      <path d="M 106 84 C 106 44, 218 44, 218 84 Z" fill="#EF4444" stroke="#991B1B" stroke-width="2.5" />
      <path d="M 196 74 C 232 70, 262 78, 266 90 C 258 98, 224 94, 196 86 Z" fill="#B91C1C" stroke="#7F1D1D" stroke-width="2" />

      <path d="M 162 68 C 222 68, 258 112, 264 162 C 272 174, 266 196, 248 204 C 226 218, 196 222, 162 222 C 128 222, 98 218, 76 204 C 58 196, 52 174, 60 162 C 66 112, 102 68, 162 68 Z" fill="url(#a13Fur)" />
      <path d="M 60 166 C 78 148, 118 146, 146 168 C 154 162, 170 162, 178 168 C 206 146, 246 148, 264 166 C 270 178, 264 196, 248 204 C 226 218, 196 222, 162 222 C 128 222, 98 218, 76 204 C 60 196, 54 178, 60 166 Z" fill="#FFFDF9" />

      <!-- Kính Râm Cực Ngầu Có Vệt Sáng Phản Quang -->
      <g class="a13-shades">
        <polygon points="76,134 152,134 144,168 86,168" fill="url(#a13Lens)" stroke="#FBBF24" stroke-width="3.5" stroke-linejoin="round" />
        <polygon points="172,134 248,134 238,168 180,168" fill="url(#a13Lens)" stroke="#FBBF24" stroke-width="3.5" stroke-linejoin="round" />
        <line x1="150" y1="142" x2="174" y2="142" stroke="#FBBF24" stroke-width="4" />
        <line x1="94" y1="162" x2="114" y2="138" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round" opacity="0.85" />
        <line x1="190" y1="162" x2="210" y2="138" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round" opacity="0.85" />
      </g>

      <!-- Nụ cười nhếch mép tự tin (Cool Smirk) -->
      <path d="M 146 188 Q 168 196, 184 180" stroke="#361207" stroke-width="3.8" stroke-linecap="round" fill="none" />
      <ellipse cx="162" cy="171" rx="9.5" ry="6" fill="#240D04" />
    </g>
  </g>
</svg>