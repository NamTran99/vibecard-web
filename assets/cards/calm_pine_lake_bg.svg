<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 1320" fill="none" preserveAspectRatio="none">
  <defs>
    <!-- Misty Sage-Teal Pastel Sky-to-Hill Gradient -->
    <linearGradient id="mistySkyHillGrad" x1="215" y1="0" x2="215" y2="1120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D4E8E8" />
      <stop offset="18%" stop-color="#BCDAD9" />
      <stop offset="45%" stop-color="#9DC2C2" />
      <stop offset="78%" stop-color="#87B1B2" />
      <stop offset="100%" stop-color="#7AA6A8" />
    </linearGradient>

    <!-- Soft Lake Water Gradient (Strictly at bottom below all nodes & gift box) -->
    <linearGradient id="calmLakeWaterGrad" x1="215" y1="1010" x2="215" y2="1320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#BBE4FA" />
      <stop offset="75%" stop-color="#B1DCF5" />
      <stop offset="100%" stop-color="#A7D4F0" />
    </linearGradient>

    <!-- Reusable Layered Pine Tree A -->
    <g id="flatPineA">
      <ellipse cx="0" cy="48" rx="18" ry="5" fill="#7CA5A7" opacity="0.55" />
      <rect x="-3.5" y="34" width="7" height="14" rx="2" fill="#9BBEC0" />
      <path d="M 0 -22 C -8 -8, -22 10, -24 16 C -26 20, -18 22, -12 20 C -18 28, -26 36, -26 39 C -26 42, 26 42, 26 39 C 26 36, 18 28, 12 20 C 18 22, 26 20, 24 16 C 22 10, 8 -8, 0 -22 Z" fill="#BCE0E1" />
      <path d="M 0 -22 C -6 -10, -18 4, -19 8 C -20 11, 20 11, 19 8 C 18 4, 6 -10, 0 -22 Z" fill="#CEEAEB" />
    </g>

    <!-- Reusable Tree Stump with Roots -->
    <g id="flatTreeStump">
      <ellipse cx="0" cy="10" rx="22" ry="6" fill="#7CA5A7" opacity="0.45" />
      <path d="M -11 0 L -15 9 L -24 13 M 11 0 L 16 9 L 25 12 M -4 6 L -9 14 M 5 6 L 11 15" stroke="#9BBEC0" stroke-width="2.2" stroke-linecap="round" />
      <path d="M -12 -6 L -15 7 C -8 10, 8 10, 15 7 L 12 -6 Z" fill="#9BBEC0" />
      <ellipse cx="0" cy="-6" rx="12" ry="4.2" fill="#CEEAEB" />
      <ellipse cx="0" cy="-6" rx="7.5" ry="2.4" fill="none" stroke="#9BBEC0" stroke-width="1.2" />
    </g>
  </defs>

  <!-- 1. Base Misty Sage-Teal Meadow Canvas (Nodes 01 to 10 all stand on solid green land!) -->
  <rect width="430" height="1320" fill="url(#mistySkyHillGrad)" />

  <!-- 2. Distant Layered Mountain Ridges (Top) -->
  <path d="M -20 85 Q 75 42, 185 78 T 450 64 L 450 185 L -20 185 Z" fill="#C5E1E1" opacity="0.7" />
  <path d="M -20 125 Q 110 92, 235 118 T 450 105 L 450 215 L -20 215 Z" fill="#B2D3D3" opacity="0.85" />
  <path d="M -20 172 Q 140 148, 290 165 T 450 156 L 450 245 L -20 245 Z" fill="#A2C6C6" />

  <!-- 3. Upper-Right Distant Pine Grove (Section 1 Top Right) -->
  <g transform="translate(278, 138) scale(0.82)" opacity="0.72"><use href="#flatPineA" /></g>
  <g transform="translate(316, 125) scale(1.05)" opacity="0.82"><use href="#flatPineA" /></g>
  <g transform="translate(358, 134) scale(0.9)" opacity="0.76"><use href="#flatPineA" /></g>
  <g transform="translate(394, 142) scale(0.75)" opacity="0.68"><use href="#flatPineA" /></g>
  <ellipse cx="336" cy="176" rx="85" ry="7" fill="#94BABA" opacity="0.6" />

  <!-- 4. Section 1 Left & Right Border Props (Away from the S-curve nodes) -->
  <!-- Right small stump -->
  <g transform="translate(356, 254) scale(0.85)"><use href="#flatTreeStump" /></g>

  <!-- Right mid pine duo -->
  <g transform="translate(332, 336) scale(0.92)"><use href="#flatPineA" /></g>
  <g transform="translate(364, 352) scale(0.68)"><use href="#flatPineA" /></g>

  <!-- Left stump with roots -->
  <g transform="translate(46, 392) scale(0.92)"><use href="#flatTreeStump" /></g>

  <!-- Right fallen log & stump -->
  <g transform="translate(376, 468) scale(0.9)">
    <path d="M -48 12 L -8 2 L -4 10 L -44 20 Z" fill="#9BBEC0" />
    <ellipse cx="-46" cy="16" rx="4" ry="5" fill="#7CA5A7" />
    <use href="#flatTreeStump" />
  </g>

  <!-- 5. Section 2 Meadow Land & Border Pines (Nodes 06, 07, 08, 09, 10 all sit on solid Sage-Teal Land!) -->
  <!-- Left Pine Cluster & Winding White-Bordered Stream along Left Border (Nodes 06-09 curve on the right at x=56..84%, so left side is completely free!) -->
  <path d="M -10 692 C 32 692, 58 698, 86 712 L 86 728 L -10 728 Z" fill="#638D90" />
  <g transform="translate(18, 665) scale(0.88)"><use href="#flatPineA" /></g>
  <g transform="translate(50, 656) scale(1.02)"><use href="#flatPineA" /></g>
  <g transform="translate(80, 672) scale(0.78)"><use href="#flatPineA" /></g>

  <!-- Left Winding Stream Channel (strictly on left border x < 95) -->
  <path d="M -12 720 C 52 724, 92 746, 82 776 C 72 802, 18 822, -12 844" stroke="#D7ECEC" stroke-width="18" stroke-linecap="round" fill="none" />
  <path d="M -12 720 C 52 724, 92 746, 82 776 C 72 802, 18 822, -12 844" stroke="#79A4A7" stroke-width="11" stroke-linecap="round" fill="none" />

  <!-- Right Edge Pines beside Node 09-10 (at far right edge x=385..418) -->
  <path d="M 352 945 C 372 928, 412 928, 442 948 L 442 975 L 352 975 Z" fill="#5D878A" />
  <g transform="translate(382, 898) scale(0.95)"><use href="#flatPineA" /></g>
  <g transform="translate(412, 910) scale(0.74)"><use href="#flatPineA" /></g>

  <!-- Lower-left stump above shoreline -->
  <g transform="translate(96, 956) scale(0.88)"><use href="#flatTreeStump" /></g>

  <!-- 6. Calm Lake Shoreline & 3D Ledge Rim (Starts at y=1045, BELOW Node 10 Gift Box so NO item ever touches water!) -->
  <!-- Dark Slate-Teal Shoreline Cliff Wall -->
  <path d="M -15 1038 C 22 1038, 48 1066, 56 1102 C 62 1128, 122 1122, 168 1104 C 214 1086, 264 1094, 304 1064 C 342 1036, 368 994, 404 990 C 424 988, 436 998, 445 1008 L 445 1320 L -15 1320 Z" fill="#5B8286" />

  <!-- Calm Pastel Sky-Blue Lake Water -->
  <path d="M -15 1052 C 18 1052, 42 1078, 50 1112 C 56 1138, 120 1132, 168 1114 C 214 1096, 266 1104, 306 1074 C 344 1046, 370 1004, 406 1000 C 424 998, 436 1008, 445 1018 L 445 1320 L -15 1320 Z" fill="url(#calmLakeWaterGrad)" />

  <!-- Soft Water Ripples -->
  <ellipse cx="356" cy="1072" rx="28" ry="5.5" fill="#DDF2FD" opacity="0.85" />
  <ellipse cx="374" cy="1116" rx="14" ry="3.2" fill="#DDF2FD" opacity="0.75" />
  <ellipse cx="182" cy="1158" rx="22" ry="4.5" fill="#DDF2FD" opacity="0.75" />
  <ellipse cx="92" cy="1196" rx="26" ry="5" fill="#DDF2FD" opacity="0.7" />

  <!-- 7. Cute Coral-Red & Lavender Wooden Rowboat with Oars Floating on the Lake Below Node 10 -->
  <g transform="translate(268, 1142) rotate(-6)">
    <!-- Boat Water Shadow -->
    <ellipse cx="2" cy="14" rx="34" ry="8.5" fill="#9AC9E8" opacity="0.85" />
    <!-- Back Oar -->
    <line x1="-4" y1="-10" x2="12" y2="-22" stroke="#7E6CE6" stroke-width="2.4" stroke-linecap="round" />
    <!-- Boat Hull (Lavender Base + Coral-Red Rim) -->
    <path d="M -32 -2 C -26 14, 24 14, 32 -2 Z" fill="#8C7AE6" />
    <path d="M -34 -3 C -28 5, 28 5, 34 -3 L 30 -8 L -30 -8 Z" fill="#EB6B56" />
    <ellipse cx="0" cy="-6" rx="28" ry="5.5" fill="#F28B78" />
    <ellipse cx="0" cy="-6" rx="21" ry="3.6" fill="#B84B39" />
    <!-- Wooden Seats -->
    <rect x="-12" y="-8.5" width="4.5" height="5" rx="1" fill="#F28B78" />
    <rect x="6" y="-8.5" width="4.5" height="5" rx="1" fill="#F28B78" />
    <!-- Front Oar with Paddle -->
    <line x1="2" y1="-5" x2="28" y2="12" stroke="#D9E8F5" stroke-width="2.4" stroke-linecap="round" />
    <path d="M 24 9 L 34 14 C 36 15, 34 19, 31 18 L 22 12 Z" fill="#6C5CE7" />
  </g>

  <!-- 8. Bottom Mint-Sage Pine Foreground Silhouette -->
  <g fill="#9FD4CB" opacity="0.88">
    <path d="M 310 1215 L 285 1295 L 335 1295 Z" />
    <path d="M 342 1195 L 312 1295 L 372 1295 Z" />
    <path d="M 378 1210 L 350 1295 L 406 1295 Z" />
    <path d="M 412 1225 L 388 1295 L 436 1295 Z" />
    <path d="M 48 1230 L 22 1300 L 74 1300 Z" />
    <path d="M 82 1215 L 54 1300 L 110 1300 Z" />
  </g>
</svg>
