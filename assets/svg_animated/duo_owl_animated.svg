<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 280" width="300" height="280" fill="none">
  <defs>
    <style>
      /* 1. Nhịp bật nhảy Squash & Stretch (Nén khi xuống & Giãn khi bay lên) */
      @keyframes duoJump {
        0%, 100% { transform: translateY(6px) scale(1.04, 0.95); }
        15%      { transform: translateY(-2px) scale(0.96, 1.05); }
        45%      { transform: translateY(-16px) scale(0.98, 1.03); }
        55%      { transform: translateY(-15px) scale(1, 1); }
        85%      { transform: translateY(3px) scale(1.02, 0.97); }
      }

      /* 2. Bóng tròn xám dưới đất co giãn ngược pha với độ cao nhảy */
      @keyframes duoShadow {
        0%, 100% { transform: scale(1.04, 1.02); opacity: 1; }
        48%      { transform: scale(0.84, 0.84); opacity: 0.75; }
      }

      /* 3. Đôi cánh vỗ hào hứng (Khóa chặt tại ổ khớp vai, chỉ dùng rotate) */
      @keyframes wingLeftFlap {
        0%, 100% { transform: rotate(-14deg); }
        25%      { transform: rotate(22deg); }
        50%      { transform: rotate(-18deg); }
        75%      { transform: rotate(18deg); }
      }
      @keyframes wingRightFlap {
        0%, 100% { transform: rotate(14deg); }
        25%      { transform: rotate(-22deg); }
        50%      { transform: rotate(18deg); }
        75%      { transform: rotate(-18deg); }
      }

      /* 4. Hai bàn chân cam đạp nhịp vui nhộn trên không */
      @keyframes footLeftKick {
        0%, 100% { transform: rotate(0deg) translateY(0px); }
        48%      { transform: rotate(14deg) translateY(-4px); }
      }
      @keyframes footRightKick {
        0%, 100% { transform: rotate(0deg) translateY(0px); }
        48%      { transform: rotate(-14deg) translateY(-4px); }
      }

      /* 5. Ngôi sao lấp lánh trong mắt (Starry Eye Twinkle) */
      @keyframes eyeStarTwinkle {
        0%, 100% { transform: scale(0.88) rotate(0deg); }
        50%      { transform: scale(1.22) rotate(8deg); }
      }

      /* 6. Chớp mắt tự nhiên kết hợp nhướng lông mày */
      @keyframes duoBlink {
        0%, 44%, 48%, 94%, 98%, 100% { transform: scaleY(1); }
        46%, 96%                     { transform: scaleY(0.08); }
      }
      @keyframes browPerk {
        0%, 100% { transform: translateY(0px); }
        48%      { transform: translateY(-3.5px); }
      }

      /* 7. Mỏ dưới & Lưỡi hồng há hót vui vẻ */
      @keyframes beakChirp {
        0%, 100% { transform: scaleY(0.92); }
        30%      { transform: scaleY(1.08); }
        55%      { transform: scaleY(0.96); }
        75%      { transform: scaleY(1.06); }
      }

      .rig-shadow {
        transform-origin: 150px 194px;
        animation: duoShadow 1.15s cubic-bezier(0.42, 0, 0.58, 1) infinite;
      }
      .rig-body {
        transform-origin: 150px 210px;
        animation: duoJump 1.15s cubic-bezier(0.42, 0, 0.58, 1) infinite;
      }
      .rig-wing-left {
        transform-origin: 78px 136px;
        animation: wingLeftFlap 0.575s ease-in-out infinite;
      }
      .rig-wing-right {
        transform-origin: 222px 136px;
        animation: wingRightFlap 0.575s ease-in-out infinite;
      }
      .rig-foot-left {
        transform-origin: 96px 210px;
        animation: footLeftKick 1.15s ease-in-out infinite;
      }
      .rig-foot-right {
        transform-origin: 204px 210px;
        animation: footRightKick 1.15s ease-in-out infinite;
      }
      .rig-eyes {
        transform-origin: 150px 112px;
        animation: duoBlink 4.2s infinite;
      }
      .rig-brows {
        transform-origin: 150px 72px;
        animation: browPerk 1.15s ease-in-out infinite;
      }
      .rig-star-left {
        transform-origin: 118px 111px;
        animation: eyeStarTwinkle 0.85s ease-in-out infinite;
      }
      .rig-star-right {
        transform-origin: 198px 111px;
        animation: eyeStarTwinkle 0.85s ease-in-out -0.25s infinite;
      }
      .rig-beak-lower {
        transform-origin: 150px 136px;
        animation: beakChirp 1.15s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- ==================== 1. VÒNG BÓNG ĐỔ XÁM TRÒN PHÍA SAU/DƯỚI (#ECEAEC) ==================== -->
  <ellipse class="rig-shadow" cx="150" cy="184" rx="95" ry="74" fill="#ECEAEC" />

  <!-- ==================== 2. TOÀN THÂN CÚ DUO NHẢY MỪNG ==================== -->
  <g class="rig-body">

    <!-- 2.1. ĐÔI CÁNH VỖ HAI BÊN (Khóa gốc tại ổ vai (78,136) và (222,136)) -->
    <!-- Cánh Trái -->
    <g class="rig-wing-left">
      <path d="M 82 114 L 40 113 C 27 113, 24 126, 30 138 C 39 156, 60 166, 86 164 Z" fill="#67D400" />
    </g>
    <!-- Cánh Phải -->
    <g class="rig-wing-right">
      <path d="M 218 114 L 260 113 C 273 113, 276 126, 270 138 C 261 156, 240 166, 214 164 Z" fill="#67D400" />
    </g>

    <!-- 2.2. THÂN CHÍNH HÌNH Hạt Đậu / Trứng Tai Cú Đặc Trưng (#67D400) -->
    <path d="M 150 28 C 134 28, 114 14, 94 18 C 72 22, 62 46, 62 76 L 62 142 C 62 192, 98 224, 150 224 C 202 224, 238 192, 238 142 L 238 76 C 238 46, 228 22, 206 18 C 186 14, 166 28, 150 28 Z" fill="#67D400" />

    <!-- 2.3. MẶT NẠ XANH LÁ MẠ QUANH MẮT & LÔNG MÀY NHỌN (#94E822) -->
    <!-- Hai vòng tròn nền mắt xanh non giao nhau -->
    <circle cx="110" cy="114" r="44" fill="#94E822" />
    <circle cx="190" cy="114" r="44" fill="#94E822" />
    <rect x="110" y="96" width="80" height="38" fill="#94E822" />

    <!-- Chùm lông mày tai cú nhọn 2 nấc phía trên mắt -->
    <g class="rig-brows" fill="#94E822">
      <!-- Lông mày trái -->
      <path d="M 74 96 C 72 78, 78 62, 86 58 C 90 56, 92 64, 94 68 C 98 56, 106 46, 114 48 C 122 50, 134 68, 144 82 Z" />
      <!-- Lông mày phải -->
      <path d="M 226 96 C 228 78, 222 62, 214 58 C 210 56, 208 64, 206 68 C 202 56, 194 46, 186 48 C 178 50, 166 68, 156 82 Z" />
    </g>

    <!-- 2.4.3 VẢY LÔNG BỤNG XANH NON (#94E822) -->
    <g fill="#94E822">
      <!-- Hàng trên (2 vảy) -->
      <path d="M 116 178 Q 130 180, 142 178 C 142 188, 116 188, 116 178 Z" />
      <path d="M 158 178 Q 170 180, 184 178 C 184 188, 158 188, 158 178 Z" />
      <!-- Hàng dưới (1 vảy giữa) -->
      <path d="M 136 193 Q 150 195, 164 193 C 164 203, 136 203, 136 193 Z" />
    </g>

    <!-- 2.5. ĐÔI MẮT TO TRÒN LONG LANH CÓ NGÔI SAO 4 CÁNH (#565458 & #FFFFFF) -->
    <g class="rig-eyes">
      <!-- MẮT TRÁI -->
      <circle cx="110" cy="112" r="34" fill="#FFFFFF" />
      <circle cx="110" cy="112" r="23" fill="#565458" />
      <!-- Đốm sáng tròn lớn góc trên trái (Cắt lẹm viền con ngươi chuẩn ảnh gốc) -->
      <circle cx="96" cy="100" r="9.5" fill="#FFFFFF" />
      <!-- Vệt sáng cong hạt đậu góc dưới trái -->
      <path d="M 96 116 C 95 123, 101 128, 108 127" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />
      <!-- Ngôi sao 4 cánh lấp lánh bên phải con ngươi -->
      <path class="rig-star-left" d="M 118 99 Q 118 111, 130 111 Q 118 111, 118 123 Q 118 111, 106 111 Q 118 111, 118 99 Z" fill="#FFFFFF" />

      <!-- MẮT PHẢI -->
      <circle cx="190" cy="112" r="34" fill="#FFFFFF" />
      <circle cx="190" cy="112" r="23" fill="#565458" />
      <!-- Đốm sáng tròn lớn góc trên trái -->
      <circle cx="176" cy="100" r="9.5" fill="#FFFFFF" />
      <!-- Vệt sáng cong hạt đậu góc dưới trái -->
      <path d="M 176 116 C 175 123, 181 128, 188 127" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />
      <!-- Ngôi sao 4 cánh lấp lánh bên phải con ngươi -->
      <path class="rig-star-right" d="M 198 99 Q 198 111, 210 111 Q 198 111, 198 123 Q 198 111, 186 111 Q 198 111, 198 99 Z" fill="#FFFFFF" />
    </g>

    <!-- 2.6. CHIẾC MỎ VÀNG HÁ HÓT VUI VẺ & LƯỠI HỒNG -->
    <!-- Phần mỏ dưới há mở + Lòng miệng + Lưỡi hồng -->
    <g class="rig-beak-lower">
      <!-- Viền mỏ dưới màu cam (#F59C00) -->
      <path d="M 136 134 L 164 134 L 162 154 C 161 164, 139 164, 138 154 Z" fill="#F59C00" />
      <!-- Lòng miệng nâu cam đậm (#BA6B06) -->
      <path d="M 140 135 L 160 135 L 158 151 C 157 158, 143 158, 142 151 Z" fill="#BA6B06" />
      <!-- Chiếc lưỡi hồng bầu dục (#F9C4D2) -->
      <ellipse cx="150" cy="151" rx="7.5" ry="4.5" fill="#F9C4D2" />
    </g>

    <!-- Phần mỏ trên vàng tươi (#FFCA34) đè lên mép trên của miệng -->
    <path d="M 132 135 C 132 121, 168 121, 168 135 C 168 139, 162 140, 150 140 C 138 140, 132 139, 132 135 Z" fill="#FFCA34" />
    <path d="M 134 136 Q 150 141, 166 136" stroke="#E59A0C" stroke-width="2" stroke-linecap="round" />

    <!-- 2.7. HAI BÀN CHÂN CAM MŨM MĨM (#F89C00) -->
    <g class="rig-foot-left">
      <rect x="74" y="192" width="38" height="28" rx="14" transform="rotate(32 93 206)" fill="#F89C00" />
    </g>
    <g class="rig-foot-right">
      <rect x="188" y="192" width="38" height="28" rx="14" transform="rotate(-32 207 206)" fill="#F89C00" />
    </g>

  </g>
</svg>
