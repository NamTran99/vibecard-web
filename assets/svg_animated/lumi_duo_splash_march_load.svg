<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 420" width="360" height="420" fill="none">
  <defs>
    <style>
      @keyframes d3MarchBody {
        0%, 50%, 100% { transform: translateY(0px) scale(1.02, 0.98); }
        25%           { transform: translateY(-10px) rotate(-3deg) scale(0.98, 1.02); }
        75%           { transform: translateY(-10px) rotate(3deg) scale(0.98, 1.02); }
      }
      @keyframes d3StepL {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        25%      { transform: translateY(-18px) rotate(-18deg); }
        50%      { transform: translateY(0px) rotate(0deg); }
      }
      @keyframes d3StepR {
        0%, 50%, 100% { transform: translateY(0px) rotate(0deg); }
        75%           { transform: translateY(-18px) rotate(18deg); }
      }
      @keyframes d3SwingL {
        0%, 100% { transform: rotate(22deg); }
        50%      { transform: rotate(-22deg); }
      }
      @keyframes d3SwingR {
        0%, 100% { transform: rotate(-22deg); }
        50%      { transform: rotate(22deg); }
      }
      @keyframes d3LoadFill {
        0%   { width: 24px; }
        50%  { width: 165px; }
        100% { width: 220px; }
      }

      .d3-body { transform-origin: 180px 300px; animation: d3MarchBody 1.1s ease-in-out infinite; }
      .d3-legL { transform-origin: 152px 296px; animation: d3StepL 1.1s ease-in-out infinite; }
      .d3-legR { transform-origin: 208px 296px; animation: d3StepR 1.1s ease-in-out infinite; }
      .d3-armL { transform-origin: 132px 228px; animation: d3SwingL 1.1s ease-in-out infinite; }
      .d3-armR { transform-origin: 228px 228px; animation: d3SwingR 1.1s ease-in-out infinite; }
      .d3-bar  { animation: d3LoadFill 2.4s ease-in-out infinite; }
    </style>
  </defs>

  <ellipse cx="180" cy="332" rx="76" ry="11" fill="#1F0E05" opacity="0.28" />

  <g class="d3-body">
    <!-- Đuôi bông phía sau -->
    <path d="M 206 292 C 218 238, 258 206, 304 214 C 336 220, 346 256, 324 284 C 304 310, 256 314, 206 302 Z" fill="#E05A00" />
    <path d="M 268 214 C 294 208, 318 216, 330 236 C 338 252, 334 270, 324 284 C 314 270, 300 266, 290 276 C 290 262, 278 258, 268 266 Z" fill="#FFFDF7" />

    <!-- Hai chân bước đều tại chỗ (Marching in place) -->
    <g class="d3-legL">
      <rect x="138" y="286" width="26" height="36" rx="13" fill="#E05A00" />
      <ellipse cx="148" cy="322" rx="17" ry="10.5" fill="#3C1B08" />
    </g>
    <g class="d3-legR">
      <rect x="196" y="286" width="26" height="36" rx="13" fill="#E05A00" />
      <ellipse cx="212" cy="322" rx="17" ry="10.5" fill="#3C1B08" />
    </g>

    <!-- Thân & Ngực kem -->
    <rect x="126" y="200" width="108" height="102" rx="50" fill="#FF781F" />
    <ellipse cx="180" cy="256" rx="36" ry="42" fill="#FFFDF7" />

    <!-- Hai tay đánh nhịp đi bộ vui vẻ -->
    <g class="d3-armL">
      <rect x="104" y="216" width="28" height="56" rx="14" fill="#FF781F" />
      <circle cx="118" cy="268" r="13" fill="#3C1B08" />
    </g>
    <g class="d3-armR">
      <rect x="228" y="216" width="28" height="56" rx="14" fill="#FF781F" />
      <circle cx="242" cy="268" r="13" fill="#3C1B08" />
    </g>

    <rect x="118" y="198" width="124" height="24" rx="12" fill="#FFC800" />

    <!-- Đầu Cáo mỉm cười tự tin nhìn thẳng -->
    <g>
      <path d="M 88 124 C 68 78, 76 26, 100 18 C 124 16, 152 50, 160 92 Z" fill="#FF781F" />
      <path d="M 78 50 C 84 28, 90 20, 100 18 C 112 17, 124 28, 134 46 C 114 52, 96 54, 78 50 Z" fill="#3C1B08" />
      <path d="M 98 114 C 86 80, 92 44, 104 36 C 118 38, 134 64, 140 94 Z" fill="#FFB49A" />

      <path d="M 272 124 C 292 78, 284 26, 260 18 C 236 16, 208 50, 200 92 Z" fill="#FF781F" />
      <path d="M 282 50 C 276 28, 270 20, 260 18 C 248 17, 236 28, 226 46 C 246 52, 264 54, 282 50 Z" fill="#3C1B08" />
      <path d="M 262 114 C 274 80, 268 44, 256 36 C 242 38, 226 64, 220 94 Z" fill="#FFB49A" />

      <path d="M 180 64 C 240 64, 274 106, 280 158 C 286 172, 278 194, 258 202 C 236 214, 210 218, 180 218 C 150 218, 124 214, 102 202 C 82 194, 74 172, 80 158 C 86 106, 120 64, 180 64 Z" fill="#FF781F" />
      <path d="M 80 162 C 100 142, 140 142, 166 164 C 174 158, 186 158, 194 164 C 220 142, 260 142, 280 162 C 284 174, 276 194, 258 202 C 236 214, 210 218, 180 218 C 150 218, 124 214, 102 202 C 84 194, 76 174, 80 162 Z" fill="#FFFDF7" />

      <rect x="114" y="124" width="44" height="56" rx="22" fill="#FFFFFF" />
      <rect x="122" y="132" width="32" height="44" rx="16" fill="#3C1B08" />
      <circle cx="132" cy="144" r="8" fill="#FFFFFF" />

      <rect x="202" y="124" width="44" height="56" rx="22" fill="#FFFFFF" />
      <rect x="206" y="132" width="32" height="44" rx="16" fill="#3C1B08" />
      <circle cx="216" cy="144" r="8" fill="#FFFFFF" />

      <ellipse cx="180" cy="166" rx="11" ry="7" fill="#3C1B08" />
      <path d="M 160 182 Q 180 194, 200 182" stroke="#3C1B08" stroke-width="5" stroke-linecap="round" fill="none" />
    </g>
  </g>

  <!-- Thanh Loading 3D Viên Thuốc Chuẩn Duolingo (Duolingo 3D Pill Progress Bar) -->
  <rect x="70" y="356" width="220" height="22" rx="11" fill="#2B3123" stroke="#3C4430" stroke-width="2" />
  <rect class="d3-bar" x="70" y="356" width="160" height="22" rx="11" fill="#58CC02" />
  <rect x="78" y="360" width="90" height="6" rx="3" fill="#89E219" opacity="0.85" />
  <text x="180" y="402" text-anchor="middle" fill="#9BA38E" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="13" letter-spacing="1">ĐANG TẢI BÀI HỌC...</text>
</svg>