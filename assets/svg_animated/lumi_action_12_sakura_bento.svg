<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 380" width="360" height="380" fill="none">
  <defs>
    <style>
      @keyframes a12ChewBounce {
        0%, 100% { transform: translateY(0px) scale(1, 1); }
        50%      { transform: translateY(-4px) scale(1.02, 0.98); }
      }
      @keyframes a12DangoHand {
        0%, 100% { transform: rotate(-6deg) translateY(0px); }
        50%      { transform: rotate(8deg) translateY(-6px); }
      }
      @keyframes a12PetalFall1 {
        0%   { transform: translate(0px, 0px) rotate(0deg); opacity: 0; }
        25%  { opacity: 0.95; }
        100% { transform: translate(-45px, 110px) rotate(160deg); opacity: 0; }
      }
      @keyframes a12PetalFall2 {
        0%   { transform: translate(0px, 0px) rotate(0deg); opacity: 0; }
        25%  { opacity: 0.9; }
        100% { transform: translate(-38px, 120px) rotate(-140deg); opacity: 0; }
      }
      @keyframes a12Tail {
        0%, 100% { transform: rotate(-10deg); }
        50%      { transform: rotate(14deg); }
      }

      .a12-body  { transform-origin: 162px 334px; animation: a12ChewBounce 1.4s ease-in-out infinite; }
      .a12-dango { transform-origin: 204px 238px; animation: a12DangoHand 1.4s ease-in-out infinite; }
      .a12-tail  { transform-origin: 200px 312px; animation: a12Tail 1.4s ease-in-out infinite; }
      .a12-p1    { animation: a12PetalFall1 3.6s linear infinite; }
      .a12-p2    { animation: a12PetalFall2 3.6s linear 1.8s infinite; }
    </style>

    <radialGradient id="a12Fur" cx="162" cy="126" r="115" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF9E48" />
      <stop offset="55%" stop-color="#F76818" />
      <stop offset="100%" stop-color="#C43E00" />
    </radialGradient>
    <linearGradient id="a12Haori" x1="100" y1="215" x2="225" y2="338" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>
  </defs>

  <!-- Cánh hoa anh đào rơi lãng mạn -->
  <g class="a12-p1">
    <path d="M 295 45 C 305 40, 312 48, 304 56 C 296 62, 288 52, 295 45 Z" fill="#F9A8D4" />
  </g>
  <g class="a12-p2">
    <path d="M 110 30 C 120 25, 126 33, 118 41 C 110 47, 102 37, 110 30 Z" fill="#F472B6" />
  </g>

  <ellipse cx="168" cy="348" rx="98" ry="13" fill="#2A1205" opacity="0.26" />

  <g class="a12-body">
    <g class="a12-tail">
      <path d="M 194 320 C 198 258, 238 214, 288 218 C 326 222, 342 262, 322 296 C 302 328, 250 338, 194 328 Z" fill="url(#a12Fur)" />
      <path d="M 252 222 C 278 214, 306 220, 322 242 C 334 258, 330 280, 322 296 C 314 280, 300 276, 288 288 C 288 272, 276 268, 264 276 C 266 260, 254 248, 252 222 Z" fill="#FFFDF9" />
    </g>

    <ellipse cx="108" cy="312" rx="24" ry="28" transform="rotate(-12 108 312)" fill="url(#a12Fur)" />
    <ellipse cx="216" cy="312" rx="24" ry="28" transform="rotate(12 216 312)" fill="url(#a12Fur)" />
    <ellipse cx="92" cy="336" rx="18" ry="12" fill="#361509" />
    <ellipse cx="232" cy="336" rx="18" ry="12" fill="#361509" />

    <!-- Áo khoác Kimono/Haori màu Xanh Matcha truyền thống Nhật Bản -->
    <path d="M 106 218 C 94 262, 96 322, 116 338 L 208 338 C 228 322, 230 262, 218 218 Z" fill="url(#a12Haori)" stroke="#14532D" stroke-width="2" />
    <path d="M 136 220 L 162 268 L 188 220 Z" fill="#FFFDF9" />
    <path d="M 132 220 L 162 272 L 192 220" stroke="#F472B6" stroke-width="5" fill="none" />

    <!-- Tay trái ôm hộp trà -->
    <path d="M 116 244 C 96 254, 96 280, 116 288 C 130 292, 138 274, 130 256 Z" fill="url(#a12Haori)" />
    <circle cx="120" cy="284" r="12" fill="#361509" />

    <!-- Đầu Cáo cười tít mắt hạnh phúc thưởng thức bánh Dango -->
    <g>
      <path d="M 66 128 C 46 80, 54 24, 78 16 C 102 14, 134 52, 144 96 Z" fill="url(#a12Fur)" />
      <path d="M 55 52 C 60 28, 68 18, 78 16 C 90 15, 104 28, 114 48 C 94 54, 74 56, 55 52 Z" fill="#2E1207" />
      <path d="M 76 118 C 64 82, 70 42, 82 32 C 96 34, 116 64, 122 98 Z" fill="#F9BFA8" />

      <path d="M 258 128 C 278 80, 270 24, 246 16 C 222 14, 190 52, 180 96 Z" fill="url(#a12Fur)" />
      <path d="M 269 52 C 264 28, 256 18, 246 16 C 234 15, 220 28, 210 48 C 230 54, 250 56, 269 52 Z" fill="#2E1207" />
      <path d="M 248 118 C 260 82, 254 42, 242 32 C 228 34, 208 64, 202 98 Z" fill="#F9BFA8" />

      <path d="M 162 66 C 222 66, 258 112, 264 162 C 272 174, 266 196, 248 204 C 226 218, 196 222, 162 222 C 128 222, 98 218, 76 204 C 58 196, 52 174, 60 162 C 66 112, 102 66, 162 66 Z" fill="url(#a12Fur)" />
      <path d="M 60 166 C 78 148, 118 146, 146 168 C 154 162, 170 162, 178 168 C 206 146, 246 148, 264 166 C 270 178, 264 196, 248 204 C 226 218, 196 222, 162 222 C 128 222, 98 218, 76 204 C 60 196, 54 178, 60 166 Z" fill="#FFFDF9" />

      <!-- Bông hoa anh đào 5 cánh cài trên tai phải -->
      <g transform="translate(216, 72)">
        <circle cx="0" cy="-10" r="8" fill="#F9A8D4" />
        <circle cx="10" cy="-3" r="8" fill="#F9A8D4" />
        <circle cx="6" cy="9" r="8" fill="#F9A8D4" />
        <circle cx="-6" cy="9" r="8" fill="#F9A8D4" />
        <circle cx="-10" cy="-3" r="8" fill="#F9A8D4" />
        <circle cx="0" cy="0" r="4.5" fill="#FEF08A" />
      </g>

      <!-- Đôi mắt cười cong vút hạnh phúc (^ ^) -->
      <path d="M 96 152 C 104 134, 128 134, 136 152" stroke="#2E1207" stroke-width="5" stroke-linecap="round" fill="none" />
      <path d="M 188 152 C 196 134, 220 134, 228 152" stroke="#2E1207" stroke-width="5" stroke-linecap="round" fill="none" />

      <!-- Hai má phúng phính ửng hồng vì đồ ăn ngon -->
      <ellipse cx="88" cy="176" rx="18" ry="11" fill="#FB7185" opacity="0.58" />
      <ellipse cx="236" cy="176" rx="18" ry="11" fill="#FB7185" opacity="0.58" />

      <!-- Miệng nhai nhóp nhép đáng yêu (:3) -->
      <path d="M 146 182 Q 154 192, 162 182 Q 170 192, 178 182" stroke="#361207" stroke-width="3.6" stroke-linecap="round" fill="none" />
      <ellipse cx="162" cy="168" rx="9.5" ry="6" fill="#240D04" />
    </g>

    <!-- Tay phải cầm Xiên Bánh Hanami Dango 3 màu (Hồng - Trắng - Xanh Matcha) -->
    <g class="a12-dango">
      <line x1="214" y1="234" x2="266" y2="148" stroke="#A16207" stroke-width="4.5" stroke-linecap="round" />
      <!-- Viên xanh matcha -->
      <circle cx="234" cy="200" r="14" fill="#86EFAC" stroke="#15803D" stroke-width="2" />
      <!-- Viên trắng kem -->
      <circle cx="248" cy="178" r="14" fill="#FFFDF9" stroke="#CBD5E1" stroke-width="2" />
      <!-- Viên hồng Sakura -->
      <circle cx="262" cy="156" r="14" fill="#F9A8D4" stroke="#DB2777" stroke-width="2" />
      <circle cx="257" cy="151" r="4" fill="#FFFFFF" opacity="0.75" />

      <!-- Bàn tay cầm que bánh -->
      <path d="M 198 246 C 216 244, 228 232, 224 218 C 220 206, 204 212, 196 228 Z" fill="url(#a12Haori)" />
      <circle cx="220" cy="224" r="12" fill="#361509" />
    </g>
  </g>
</svg>