<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 380" width="360" height="380" fill="none">
  <defs>
    <style>
      @keyframes vinylFloat {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50%      { transform: translateY(-5px) rotate(0.8deg); }
      }
      @keyframes vinylHead {
        0%, 100% { transform: rotate(-4deg); }
        50%      { transform: rotate(3.5deg); }
      }
      @keyframes vinylFeetWiggle {
        0%, 100% { transform: rotate(-5deg); }
        50%      { transform: rotate(6deg); }
      }
      @keyframes vinylTail {
        0%, 100% { transform: rotate(-8deg); }
        50%      { transform: rotate(10deg); }
      }
      @keyframes vinylBlink {
        0%, 46%, 50%, 94%, 98%, 100% { transform: scaleY(1); }
        48%, 96%                     { transform: scaleY(0.08); }
      }

      .v-body  { transform-origin: 162px 330px; animation: vinylFloat 2.5s ease-in-out infinite; }
      .v-head  { transform-origin: 162px 216px; animation: vinylHead 2.5s ease-in-out infinite; }
      .v-tail  { transform-origin: 204px 310px; animation: vinylTail 1.8s ease-in-out infinite; }
      .v-footL { transform-origin: 112px 320px; animation: vinylFeetWiggle 1.6s ease-in-out infinite; }
      .v-footR { transform-origin: 212px 320px; animation: vinylFeetWiggle 1.6s ease-in-out -0.8s infinite; }
      .v-eyes  { transform-origin: 162px 158px; animation: vinylBlink 4.5s infinite; }
    </style>

    <!-- Chất liệu nhựa Vinyl / Gốm sứ bóng 3D cao cấp -->
    <radialGradient id="vinylOrange" cx="145" cy="110" r="135" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFA95C" />
      <stop offset="45%" stop-color="#FF6B1A" />
      <stop offset="85%" stop-color="#D94300" />
      <stop offset="100%" stop-color="#9E2A00" />
    </radialGradient>

    <radialGradient id="vinylCream" cx="162" cy="165" r="95" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F7E8D8" />
      <stop offset="100%" stop-color="#DEC3A8" />
    </radialGradient>

    <linearGradient id="vinylGold" x1="95" y1="205" x2="230" y2="285" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF085" />
      <stop offset="45%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
  </defs>

  <ellipse cx="166" cy="348" rx="98" ry="14" fill="#1F0E05" opacity="0.28" />

  <g class="v-body">
    <!-- Đuôi tròn bóng kiểu tượng Vinyl Pop-Mart -->
    <g class="v-tail">
      <path d="M 196 318 C 202 256, 244 218, 290 226 C 328 232, 336 276, 312 306 C 288 334, 240 338, 196 326 Z" fill="url(#vinylOrange)" />
      <path d="M 262 226 C 288 222, 314 234, 324 258 C 330 278, 322 296, 312 306 C 296 292, 276 286, 260 272 C 256 254, 256 238, 262 226 Z" fill="url(#vinylCream)" />
      <!-- Vệt bóng nhựa Vinyl trên đuôi -->
      <ellipse cx="294" cy="248" rx="12" ry="5" transform="rotate(28 294 248)" fill="#FFFFFF" opacity="0.55" />
    </g>

    <!-- Thân ngồi kiểu gấu bông Teddy / Pop-Mart -->
    <path d="M 112 222 C 98 264, 102 322, 126 338 L 198 338 C 222 322, 226 264, 212 222 Z" fill="url(#vinylOrange)" />
    <ellipse cx="162" cy="288" rx="34" ry="42" fill="url(#vinylCream)" />

    <!-- Hai tay buông tròn trịa 2 bên -->
    <ellipse cx="110" cy="272" rx="16" ry="30" transform="rotate(18 110 272)" fill="url(#vinylOrange)" />
    <ellipse cx="214" cy="272" rx="16" ry="30" transform="rotate(-18 214 272)" fill="url(#vinylOrange)" />
    <circle cx="104" cy="292" r="13" fill="#3B1709" />
    <circle cx="220" cy="292" r="13" fill="#3B1709" />

    <!-- Hai bàn chân giơ lòng bàn chân về phía trước lộ đệm thịt hình trái tim! -->
    <g class="v-footL">
      <ellipse cx="112" cy="322" rx="24" ry="20" transform="rotate(-10 112 322)" fill="#3B1709" />
      <ellipse cx="112" cy="325" rx="9" ry="7.5" fill="#FF8FA3" />
      <circle cx="101" cy="313" r="3.5" fill="#FF8FA3" />
      <circle cx="112" cy="310" r="3.8" fill="#FF8FA3" />
      <circle cx="123" cy="313" r="3.5" fill="#FF8FA3" />
    </g>
    <g class="v-footR">
      <ellipse cx="212" cy="322" rx="24" ry="20" transform="rotate(10 212 322)" fill="#3B1709" />
      <ellipse cx="212" cy="325" rx="9" ry="7.5" fill="#FF8FA3" />
      <circle cx="201" cy="313" r="3.5" fill="#FF8FA3" />
      <circle cx="212" cy="310" r="3.8" fill="#FF8FA3" />
      <circle cx="223" cy="313" r="3.5" fill="#FF8FA3" />
    </g>

    <!-- Khăn len đúc khối 3D bóng bẩy -->
    <rect x="98" y="206" width="128" height="32" rx="16" fill="url(#vinylGold)" />
    <path d="M 134 230 L 164 230 L 168 282 C 168 288, 130 288, 130 282 Z" fill="url(#vinylGold)" />
    <rect x="130" y="208" width="36" height="32" rx="11" fill="#FEF08A" />
    <ellipse cx="144" cy="215" rx="8" ry="2.5" fill="#FFFFFF" opacity="0.65" />

    <!-- ĐẦU TƯỢNG VINYL POP-MART TRÒN BÓNG -->
    <g class="v-head">
      <!-- Tai tròn dày kiểu tượng Art Toy -->
      <path d="M 66 130 C 48 82, 58 26, 84 20 C 108 18, 136 56, 146 98 Z" fill="url(#vinylOrange)" />
      <path d="M 56 56 C 60 32, 70 22, 84 20 C 98 19, 112 32, 120 50 C 98 56, 76 58, 56 56 Z" fill="#3B1709" />
      <ellipse cx="96" cy="80" rx="16" ry="32" transform="rotate(-14 96 80)" fill="#FFC4B8" />

      <path d="M 258 130 C 276 82, 266 26, 240 20 C 216 18, 188 56, 178 98 Z" fill="url(#vinylOrange)" />
      <path d="M 268 56 C 264 32, 254 22, 240 20 C 226 19, 212 32, 204 50 C 226 56, 248 58, 268 56 Z" fill="#3B1709" />
      <ellipse cx="228" cy="80" rx="16" ry="32" transform="rotate(14 228 80)" fill="#FFC4B8" />

      <!-- Khối đầu bầu dục ngang siêu mũm mĩm -->
      <rect x="52" y="68" width="220" height="154" rx="74" fill="url(#vinylOrange)" />

      <!-- Mặt nạ kem cắt khối mềm -->
      <path d="M 54 162 C 78 140, 124 142, 150 168 C 158 162, 166 162, 174 168 C 200 142, 246 140, 270 162 C 272 198, 232 222, 162 222 C 92 222, 52 198, 54 162 Z" fill="url(#vinylCream)" />

      <!-- Vệt sáng bóng chất liệu sứ / Vinyl trên trán -->
      <ellipse cx="122" cy="94" rx="26" ry="9" transform="rotate(-16 122 94)" fill="#FFFFFF" opacity="0.42" />
      <circle cx="156" cy="86" r="5" fill="#FFFFFF" opacity="0.42" />

      <!-- Má hồng ửng đỏ cả hai má & đầu mũi kiểu búp bê Pop-Mart -->
      <ellipse cx="86" cy="176" rx="22" ry="12" fill="#FF5C77" opacity="0.55" />
      <ellipse cx="238" cy="176" rx="22" ry="12" fill="#FF5C77" opacity="0.55" />
      <ellipse cx="162" cy="158" rx="14" ry="8" fill="#FF5C77" opacity="0.35" />

      <!-- Đôi mắt nút áo đen bóng đặt xa nhau đặc trưng của Art Toy -->
      <g class="v-eyes">
        <circle cx="108" cy="156" r="16.5" fill="#1F0A04" />
        <circle cx="108" cy="156" r="13" fill="#3B1508" />
        <circle cx="108" cy="156" r="8.5" fill="#140501" />
        <circle cx="102" cy="149" r="5" fill="#FFFFFF" />
        <circle cx="114" cy="161" r="2.2" fill="#FFFFFF" />

        <circle cx="216" cy="156" r="16.5" fill="#1F0A04" />
        <circle cx="216" cy="156" r="13" fill="#3B1508" />
        <circle cx="216" cy="156" r="8.5" fill="#140501" />
        <circle cx="210" cy="149" r="5" fill="#FFFFFF" />
        <circle cx="222" cy="161" r="2.2" fill="#FFFFFF" />
      </g>

      <!-- Lông mày hạt đậu nhỏ -->
      <ellipse cx="108" cy="126" rx="8" ry="4" transform="rotate(-8 108 126)" fill="#4A1A08" />
      <ellipse cx="216" cy="126" rx="8" ry="4" transform="rotate(8 216 126)" fill="#4A1A08" />

      <!-- Mũi nút áo bóng & miệng chúm chím -->
      <path d="M 148 182 Q 162 194, 176 182" stroke="#3B1508" stroke-width="3.6" stroke-linecap="round" fill="none" />
      <ellipse cx="162" cy="170" rx="8.5" ry="6" fill="#290D04" />
      <ellipse cx="159" cy="168" rx="3.2" ry="1.5" fill="#FFFFFF" opacity="0.85" />
    </g>
  </g>
</svg>