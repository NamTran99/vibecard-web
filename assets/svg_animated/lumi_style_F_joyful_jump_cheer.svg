<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="360" height="360" fill="none">
  <defs>
    <style>
      @keyframes sfJump {
        0%, 100% { transform: translateY(8px) scale(1.06, 0.94); }
        50%      { transform: translateY(-22px) scale(0.95, 1.05); }
      }
      @keyframes sfShadow {
        0%, 100% { transform: scale(1.05); opacity: 0.85; }
        50%      { transform: scale(0.68); opacity: 0.45; }
      }
      .sf-shadow { transform-origin: 180px 282px; animation: sfShadow 1.2s ease-in-out infinite; }
      .sf-body   { transform-origin: 180px 270px; animation: sfJump 1.2s ease-in-out infinite; }
    </style>
  </defs>

  <ellipse class="sf-shadow" cx="180" cy="276" rx="92" ry="52" fill="#EBEBEB" />

