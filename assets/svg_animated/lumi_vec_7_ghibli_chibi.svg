<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="100%" height="100%">
  <defs>
    <radialGradient id="bg7" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF3B0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFF3B0" stop-opacity="0"/>
    </radialGradient>
    <style>
      svg { overflow: visible; }
      .rig-bounce {
        transform-origin: 140px 235px;
        animation: bodyBounce 1.7s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
      }
      .rig-head {
        transform-origin: 140px 145px;
        animation: headTilt 2.2s ease-in-out infinite;
      }
      .rig-ear-l {
        transform-origin: 92px 82px;
        animation: earLeft 2.0s ease-in-out infinite;
      }
      .rig-ear-r {
        transform-origin: 188px 82px;
        animation: earRight 2.0s ease-in-out infinite;
      }
      .rig-tail {
        transform-origin: 175px 205px;
        animation: tailWag 0.95s ease-in-out infinite alternate;
      }
      .rig-arm-l {
        transform-origin: 90px 168px;
        animation: armWave 0.75s ease-in-out infinite alternate;
      }
      .rig-arm-r {
        transform-origin: 186px 168px;
        animation: armProp 1.1s ease-in-out infinite alternate;
      }
      .rig-eyes {
        transform-origin: 140px 124px;
        animation: eyeBlink 3.4s ease-in-out infinite;
      }
      .rig-cheeks {
        transform-origin: 140px 138px;
        animation: cheekPulse 1.5s ease-in-out infinite alternate;
      }
      .rig-shadow {
        transform-origin: 140px 248px;
        animation: shadowScale 1.7s ease-in-out infinite;
      }
      .sparkle-a {
        transform-origin: 42px 68px;
        animation: starTwinkle 1.5s ease-in-out infinite;
      }
      .sparkle-b {
        transform-origin: 238px 64px;
        animation: starTwinkle 1.9s ease-in-out infinite 0.5s;
      }
      .float-heart {
        transform-origin: 140px 36px;
        animation: heartFloat 1.8s ease-in-out infinite;
      }
      @keyframes bodyBounce {
        0%, 100% { transform: translateY(0px) scale(1.03, 0.97); }
        45% { transform: translateY(-13px) scale(0.97, 1.04); }
        75% { transform: translateY(-4px) scale(1.01, 0.99); }
      }
      @keyframes headTilt {
        0%, 100% { transform: rotate(-4deg) translateY(0px); }
        50% { transform: rotate(4deg) translateY(-3px); }
      }
      @keyframes earLeft {
        0%, 100% { transform: rotate(0deg); }
        30% { transform: rotate(-12deg); }
        60% { transform: rotate(5deg); }
      }
      @keyframes earRight {
        0%, 100% { transform: rotate(0deg); }
        40% { transform: rotate(12deg); }
        70% { transform: rotate(-4deg); }
      }
      @keyframes tailWag {
        0% { transform: rotate(-16deg) scale(1); }
        100% { transform: rotate(18deg) scale(1.05); }
      }
      @keyframes armWave {
        0% { transform: rotate(-22deg); }
        100% { transform: rotate(30deg); }
      }
      @keyframes armProp {
        0% { transform: rotate(12deg) translateY(0px); }
        100% { transform: rotate(-18deg) translateY(-4px); }
      }
      @keyframes eyeBlink {
        0%, 44%, 52%, 94%, 100% { transform: scaleY(1); }
        48%, 97% { transform: scaleY(0.08); }
      }
      @keyframes cheekPulse {
        0% { opacity: 0.65; transform: scale(0.95); }
        100% { opacity: 0.98; transform: scale(1.1); }
      }
      @keyframes shadowScale {
        0%, 100% { transform: scale(1, 1); opacity: 0.22; }
        45% { transform: scale(0.82, 0.85); opacity: 0.12; }
      }
      @keyframes starTwinkle {
        0%, 100% { transform: scale(0.65) rotate(0deg); opacity: 0.45; }
        50% { transform: scale(1.22) rotate(22deg); opacity: 1; }
      }
      @keyframes heartFloat {
        0%, 100% { transform: translateY(0px) scale(0.95); opacity: 0.85; }
        50% { transform: translateY(-9px) scale(1.15); opacity: 1; }
      }
</style>
  </defs>
  <circle cx="140" cy="145" r="118" fill="url(#bg7)"/>
  <ellipse class="rig-shadow" cx="140" cy="248" rx="66" ry="11" fill="#4A2C1D" opacity="0.2"/>

  <g class="rig-bounce">
    <g class="rig-tail" style="transform-origin: 105px 210px;">
      <path d="M 105 218 C 56 218, 38 176, 56 126 C 74 132, 88 152, 94 176 C 100 194, 102 206, 105 218 Z" fill="#F49756" stroke="#523220" stroke-width="5" stroke-linejoin="round"/>
      <path d="M 56 126 C 72 132, 84 146, 88 162 C 72 168, 56 156, 56 126 Z" fill="#FFFDF9" stroke="#523220" stroke-width="4.5" stroke-linejoin="round"/>
    </g>

    <path d="M 98 162 C 88 194, 92 232, 116 238 C 134 242, 152 242, 170 238 C 192 232, 194 194, 182 162 Z" fill="#F49756" stroke="#523220" stroke-width="5"/>
    <ellipse cx="140" cy="202" rx="30" ry="28" fill="#FFFDF9"/>

    <ellipse cx="118" cy="232" rx="12" ry="16" fill="#C4784A" stroke="#523220" stroke-width="5"/>
    <circle cx="118" cy="236" r="4" fill="#F4A298"/>
    <ellipse cx="176" cy="226" rx="12" ry="16" fill="#C4784A" stroke="#523220" stroke-width="5" transform="rotate(24 176 226)"/>
    <circle cx="175" cy="230" r="4" fill="#F4A298"/>

    <g class="rig-arm-r">
      <path d="M 176 172 C 194 156, 212 136, 204 124 C 196 114, 180 130, 168 156 Z" fill="#F49756" stroke="#523220" stroke-width="5"/>
      <circle cx="196" cy="131" r="4" fill="#F4A298"/>
    </g>

    <path d="M 96 146 C 116 158, 164 158, 184 142 C 188 154, 184 168, 172 172 C 146 178, 114 176, 94 166 C 90 158, 92 150, 96 146 Z" fill="#F5CA5C" stroke="#523220" stroke-width="5" stroke-linejoin="round"/>
    <path d="M 142 156 C 154 156, 164 154, 168 196 L 146 198 C 142 176, 140 164, 142 156 Z" fill="#F5CA5C" stroke="#523220" stroke-width="5" stroke-linejoin="round"/>

    <g class="rig-arm-l">
      <path d="M 134 196 C 146 196, 164 202, 168 210 C 156 218, 142 214, 134 196 Z" fill="#9BC16C" stroke="#523220" stroke-width="4.5"/>
      <path d="M 152 176 L 156 184 L 165 186 L 158 192 L 160 201 L 152 196 L 144 201 L 146 192 L 139 186 L 148 184 Z" fill="#FFF085" stroke="#D99B26" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M 102 176 C 114 184, 132 190, 138 198 C 134 206, 114 204, 98 192 Z" fill="#F49756" stroke="#523220" stroke-width="5"/>
    </g>

    <g class="rig-head">
      <g class="rig-ear-l">
        <path d="M 86 92 C 62 38, 84 26, 122 64 Z" fill="#F49756" stroke="#523220" stroke-width="5" stroke-linejoin="round"/>
        <path d="M 92 86 C 74 48, 88 40, 114 68 Z" fill="#FFFDF9"/>
      </g>
      <g class="rig-ear-r">
        <path d="M 194 92 C 218 38, 196 26, 158 64 Z" fill="#F49756" stroke="#523220" stroke-width="5" stroke-linejoin="round"/>
        <path d="M 188 86 C 206 48, 192 40, 166 68 Z" fill="#FFFDF9"/>
      </g>

      <path d="M 78 114 C 78 72, 106 60, 140 60 C 174 60, 202 72, 202 114 L 210 122 L 198 134 C 184 152, 162 158, 140 158 C 118 158, 96 152, 82 134 L 70 122 Z" fill="#F49756" stroke="#523220" stroke-width="5" stroke-linejoin="round"/>
      <path d="M 78 124 C 98 114, 122 118, 140 126 C 158 118, 182 114, 202 124 C 190 148, 166 156, 140 156 C 114 156, 90 148, 78 124 Z" fill="#FFFDF9"/>
      <path d="M 78 114 C 78 72, 106 60, 140 60 C 174 60, 202 72, 202 114 L 210 122 L 198 134 C 184 152, 162 158, 140 158 C 118 158, 96 152, 82 134 L 70 122 Z" fill="none" stroke="#523220" stroke-width="5" stroke-linejoin="round"/>

      <g class="rig-cheeks">
        <ellipse cx="92" cy="130" rx="13" ry="7.5" fill="#FF8FA3" opacity="0.7"/>
        <ellipse cx="188" cy="130" rx="13" ry="7.5" fill="#FF8FA3" opacity="0.7"/>
      </g>
      <g class="rig-eyes">
        <circle cx="114" cy="114" r="12" fill="#4A2518"/>
        <circle cx="114" cy="116" r="8" fill="#9E5218"/>
        <circle cx="114" cy="115" r="4.5" fill="#2E1505"/>
        <circle cx="111" cy="110" r="3.8" fill="#FFFFFF"/>
        <circle cx="166" cy="114" r="12" fill="#4A2518"/>
        <circle cx="166" cy="116" r="8" fill="#9E5218"/>
        <circle cx="166" cy="115" r="4.5" fill="#2E1505"/>
        <circle cx="163" cy="110" r="3.8" fill="#FFFFFF"/>
      </g>
      <ellipse cx="140" cy="123" rx="5.5" ry="3.8" fill="#3D2010"/>
      <path d="M 129 130 Q 134.5 135 140 130 Q 145.5 135 151 130" fill="none" stroke="#523220" stroke-width="3.8" stroke-linecap="round"/>
    </g>
  </g>
  <g class="sparkle-b"><path d="M 218 104 L 222 111 L 230 112 L 224 118 L 226 126 L 218 122 L 210 126 L 212 118 L 206 112 L 214 111 Z" fill="#FFF085" stroke="#D99B26" stroke-width="2.5"/></g>
</svg>