<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" fill="none">
  <defs>
    <style>
      /* 1. Hiệu ứng Pop-in nhảy ra chào đón khi vừa mở App + Nhịp thở thân thiện */
      @keyframes w1PopEntrance {
        0%   { transform: translateY(45px) scale(0.72, 1.22); opacity: 0; }
        45%  { transform: translateY(-14px) scale(1.05, 0.95); opacity: 1; }
        70%  { transform: translateY(4px) scale(0.98, 1.02); opacity: 1; }
        100% { transform: translateY(0px) scale(1, 1); opacity: 1; }
      }
      @keyframes w1WelcomeBounce {
        0%, 100% { transform: translateY(0px) scale(1, 1); }
        50%      { transform: translateY(-6px) scale(0.99, 1.015); }
      }
      /* 2. Tay phải vẫy chào liên tục thân thiện (Friendly Wave) */
      @keyframes w1WaveHand {
        0%, 100% { transform: rotate(-16deg); }
        25%      { transform: rotate(22deg); }
        50%      { transform: rotate(-14deg); }
        75%      { transform: rotate(20deg); }
      }
      /* 3. Tay trái nâng Thẻ Vàng Chào Mừng tỏa sáng */
      @keyframes w1CardPresent {
        0%, 100% { transform: translateY(0px) rotate(-4deg); }
        50%      { transform: translateY(-5px) rotate(4deg); }
      }
      /* 4. Đầu nghiêng nhẹ trìu mến đón người dùng */
      @keyframes w1HeadGreet {
        0%, 100% { transform: rotate(-3.5deg) translateY(0px); }
        50%      { transform: rotate(3.5deg) translateY(-3px); }
      }
      /* 5. Đôi tai vểnh lên vui mừng */
      @keyframes w1EarLeft {
        0%, 100% { transform: rotate(-4deg); }
        50%      { transform: rotate(5deg); }
      }
      @keyframes w1EarRight {
        0%, 100% { transform: rotate(4deg); }
        50%      { transform: rotate(-6deg); }
      }
      /* 6. Đuôi bông lớn vẫy mừng rỡ như cún/cáo cưng gặp chủ */
      @keyframes w1TailHappy {
        0%, 100% { transform: rotate(-12deg); }
        50%      { transform: rotate(16deg); }
      }
      /* 7. Chớp mắt tự nhiên */
      @keyframes w1Blink {
        0%, 44%, 48%, 94%, 98%, 100% { transform: scaleY(1); }
        46%, 96%                     { transform: scaleY(0.06); }
      }
      /* 8. Tia sóng vẫy tay & Trái tim / Ngôi sao chào mừng */
      @keyframes w1SparkleFloat {
        0%, 100% { transform: translateY(0px) scale(0.85); opacity: 0.55; }
        50%      { transform: translateY(-10px) scale(1.18); opacity: 1; }
      }
      @keyframes w1RingPulse {
        0%, 100% { transform: scale(0.96); opacity: 0.45; }
        50%      { transform: scale(1.05); opacity: 0.75; }
      }

      .w1-entrance { transform-origin: 190px 350px; animation: w1PopEntrance 0.75s cubic-bezier(0.22, 1.35, 0.5, 1) forwards; }
      .w1-body     { transform-origin: 190px 344px; animation: w1WelcomeBounce 2.2s ease-in-out infinite; }
      .w1-wave     { transform-origin: 232px 242px; animation: w1WaveHand 1.6s ease-in-out infinite; }
      .w1-cardArm  { transform-origin: 142px 248px; animation: w1CardPresent 2.2s ease-in-out infinite; }
      .w1-head     { transform-origin: 186px 218px; animation: w1HeadGreet 2.2s ease-in-out infinite; }
      .w1-earL     { transform-origin: 132px 98px; animation: w1EarLeft 2.2s ease-in-out infinite; }
      .w1-earR     { transform-origin: 240px 98px; animation: w1EarRight 2.2s ease-in-out infinite; }
      .w1-tail     { transform-origin: 224px 318px; animation: w1TailHappy 1.1s ease-in-out infinite; }
      .w1-eyes     { transform-origin: 186px 152px; animation: w1Blink 4.5s infinite; }
      .w1-sparkle  { transform-origin: 318px 136px; animation: w1SparkleFloat 2s ease-in-out infinite; }
      .w1-ring     { transform-origin: 190px 350px; animation: w1RingPulse 2.2s ease-in-out infinite; }
    </style>

    <radialGradient id="w1Fur" cx="186" cy="120" r="126" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFA94D" />
      <stop offset="55%" stop-color="#F76716" />
      <stop offset="100%" stop-color="#C23B00" />
    </radialGradient>

    <linearGradient id="w1Cream" x1="186" y1="150" x2="186" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#FFF9EE" />
      <stop offset="100%" stop-color="#FDE6C4" />
    </linearGradient>

    <linearGradient id="w1Scarf" x1="120" y1="208" x2="255" y2="265" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="45%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="w1Amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1F0B04" />
      <stop offset="48%" stop-color="#5C1F06" />
      <stop offset="85%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#FEF08A" />
    </linearGradient>

    <radialGradient id="w1BgHalo" cx="190" cy="200" r="165" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.22" />
      <stop offset="55%" stop-color="#FB923C" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FB923C" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Hào quang ấm áp chào đón khi mở App -->
  <circle cx="190" cy="200" r="160" fill="url(#w1BgHalo)" />

  <!-- Vòng cổng chào vàng kim dưới chân (Welcome Portal Ring) -->
  <g class="w1-ring">
    <ellipse cx="190" cy="354" rx="116" ry="20" fill="#FACC15" fill-opacity="0.16" stroke="#FDE047" stroke-width="2" stroke-dasharray="8 6" />
    <ellipse cx="190" cy="354" rx="92" ry="13" fill="#1F0E05" opacity="0.32" />
  </g>

  <g class="w1-entrance">
    <g class="w1-body">

      <!-- 1. ĐUÔI BÔNG LỚN VẪY MỪNG RỠ PHÍA SAU -->
      <g class="w1-tail">
        <path d="M 218 326 C 224 260, 266 214, 318 220 C 356 224, 370 266, 348 302 C 326 334, 274 344, 218 334 Z" fill="url(#w1Fur)" />
        <path d="M 280 222 C 308 214, 336 222, 350 244 C 362 262, 358 284, 348 302 C 338 284, 324 280, 312 292 C 312 276, 298 272, 286 280 C 290 262, 278 248, 280 222 Z" fill="url(#w1Cream)" />
      </g>

      <!-- 2. ĐÙI & HAI CHÂN SAU NGỒI VỮNG CHÃI -->
      <ellipse cx="132" cy="316" rx="25" ry="30" transform="rotate(-12 132 316)" fill="url(#w1Fur)" />
      <ellipse cx="240" cy="316" rx="25" ry="30" transform="rotate(12 240 316)" fill="url(#w1Fur)" />
      <ellipse cx="114" cy="342" rx="19" ry="13" fill="#361509" />
      <ellipse cx="258" cy="342" rx="19" ry="13" fill="#361509" />

      <!-- 3. THÂN & NGỰC LÔNG KEM MỀM MẠI -->
      <path d="M 136 224 C 126 266, 128 326, 148 344 L 224 344 C 244 326, 246 266, 236 224 Z" fill="url(#w1Fur)" />
      <path d="M 156 240 C 146 276, 150 330, 186 344 C 222 330, 226 276, 216 240 Z" fill="url(#w1Cream)" />

      <!-- 4. TAY TRÁI TRAO THẺ FLASHCARD VÀNG CHÀO MỪNG -->
      <g class="w1-cardArm">
        <path d="M 142 244 C 114 246, 94 264, 98 284 C 102 298, 124 296, 134 280 C 142 268, 146 256, 148 248 Z" fill="url(#w1Fur)" />
        <!-- Tấm thẻ Flashcard Vàng phát sáng có ngôi sao -->
        <g transform="translate(76, 266) rotate(-14)">
          <rect x="-28" y="-22" width="56" height="42" rx="10" fill="#FEF08A" stroke="#D97706" stroke-width="2.5" />
          <rect x="-22" y="-16" width="44" height="30" rx="6" fill="#FFFBEB" />
          <polygon points="0,-11 4,-3 12,-2 6,4 8,12 0,8 -8,12 -6,4 -12,-2 -4,-3" fill="#F59E0B" />
        </g>
        <circle cx="104" cy="278" r="13" fill="#361509" />
      </g>

      <!-- 5. TAY PHẢI GIƠ CAO VẪY CHÀO NHIỆT TÌNH (KÈM ĐỆM THỊT HỒNG & TIA VẪY) -->
      <g class="w1-wave">
        <path d="M 228 244 C 256 236, 286 206, 284 174 C 282 156, 258 160, 254 178 C 248 198, 236 216, 220 228 Z" fill="url(#w1Fur)" />
        <circle cx="270" cy="172" r="15.5" fill="#361509" />
        <!-- Đệm thịt hồng đáng yêu lòng bàn tay -->
        <ellipse cx="270" cy="175" rx="6.5" ry="5" fill="#FF8FA3" />
        <circle cx="261" cy="164" r="2.8" fill="#FF8FA3" />
        <circle cx="270" cy="161" r="2.8" fill="#FF8FA3" />
        <circle cx="279" cy="164" r="2.8" fill="#FF8FA3" />
        <!-- 2 vệt sóng chuyển động vẫy tay -->
        <path d="M 294 152 Q 308 166, 298 184" stroke="#FDE047" stroke-width="3.5" stroke-linecap="round" fill="none" />
        <path d="M 304 146 Q 322 166, 308 190" stroke="#FB923C" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.75" />
      </g>

      <!-- 6. CHIẾC KHĂN LEN VÀNG ẤM ÁP ĐẶC TRƯNG -->
      <path d="M 126 214 C 126 200, 246 202, 246 216 C 246 230, 126 228, 126 214 Z" fill="url(#w1Scarf)" stroke="#B45309" stroke-width="1.4" />
      <path d="M 122 228 C 122 214, 250 216, 250 232 C 250 248, 122 246, 122 228 Z" fill="url(#w1Scarf)" stroke="#B45309" stroke-width="1.4" />
      <path d="M 158 232 L 188 234 L 194 286 L 154 286 Z" fill="url(#w1Scarf)" stroke="#B45309" stroke-width="1.4" stroke-linejoin="round" />
      <rect x="155" y="212" width="34" height="30" rx="10" fill="#FEF08A" stroke="#B45309" stroke-width="1.4" />

      <!-- 7. ĐẦU CÁO LUMI TƯƠI CƯỜI RẠNG RỠ CHÀO ĐÓN -->
      <g class="w1-head">
        <!-- Tai Trái -->
        <g class="w1-earL">
          <path d="M 90 130 C 70 82, 78 26, 102 18 C 126 16, 158 54, 168 98 Z" fill="url(#w1Fur)" />
          <path d="M 79 54 C 84 30, 92 20, 102 18 C 114 17, 128 30, 138 50 C 118 56, 98 58, 79 54 Z" fill="#2E1207" />
          <path d="M 100 120 C 88 84, 94 44, 106 34 C 120 36, 140 66, 146 100 Z" fill="#F9BFA8" />
        </g>

        <!-- Tai Phải -->
        <g class="w1-earR">
          <path d="M 282 130 C 302 82, 294 26, 270 18 C 246 16, 214 54, 204 98 Z" fill="url(#w1Fur)" />
          <path d="M 293 54 C 288 30, 280 20, 270 18 C 258 17, 244 30, 234 50 C 254 56, 274 58, 293 54 Z" fill="#2E1207" />
          <path d="M 272 120 C 284 84, 278 44, 266 34 C 252 36, 232 66, 226 100 Z" fill="#F9BFA8" />
        </g>

        <!-- Chỏm lông đỉnh đầu & Khuôn mặt bầu bĩnh -->
        <path d="M 164 76 C 162 58, 176 54, 186 66 C 186 50, 202 50, 204 66 C 212 58, 222 64, 216 78 Z" fill="#FF8429" />
        <path d="M 186 68 C 246 68, 282 114, 288 164 C 296 169, 298 176, 290 182 C 296 188, 290 196, 280 200 C 258 216, 224 224, 186 224 C 148 224, 114 216, 92 200 C 82 196, 76 188, 82 182 C 74 176, 76 169, 84 164 C 90 114, 126 68, 186 68 Z" fill="url(#w1Fur)" />
        <path d="M 84 168 C 102 150, 142 148, 170 170 C 178 164, 194 164, 202 170 C 230 148, 270 150, 288 168 C 296 172, 296 178, 290 182 C 296 188, 290 196, 280 200 C 258 216, 224 224, 186 224 C 148 224, 114 216, 92 200 C 82 196, 76 188, 82 182 C 76 178, 76 172, 84 168 Z" fill="url(#w1Cream)" />

        <!-- Lông mày kem thân thiện & Má hồng ấm áp -->
        <ellipse cx="146" cy="112" rx="10.5" ry="5.5" transform="rotate(-12 146 112)" fill="#FFF8EE" />
        <ellipse cx="226" cy="112" rx="10.5" ry="5.5" transform="rotate(12 226 112)" fill="#FFF8EE" />
        <ellipse cx="112" cy="182" rx="17" ry="9.5" fill="#FF758F" opacity="0.52" />
        <ellipse cx="260" cy="182" rx="17" ry="9.5" fill="#FF758F" opacity="0.52" />

        <!-- Đôi mắt Hổ Phách to tròn long lanh chào đón -->
        <g class="w1-eyes">
          <ellipse cx="138" cy="150" rx="19.5" ry="21.5" fill="#FFFDF9" />
          <ellipse cx="140" cy="150" rx="16.5" ry="19" fill="url(#w1Amber)" />
          <ellipse cx="140" cy="149" rx="10" ry="12" fill="#170702" />
          <circle cx="133" cy="141" r="6" fill="#FFFFFF" />
          <circle cx="146" cy="156" r="3" fill="#FEF08A" />
          <path d="M 118 146 C 120 124, 152 122, 160 142" stroke="#260D04" stroke-width="5" stroke-linecap="round" fill="none" />

          <ellipse cx="234" cy="150" rx="19.5" ry="21.5" fill="#FFFDF9" />
          <ellipse cx="232" cy="150" rx="16.5" ry="19" fill="url(#w1Amber)" />
          <ellipse cx="232" cy="149" rx="10" ry="12" fill="#170702" />
          <circle cx="225" cy="141" r="6" fill="#FFFFFF" />
          <circle cx="238" cy="156" r="3" fill="#FEF08A" />
          <path d="M 254 146 C 252 124, 220 122, 212 142" stroke="#260D04" stroke-width="5" stroke-linecap="round" fill="none" />
        </g>

        <!-- Miệng cười mở rạng rỡ chào mừng (:D) & Mũi đen bóng -->
        <path d="M 166 180 Q 186 188, 206 180 C 202 206, 170 206, 166 180 Z" fill="#3B1207" />
        <ellipse cx="186" cy="194" rx="12" ry="6.8" fill="#FF758F" />
        <path d="M 174 166 C 174 160, 198 160, 198 166 C 198 173, 189 179, 186 179 C 183 179, 174 173, 174 166 Z" fill="#240D04" />
        <ellipse cx="183" cy="164.5" rx="4.5" ry="2" fill="#8C5843" />
      </g>

      <!-- Trái tim & Ngôi sao Chào Mừng bay lên cạnh bàn tay vẫy -->
      <g class="w1-sparkle">
        <path d="M 318 132 C 312 122, 298 126, 302 138 C 305 147, 318 154, 318 154 C 318 154, 331 147, 334 138 C 338 126, 324 122, 318 132 Z" fill="#FB7185" />
        <polygon points="344,104 347,112 355,115 347,118 344,126 341,118 333,115 341,112" fill="#FEF08A" />
        <polygon points="82,118 85,125 92,128 85,131 82,138 79,131 72,128 79,125" fill="#FEF08A" />
      </g>
    </g>
  </g>
</svg>