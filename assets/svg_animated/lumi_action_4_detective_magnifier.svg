<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 380" width="360" height="380" fill="none">
  <defs>
    <style>
      @keyframes a4Inspect {
        0%, 100% { transform: rotate(-6deg) translate(0px, 0px); }
        50%      { transform: rotate(8deg) translate(4px, -5px); }
      }
      @keyframes a4HeadTilt {
        0%, 100% { transform: rotate(-3deg); }
        50%      { transform: rotate(4deg); }
      }
      @keyframes a4ZoomEye {
        0%, 100% { transform: scale(1.05); }
        50%      { transform: scale(1.22); }
      }
      @keyframes a4Bulb {
        0%, 100% { transform: scale(0.85) translateY(0px); opacity: 0.6; }
        50%      { transform: scale(1.12) translateY(-5px); opacity: 1; }
      }
      @keyframes a4Tail {
        0%, 100% { transform: rotate(-8deg); }
        50%      { transform: rotate(12deg); }
      }

      .a4-head { transform-origin: 162px 218px; animation: a4HeadTilt 2.4s ease-in-out infinite; }
      .a4-lens { transform-origin: 218px 238px; animation: a4Inspect 2.4s ease-in-out infinite; }
      .a4-eyeR { transform-origin: 208px 150px; animation: a4ZoomEye 2.4s ease-in-out infinite; }
      .a4-bulb { transform-origin: 278px 68px; animation: a4Bulb 1.8s ease-in-out infinite; }
      .a4-tail { transform-origin: 202px 312px; animation: a4Tail 1.6s ease-in-out infinite; }
    </style>
  </defs>

  <ellipse cx="168" cy="348" rx="94" ry="13" fill="#2A1205" opacity="0.22" />

  <!-- Bóng đèn Ý Tưởng / Khám Phá Từ Mới bật sáng trên đầu -->
  <g class="a4-bulb">
    <circle cx="278" cy="64" r="16" fill="#FDE047" stroke="#3B1D0E" stroke-width="3.5" />
    <rect x="272" y="78" width="12" height="7" rx="3" fill="#9CA3AF" stroke="#3B1D0E" stroke-width="3" />
    <line x1="278" y1="36" x2="278" y2="26" stroke="#F59E0B" stroke-width="3.5" stroke-linecap="round" />
    <line x1="298" y1="46" x2="306" y2="38" stroke="#F59E0B" stroke-width="3.5" stroke-linecap="round" />
    <line x1="258" y1="46" x2="250" y2="38" stroke="#F59E0B" stroke-width="3.5" stroke-linecap="round" />
  </g>

  <g>
    <g class="a4-tail">
      <path d="M 196 320 C 198 258, 236 218, 282 222 C 320 226, 336 264, 318 298 C 300 328, 250 338, 196 328 Z" fill="#F97316" stroke="#3B1D0E" stroke-width="4.2" stroke-linejoin="round" />
      <path d="M 254 225 C 278 218, 304 226, 318 246 C 328 264, 326 282, 318 298 C 306 284, 292 286, 284 294 C 282 278, 268 274, 256 280 C 260 264, 248 252, 254 225 Z" fill="#FFFDF9" stroke="#3B1D0E" stroke-width="4.2" stroke-linejoin="round" />
    </g>

    <ellipse cx="104" cy="324" rx="22" ry="17" transform="rotate(-12 104 324)" fill="#431E0D" stroke="#3B1D0E" stroke-width="4.2" />
    <ellipse cx="220" cy="324" rx="22" ry="17" transform="rotate(12 220 324)" fill="#431E0D" stroke="#3B1D0E" stroke-width="4.2" />

    <path d="M 112 224 C 100 266, 102 322, 124 338 L 200 338 C 222 322, 224 266, 212 224 Z" fill="#F97316" stroke="#3B1D0E" stroke-width="4.2" stroke-linejoin="round" />
    <path d="M 134 240 C 124 274, 128 324, 162 336 C 196 324, 200 274, 190 240 Z" fill="#FFFDF9" />

    <!-- Chân trái chống hông -->
    <path d="M 116 242 C 96 256, 94 282, 114 292" stroke="#3B1D0E" stroke-width="18" stroke-linecap="round" />
    <path d="M 116 242 C 96 256, 94 282, 114 292" stroke="#F97316" stroke-width="10" stroke-linecap="round" />
    <circle cx="116" cy="292" r="11" fill="#431E0D" stroke="#3B1D0E" stroke-width="3.5" />

    <!-- Khăn quàng cổ vàng -->
    <rect x="100" y="206" width="124" height="30" rx="15" fill="#FBBF24" stroke="#3B1D0E" stroke-width="4.2" />
    <path d="M 134 232 L 164 232 L 168 282 L 130 282 Z" fill="#FBBF24" stroke="#3B1D0E" stroke-width="4.2" stroke-linejoin="round" />
    <rect x="131" y="210" width="34" height="28" rx="9" fill="#FDE047" stroke="#3B1D0E" stroke-width="4.2" />

    <!-- Đầu Kawaii Mochi + Mũ Thám Tử Nhỏ Trên Đỉnh Đầu -->
    <g class="a4-head">
      <path d="M 70 124 C 52 78, 60 26, 82 20 C 106 18, 134 54, 144 96 Z" fill="#F97316" stroke="#3B1D0E" stroke-width="4.2" stroke-linejoin="round" />
      <path d="M 59 54 C 64 32, 72 22, 82 20 C 94 19, 108 30, 118 48 C 98 54, 78 56, 59 54 Z" fill="#431E0D" />
      <path d="M 80 114 C 70 82, 74 46, 86 38 C 98 40, 114 68, 120 98 Z" fill="#FFD6CC" />

      <path d="M 254 124 C 272 78, 264 26, 242 20 C 218 18, 190 54, 180 96 Z" fill="#F97316" stroke="#3B1D0E" stroke-width="4.2" stroke-linejoin="round" />
      <path d="M 265 54 C 260 32, 252 22, 242 20 C 230 19, 216 30, 206 48 C 226 54, 246 56, 265 54 Z" fill="#431E0D" />
      <path d="M 244 114 C 254 82, 250 46, 238 38 C 226 40, 210 68, 204 98 Z" fill="#FFD6CC" />

      <!-- Mũ thám tử Sherlock nhỏ xinh trên đỉnh đầu -->
      <path d="M 126 72 C 126 44, 198 44, 198 72 Z" fill="#B45309" stroke="#3B1D0E" stroke-width="4" />
      <path d="M 114 72 Q 162 64, 210 72" stroke="#3B1D0E" stroke-width="5" stroke-linecap="round" />
      <rect x="156" y="42" width="12" height="8" rx="4" fill="#78350F" stroke="#3B1D0E" stroke-width="3" />

      <path d="M 162 68 C 220 68, 256 110, 262 162 C 270 176, 262 198, 244 206 C 222 218, 194 222, 162 222 C 130 222, 102 218, 80 206 C 62 198, 54 176, 62 162 C 68 110, 104 68, 162 68 Z" fill="#F97316" stroke="#3B1D0E" stroke-width="4.2" stroke-linejoin="round" />
      <path d="M 63 166 C 84 146, 124 148, 148 170 C 156 164, 168 164, 176 170 C 200 148, 240 146, 261 166 C 266 180, 258 198, 242 205 C 220 216, 194 220, 162 220 C 130 220, 104 216, 82 205 C 66 198, 58 180, 63 166 Z" fill="#FFFDF9" />
      <path d="M 162 68 C 220 68, 256 110, 262 162 C 270 176, 262 198, 244 206 C 222 218, 194 222, 162 222 C 130 222, 102 218, 80 206 C 62 198, 54 176, 62 162 C 68 110, 104 68, 162 68 Z" fill="none" stroke="#3B1D0E" stroke-width="4.2" stroke-linejoin="round" />

      <ellipse cx="90" cy="178" rx="15" ry="9" fill="#FF8FA3" opacity="0.65" />
      <ellipse cx="234" cy="178" rx="15" ry="9" fill="#FF8FA3" opacity="0.65" />

      <!-- Mắt trái bình thường, Mắt phải phóng to qua kính lúp! -->
      <ellipse cx="116" cy="150" rx="13" ry="15" fill="#2B1206" />
      <circle cx="111" cy="143" r="4.5" fill="#FFFFFF" />

      <g class="a4-eyeR">
        <ellipse cx="208" cy="150" rx="16.5" ry="18.5" fill="#2B1206" />
        <circle cx="202" cy="142" r="6" fill="#FFFFFF" />
        <circle cx="215" cy="156" r="3" fill="#FDE047" />
      </g>

      <!-- Miệng tròn chữ 'o' ngạc nhiên thích thú -->
      <ellipse cx="162" cy="188" rx="7" ry="8.5" fill="#D94E34" stroke="#3B1D0E" stroke-width="3.5" />
      <ellipse cx="162" cy="171" rx="9" ry="6" fill="#2B1206" />
    </g>

    <!-- TAY PHẢI CẦM KÍNH LÚP SOI TỪ VỰNG -->
    <g class="a4-lens">
      <line x1="210" y1="184" x2="232" y2="238" stroke="#78350F" stroke-width="11" stroke-linecap="round" />
      <line x1="210" y1="184" x2="232" y2="238" stroke="#3B1D0E" stroke-width="14" stroke-linecap="round" opacity="0.25" />
      <!-- Mặt kính lúp trong suốt ánh xanh -->
      <circle cx="206" cy="150" r="34" fill="#E0F2FE" fill-opacity="0.32" stroke="#F59E0B" stroke-width="7" />
      <circle cx="206" cy="150" r="37.5" fill="none" stroke="#3B1D0E" stroke-width="3.5" />
      <path d="M 184 134 Q 194 122, 212 126" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.85" />
      <!-- Bàn tay cầm cán kính lúp -->
      <circle cx="226" cy="222" r="14" fill="#431E0D" stroke="#3B1D0E" stroke-width="4" />
    </g>
  </g>
</svg>