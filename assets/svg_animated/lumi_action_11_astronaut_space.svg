<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 380" width="360" height="380" fill="none">
  <defs>
    <style>
      @keyframes a11ZeroG {
        0%, 100% { transform: translateY(0px) rotate(-4deg); }
        50%      { transform: translateY(-16px) rotate(5deg); }
      }
      @keyframes a11Orbit {
        0%, 100% { transform: translate(0px, 0px) rotate(-8deg); }
        50%      { transform: translate(-8px, -10px) rotate(8deg); }
      }
      @keyframes a11ArmReach {
        0%, 100% { transform: rotate(-10deg); }
        50%      { transform: rotate(16deg); }
      }
      @keyframes a11TailFloat {
        0%, 100% { transform: rotate(-12deg); }
        50%      { transform: rotate(10deg); }
      }
      @keyframes a11Blink {
        0%, 46%, 50%, 96%, 100% { transform: scaleY(1); }
        48%                     { transform: scaleY(0.06); }
      }

      .a11-suit   { transform-origin: 168px 210px; animation: a11ZeroG 3.6s ease-in-out infinite; }
      .a11-planet { transform-origin: 288px 86px; animation: a11Orbit 3.2s ease-in-out infinite; }
      .a11-armR   { transform-origin: 212px 238px; animation: a11ArmReach 2.4s ease-in-out infinite; }
      .a11-tail   { transform-origin: 204px 302px; animation: a11TailFloat 2.8s ease-in-out infinite; }
      .a11-eyes   { transform-origin: 162px 150px; animation: a11Blink 4.8s infinite; }
    </style>

    <radialGradient id="a11Fur" cx="162" cy="128" r="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF9A47" />
      <stop offset="60%" stop-color="#F76414" />
      <stop offset="100%" stop-color="#C43E00" />
    </radialGradient>
    <linearGradient id="a11SuitG" x1="100" y1="210" x2="230" y2="335" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <linearGradient id="a11Glass" x1="70" y1="40" x2="250" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E0F2FE" stop-opacity="0.38" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.32" />
    </linearGradient>
  </defs>

  <!-- Các vì sao vũ trụ xung quanh -->
  <circle cx="52" cy="88" r="3" fill="#FEF08A" />
  <circle cx="44" cy="240" r="2.5" fill="#38BDF8" />
  <circle cx="312" cy="260" r="3" fill="#F472B6" />
  <polygon points="68,42 71,49 78,52 71,55 68,62 65,55 58,52 65,49" fill="#FEF08A" />

  <!-- Hành tinh có vành đai lơ lửng góc phải trên -->
  <g class="a11-planet">
    <circle cx="288" cy="86" r="24" fill="#A855F7" />
    <ellipse cx="288" cy="86" rx="42" ry="10" transform="rotate(-22 288 86)" stroke="#FDE047" stroke-width="5" fill="none" />
    <circle cx="280" cy="78" r="5" fill="#E9D5FF" opacity="0.6" />
  </g>

  <ellipse cx="168" cy="356" rx="74" ry="10" fill="#0F172A" opacity="0.3" />

  <!-- PHI HÀNH GIA CÁO LUMI LƠ LỬNG KHÔNG TRỌNG LỰC -->
  <g class="a11-suit">
    <!-- Đuôi lơ lửng -->
    <g class="a11-tail">
      <path d="M 198 308 C 208 252, 248 214, 294 220 C 330 226, 342 264, 320 296 C 300 324, 250 332, 198 318 Z" fill="url(#a11Fur)" />
      <path d="M 258 222 C 284 216, 310 222, 324 242 C 334 258, 330 278, 320 296 C 312 280, 298 278, 288 288 C 288 272, 276 268, 264 276 C 268 258, 256 246, 258 222 Z" fill="#FFFDF9" />
    </g>

    <!-- Balo phản lực Jetpack phía sau -->
    <rect x="104" y="218" width="116" height="86" rx="18" fill="#64748B" stroke="#334155" stroke-width="3" />

    <!-- Hai chân mặc giày phi hành gia lơ lửng lệch nhau -->
    <g transform="rotate(16 122 318)">
      <rect x="106" y="298" width="32" height="36" rx="14" fill="url(#a11SuitG)" stroke="#475569" stroke-width="2.5" />
      <ellipse cx="122" cy="332" rx="18" ry="11" fill="#F97316" stroke="#9A3412" stroke-width="2" />
    </g>
    <g transform="rotate(-22 204 312)">
      <rect x="188" y="292" width="32" height="36" rx="14" fill="url(#a11SuitG)" stroke="#475569" stroke-width="2.5" />
      <ellipse cx="204" cy="326" rx="18" ry="11" fill="#F97316" stroke="#9A3412" stroke-width="2" />
    </g>

    <!-- Bộ đồ phi hành gia trắng-cam Space-Fox -->
    <path d="M 112 216 C 102 256, 104 304, 122 318 L 202 318 C 220 304, 222 256, 212 216 Z" fill="url(#a11SuitG)" stroke="#64748B" stroke-width="2.5" />
    <!-- Bảng điều khiển trước ngực -->
    <rect x="134" y="244" width="56" height="38" rx="10" fill="#1E293B" stroke="#94A3B8" stroke-width="2" />
    <circle cx="148" cy="263" r="6" fill="#38BDF8" />
    <circle cx="164" cy="263" r="6" fill="#4ADE80" />
    <rect x="176" y="256" width="8" height="14" rx="3" fill="#F97316" />

    <!-- Tay trái lơ lửng -->
    <path d="M 114 234 C 86 238, 72 258, 80 276 C 88 290, 108 282, 114 262 Z" fill="url(#a11SuitG)" stroke="#64748B" stroke-width="2.5" />
    <circle cx="84" cy="272" r="13" fill="#F97316" stroke="#9A3412" stroke-width="2" />

    <!-- Tay phải vươn lên chạm vào ngôi sao vũ trụ -->
    <g class="a11-armR">
      <path d="M 208 234 C 236 226, 258 198, 254 176 C 250 162, 230 168, 224 186 C 218 202, 212 216, 200 226 Z" fill="url(#a11SuitG)" stroke="#64748B" stroke-width="2.5" />
      <circle cx="246" cy="176" r="13" fill="#F97316" stroke="#9A3412" stroke-width="2" />
    </g>

    <!-- Đầu Cáo bên trong Mũ Bảo Hiểm Kính Cầu Trong Suốt -->
    <g>
      <path d="M 74 132 C 56 88, 64 40, 86 32 C 108 30, 134 62, 144 102 Z" fill="url(#a11Fur)" />
      <path d="M 64 64 C 68 44, 76 34, 86 32 C 98 31, 110 42, 118 60 C 100 66, 82 68, 64 64 Z" fill="#2E1207" />
      <path d="M 84 122 C 72 90, 78 54, 88 46 C 102 48, 116 76, 122 104 Z" fill="#F9BFA8" />

      <path d="M 250 132 C 268 88, 260 40, 238 32 C 216 30, 190 62, 180 102 Z" fill="url(#a11Fur)" />
      <path d="M 260 64 C 256 44, 248 34, 238 32 C 226 31, 214 42, 206 60 C 224 66, 242 68, 260 64 Z" fill="#2E1207" />
      <path d="M 240 122 C 252 90, 246 54, 236 46 C 222 48, 208 76, 202 104 Z" fill="#F9BFA8" />

      <path d="M 162 74 C 218 74, 250 116, 256 164 C 262 178, 254 198, 236 206 C 216 216, 190 220, 162 220 C 134 220, 108 216, 88 206 C 70 198, 62 178, 68 164 C 74 116, 106 74, 162 74 Z" fill="url(#a11Fur)" />
      <path d="M 68 168 C 88 150, 122 150, 146 168 C 154 162, 170 162, 178 168 C 202 150, 236 150, 256 168 C 260 180, 252 198, 236 206 C 216 216, 190 220, 162 220 C 134 220, 108 216, 88 206 C 72 198, 64 180, 68 168 Z" fill="#FFFDF9" />

      <!-- Đôi mắt tròn xoe háo hức khám phá vũ trụ -->
      <g class="a11-eyes">
        <ellipse cx="116" cy="150" rx="18" ry="20" fill="#1E1B4B" />
        <ellipse cx="116" cy="152" rx="14" ry="15" fill="#0284C7" />
        <ellipse cx="116" cy="150" rx="9" ry="11" fill="#0F172A" />
        <circle cx="110" cy="142" r="5.5" fill="#FFFFFF" />
        <circle cx="122" cy="157" r="2.8" fill="#38BDF8" />

        <ellipse cx="208" cy="150" rx="18" ry="20" fill="#1E1B4B" />
        <ellipse cx="208" cy="152" rx="14" ry="15" fill="#0284C7" />
        <ellipse cx="208" cy="150" rx="9" ry="11" fill="#0F172A" />
        <circle cx="202" cy="142" r="5.5" fill="#FFFFFF" />
        <circle cx="214" cy="157" r="2.8" fill="#38BDF8" />
      </g>

      <path d="M 146 182 Q 162 196, 178 182" stroke="#361207" stroke-width="3.5" stroke-linecap="round" fill="none" />
      <ellipse cx="162" cy="168" rx="9.5" ry="6" fill="#240D04" />

      <!-- Vòng cổ mũ phi hành gia & Vòm kính cầu vũ trụ trong suốt -->
      <ellipse cx="162" cy="218" rx="74" ry="14" fill="#CBD5E1" stroke="#475569" stroke-width="3" />
      <circle cx="162" cy="128" r="108" fill="url(#a11Glass)" stroke="#E2E8F0" stroke-width="3.5" />
      <!-- Vệt phản quang cong trên mũ kính phi hành gia -->
      <path d="M 84 82 C 104 48, 146 34, 186 40" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.75" />
      <circle cx="76" cy="100" r="4" fill="#FFFFFF" opacity="0.75" />
    </g>
  </g>
</svg>