<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 380" width="360" height="380" fill="none">
  <defs>
    <style>
      @keyframes wcCheerJump {
        0%, 100% { transform: translateY(4px) scale(1.03, 0.97); }
        50%      { transform: translateY(-16px) scale(0.97, 1.04); }
      }
      @keyframes wcArmsOpen {
        0%, 100% { transform: rotate(8deg); }
        50%      { transform: rotate(-18deg); }
      }
      @keyframes wcArmsOpenL {
        0%, 100% { transform: rotate(-8deg); }
        50%      { transform: rotate(18deg); }
      }
      @keyframes wcConfettiFall {
        0%   { transform: translateY(-15px) rotate(0deg); opacity: 0; }
        30%  { opacity: 1; }
        100% { transform: translateY(45px) rotate(180deg); opacity: 0; }
      }
      @keyframes wcTail {
        0%, 100% { transform: rotate(-14deg); }
        50%      { transform: rotate(18deg); }
      }

      .wc-fox  { transform-origin: 180px 330px; animation: wcCheerJump 1.5s ease-in-out infinite; }
      .wc-armL { transform-origin: 132px 238px; animation: wcArmsOpenL 1.5s ease-in-out infinite; }
      .wc-armR { transform-origin: 228px 238px; animation: wcArmsOpen 1.5s ease-in-out infinite; }
      .wc-tail { transform-origin: 214px 312px; animation: wcTail 0.75s ease-in-out infinite; }
      .wc-c1   { animation: wcConfettiFall 2.2s linear infinite; }
      .wc-c2   { animation: wcConfettiFall 2.2s linear 1.1s infinite; }
    </style>

    <radialGradient id="wcFur" cx="180" cy="124" r="118" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFA94D" />
      <stop offset="55%" stop-color="#F76716" />
      <stop offset="100%" stop-color="#C23B00" />
    </radialGradient>
  </defs>

  <!-- Pháo giấy Confetti rực rỡ chào mừng mỗi ngày vào App -->
  <g class="wc-c1">
    <rect x="64" y="68" width="12" height="6" rx="3" transform="rotate(25 64 68)" fill="#F43F5E" />
    <rect x="284" y="58" width="12" height="6" rx="3" transform="rotate(-35 284 58)" fill="#38BDF8" />
    <circle cx="96" cy="112" r="5" fill="#FDE047" />
    <circle cx="268" cy="108" r="5" fill="#4ADE80" />
  </g>
  <g class="wc-c2">
    <rect x="112" y="42" width="12" height="6" rx="3" transform="rotate(-18 112 42)" fill="#A855F7" />
    <rect x="242" y="46" width="12" height="6" rx="3" transform="rotate(40 242 46)" fill="#FDE047" />
    <polygon points="54,142 58,150 66,152 60,158 62,166 54,162 46,166 48,158 42,152 50,150" fill="#FDE047" />
    <polygon points="306,138 310,146 318,148 312,154 314,162 306,158 298,162 300,154 294,148 302,146" fill="#FB7185" />
  </g>

  <ellipse cx="180" cy="352" rx="92" ry="13" fill="#1F0E05" opacity="0.28" />

  <g class="wc-fox">
    <g class="wc-tail">
      <path d="M 210 318 C 216 254, 258 212, 308 218 C 344 222, 358 262, 336 296 C 314 328, 264 336, 210 326 Z" fill="url(#wcFur)" />
      <path d="M 270 220 C 296 212, 324 220, 338 242 C 348 258, 344 280, 336 296 C 326 280, 312 276, 300 288 C 300 272, 288 268, 276 276 C 280 258, 268 246, 270 220 Z" fill="#FFFDF9" />
    </g>

    <ellipse cx="138" cy="326" rx="18" ry="25" transform="rotate(14 138 326)" fill="url(#wcFur)" />
    <ellipse cx="222" cy="326" rx="18" ry="25" transform="rotate(-14 222 326)" fill="url(#wcFur)" />
    <ellipse cx="130" cy="342" rx="16" ry="11" fill="#361509" />
    <ellipse cx="230" cy="342" rx="16" ry="11" fill="#361509" />

    <path d="M 132 222 C 122 262, 126 316, 144 332 L 216 332 C 234 316, 238 262, 228 222 Z" fill="url(#wcFur)" />
    <path d="M 150 236 C 142 270, 146 318, 180 332 C 214 318, 218 270, 210 236 Z" fill="#FFFDF9" />

    <!-- Hai tay dang rộng nồng nhiệt chào đón -->
    <g class="wc-armL">
      <path d="M 136 240 C 108 232, 82 204, 88 178 C 92 162, 114 166, 118 184 C 122 202, 130 218, 142 228 Z" fill="url(#wcFur)" />
      <circle cx="102" cy="176" r="14" fill="#361509" />
      <ellipse cx="102" cy="178" rx="6" ry="4.5" fill="#FF8FA3" />
    </g>
    <g class="wc-armR">
      <path d="M 224 240 C 252 232, 278 204, 272 178 C 268 162, 246 166, 242 184 C 238 202, 230 218, 218 228 Z" fill="url(#wcFur)" />
      <circle cx="258" cy="176" r="14" fill="#361509" />
      <ellipse cx="258" cy="178" rx="6" ry="4.5" fill="#FF8FA3" />
    </g>

    <!-- Nơ Đỏ Lớn Chào Mừng Trước Ngực -->
    <polygon points="180,224 144,208 148,242" fill="#EF4444" stroke="#991B1B" stroke-width="2" stroke-linejoin="round" />
    <polygon points="180,224 216,208 212,242" fill="#EF4444" stroke="#991B1B" stroke-width="2" stroke-linejoin="round" />
    <circle cx="180" cy="224" r="10" fill="#FDE047" stroke="#B45309" stroke-width="2" />

    <!-- Đầu Cáo cười tít mắt hạnh phúc chào đón -->
    <g>
      <path d="M 84 128 C 64 80, 72 24, 96 16 C 120 14, 152 52, 162 96 Z" fill="url(#wcFur)" />
      <path d="M 73 52 C 78 28, 86 18, 96 16 C 108 15, 122 28, 132 48 C 112 54, 92 56, 73 52 Z" fill="#2E1207" />
      <path d="M 94 118 C 82 82, 88 42, 100 32 C 114 34, 134 64, 140 98 Z" fill="#F9BFA8" />

      <path d="M 276 128 C 296 80, 288 24, 264 16 C 240 14, 208 52, 198 96 Z" fill="url(#wcFur)" />
      <path d="M 287 52 C 282 28, 274 18, 264 16 C 252 15, 238 28, 228 48 C 248 54, 268 56, 287 52 Z" fill="#2E1207" />
      <path d="M 266 118 C 278 82, 272 42, 260 32 C 246 34, 226 64, 220 98 Z" fill="#F9BFA8" />

      <path d="M 180 66 C 240 66, 276 112, 282 162 C 290 174, 284 196, 266 204 C 244 218, 214 222, 180 222 C 146 222, 116 218, 94 204 C 76 196, 70 174, 78 162 C 84 112, 120 66, 180 66 Z" fill="url(#wcFur)" />
      <path d="M 78 166 C 96 148, 136 146, 164 168 C 172 162, 188 162, 196 168 C 224 146, 264 148, 282 166 C 288 178, 282 196, 266 204 C 244 218, 214 222, 180 222 C 146 222, 116 218, 94 204 C 78 196, 72 178, 78 166 Z" fill="#FFFDF9" />

      <!-- Mắt cười vòng cung rạng rỡ & Má hồng -->
      <path d="M 114 150 C 122 132, 146 132, 154 150" stroke="#2E1207" stroke-width="5.2" stroke-linecap="round" fill="none" />
      <path d="M 206 150 C 214 132, 238 132, 246 150" stroke="#2E1207" stroke-width="5.2" stroke-linecap="round" fill="none" />
      <ellipse cx="104" cy="176" rx="17" ry="10" fill="#FB7185" opacity="0.55" />
      <ellipse cx="256" cy="176" rx="17" ry="10" fill="#FB7185" opacity="0.55" />

      <!-- Miệng cười lớn chào mừng -->
      <path d="M 158 178 Q 180 186, 202 178 C 198 206, 162 206, 158 178 Z" fill="#3B1207" />
      <ellipse cx="180" cy="193" rx="12" ry="7" fill="#FF758F" />
      <ellipse cx="180" cy="166" rx="9.5" ry="6" fill="#240D04" />
    </g>
  </g>
</svg>