<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <style>
      /* 1. Mặt khối trên nhấp nhô thở nhẹ (0 <-> -2.5px) */
      @keyframes tileFloat {
        0%, 100% { transform: translateY(0px); }
        50%      { transform: translateY(-2.5px); }
      }

      /* 2. Bóng đổ dưới sàn co giãn theo nhịp thở của khối */
      @keyframes floorShadowPulse {
        0%, 100% { transform: scale(1); opacity: 0.45; }
        50%      { transform: scale(0.95); opacity: 0.32; }
      }

      /* 3. Phần móc câu dấu ? lắc lư tò mò (-6deg <-> +6deg, scale 1 <-> 1.06) */
      @keyframes qHookWobble {
        0%, 100% { transform: translateY(0px) rotate(-6deg) scale(1); }
        50%      { transform: translateY(-1.5px) rotate(6deg) scale(1.06); }
      }

      /* 4. Phần chấm vuông bên dưới dấu ? nảy nhịp nhàng độc lập */
      @keyframes qDotBounce {
        0%, 100% { transform: translateY(0px) scale(1, 1); }
        25%      { transform: translateY(0.8px) scale(1.08, 0.92); }
        50%      { transform: translateY(-2.2px) scale(0.94, 1.08); }
        75%      { transform: translateY(0.4px) scale(1.04, 0.96); }
      }

      /* 5. Vệt sáng mờ (Sheen) lướt chéo qua mặt khối mỗi 4 giây */
      @keyframes tileSheen {
        0%, 15%   { transform: translateX(-115px) translateY(-15px) rotate(28deg); opacity: 0; }
        30%       { opacity: 1; }
        55%, 100% { transform: translateX(135px) translateY(25px) rotate(28deg); opacity: 0; }
      }

      .floor-shadow {
        transform-origin: 60px 104px;
        animation: floorShadowPulse 2.8s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
      }

      .tile-top-group {
        animation: tileFloat 2.8s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
        will-change: transform;
      }

      .q-hook {
        transform-origin: 60px 56px;
        animation: qHookWobble 2.8s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
        will-change: transform;
      }

      .q-dot {
        transform-origin: 60px 74px;
        animation: qDotBounce 2.8s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
        will-change: transform;
      }

      .sheen-bar {
        animation: tileSheen 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        will-change: transform, opacity;
      }
    </style>

    <!-- Bộ lọc làm mềm bóng đổ dưới sàn -->

    <!-- Viền highlight mảnh tập trung ở cạnh trên mặt khối -->
    <linearGradient id="topRimHighlight" x1="60" y1="14" x2="60" y2="102" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.13)" />
      <stop offset="35%" stop-color="rgba(255, 255, 255, 0.06)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>

    <!-- Gradient cho vệt sáng mờ (Sheen) lướt qua mặt khối -->
    <linearGradient id="sheenGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0)" />
      <stop offset="50%" stop-color="rgba(255, 255, 255, 0.065)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0)" />
    </linearGradient>

    <!-- ClipPath cắt gọn vệt sáng bên trong mặt khối trên -->
    <clipPath id="tileSurfaceClip">
      <rect x="16" y="14" width="88" height="88" rx="26" />
    </clipPath>
  </defs>

  <!-- 1. BÓNG ĐỔ MỀM DƯỚI SÀN (rgba(0,0,0,0.45)) -->
  <rect class="floor-shadow" x="18" y="24" width="84" height="86" rx="26" fill="rgba(0, 0, 0, 0.45)" />

  <!-- 2. PHẦN ĐẾ DÀY 3D CỐ ĐỊNH DỊCH XUỐNG 6PX (y="20", màu #0F110C) -->
  <rect x="16" y="20" width="88" height="88" rx="26" fill="#0F110C" stroke="rgba(0, 0, 0, 0.35)" stroke-width="1" />

  <!-- 3. TOÀN BỘ MẶT KHỐI TRÊN NHẤP NHÔ THỞ NHẸ (y="14", màu #1A1D16) -->
  <g class="tile-top-group">
    <!-- Bề mặt Squircle chính -->
    <rect x="16" y="14" width="88" height="88" rx="26" fill="#1A1D16" />

    <!-- Vệt sáng mờ (Sheen) được cắt bằng clipPath lướt chéo mỗi 4 giây -->
    <g clip-path="url(#tileSurfaceClip)">
      <rect class="sheen-bar" x="10" y="-30" width="38" height="170" fill="url(#sheenGrad)" />
    </g>

    <!-- Đường viền highlight mảnh ở cạnh trên (stroke="rgba(255,255,255,0.08)") -->
    <rect x="16.5" y="14.5" width="87" height="87" rx="25.5" stroke="url(#topRimHighlight)" stroke-width="1.2" />

    <!-- Dấu chấm hỏi "?" lớn ở chính giữa (Tách riêng Móc câu trên & Chấm vuông dưới) -->
    <g fill="#4F524B">
      <!-- 1. Phần móc câu trên (Lắc lư tò mò rotate(-6deg) <-> rotate(6deg), scale(1) <-> scale(1.06)) -->
      <path class="q-hook" d="M 48.8 50.8 C 49.1 44.9 53.6 41.3 60.4 41.3 C 67.0 41.3 71.3 45.0 71.3 50.2 C 71.3 54.1 69.1 56.6 65.6 59.1 C 63.4 60.6 62.7 61.8 62.7 64.5 L 62.7 66.4 L 56.4 66.4 L 56.4 63.8 C 56.4 60.1 57.8 57.9 60.9 55.7 C 63.3 54.0 64.4 52.7 64.4 50.4 C 64.4 48.0 62.7 46.5 60.1 46.5 C 57.3 46.5 55.5 48.2 55.3 51.2 L 48.8 50.8 Z" />

      <!-- 2. Phần dấu chấm vuông ở dưới (Nảy nhịp nhàng độc lập) -->
      <rect class="q-dot" x="56.2" y="70.6" width="7.4" height="6.9" rx="1.2" />
    </g>
  </g>
</svg>
