<!DOCTYPE html>
<html>
<head>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
</head>
<body class="bg-[#1A1C19] text-white p-8 font-sans m-0 flex items-center justify-center min-h-screen">
  
  <div class="border border-[#2C332A] rounded-2xl p-6 bg-[#1F241E] flex items-center gap-12 shadow-2xl">
    
    <!-- Phản xạ -->
    <div class="flex items-center gap-3 group cursor-pointer hover:bg-[#2A3129] px-4 py-2 rounded-xl transition-colors">
      <svg viewBox="0 0 100 100" class="w-7 h-7">
        <path d="M 20 30 L 80 30 L 80 65 L 45 65 L 30 80 L 30 65 L 20 65 Z M 35 48 A 3 3 0 1 0 35 48.1 M 50 48 A 3 3 0 1 0 50 48.1 M 65 48 A 3 3 0 1 0 65 48.1" fill="none" stroke="#C0DF6A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <span class="text-[#E2E3DD] font-medium text-lg tracking-wide">Phản xạ</span>
    </div>

    <!-- Divider -->
    <div class="w-[1px] h-8 bg-[#323931]"></div>

    <!-- Phát âm -->
    <div class="flex items-center gap-3 group cursor-pointer hover:bg-[#2A3129] px-4 py-2 rounded-xl transition-colors">
      <svg viewBox="0 0 100 100" class="w-7 h-7">
        <path d="M 40 25 C 40 15, 60 15, 60 25 L 60 45 C 60 55, 40 55, 40 45 Z M 30 45 C 30 65, 70 65, 70 45 M 50 63 L 50 85 M 35 85 L 65 85" fill="none" stroke="#C0DF6A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <span class="text-[#E2E3DD] font-medium text-lg tracking-wide">Phát âm</span>
    </div>

    <!-- Divider -->
    <div class="w-[1px] h-8 bg-[#323931]"></div>

    <!-- Quét từ -->
    <div class="flex items-center gap-3 group cursor-pointer hover:bg-[#2A3129] px-4 py-2 rounded-xl transition-colors">
      <svg viewBox="0 0 100 100" class="w-7 h-7">
        <path d="M 20 35 L 80 35 L 80 75 L 20 75 Z M 35 35 L 35 25 L 65 25 L 65 35 M 50 45 A 12 12 0 1 0 50 65 A 12 12 0 1 0 50 45 M 50 55 A 3 3 0 1 0 50 55.1" fill="none" stroke="#C0DF6A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <span class="text-[#E2E3DD] font-medium text-lg tracking-wide">Quét từ</span>
    </div>

  </div>

</body>
</html>
